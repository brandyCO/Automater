<script>
// Delivered (17:24). One continuous take, deterministic draw(t), loops at END.
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const END=42.0, W_=1080, H_=1920;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,u)=>a+(b-a)*u;
const sm=u=>{u=clamp(u);return u*u*u*(u*(u*6-15)+10);};
const inv=(a,b,t)=>clamp((t-a)/(b-a));
const ss=(a,b,t)=>sm(inv(a,b,t));
const bell=(a,b,t)=>{const m=(a+b)/2;return ss(a,m,t)*(1-ss(m,b,t));};
const EZ={io:sm, lin:u=>u, o:u=>1-Math.pow(1-u,3), i:u=>u*u*u, o2:u=>Math.sin(u*Math.PI/2)};
function K(keys,t){
  if(t<=keys[0][0]) return keys[0][1];
  for(let i=0;i<keys.length-1;i++){const a=keys[i],b=keys[i+1]; if(t<=b[0]){const u=(t-a[0])/(b[0]-a[0]); return lerp(a[1],b[1],(EZ[b[2]||'io'])(u));}}
  return keys[keys.length-1][1];
}
function KL(keys,t){return Math.exp(K(keys.map(k=>[k[0],Math.log(k[1]),k[2]]),t));}
const mixc=(a,b,u)=>[lerp(a[0],b[0],u),lerp(a[1],b[1],u),lerp(a[2],b[2],u)];
const rgb=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const hx=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}

// ---------------- timeline ----------------
const TR={
 lean:[[0,.25],[1.12,.25],[1.5,-.22,'o'],[2.7,-.2],[3.3,.14],[4.85,.16],[5.02,.22],[5.42,1.0,'i'],[5.6,.96,'o'],[10.7,.97],[11.9,.42],[13.0,.38],[15.6,.36],[17.0,.34],[17.7,.3],[19.2,.3],[22.5,.16],[26,.04],[31,-.14],[38.6,-.14],[40.6,.25],[42,.25]],
 pitch:[[0,.38],[1.12,.38],[1.5,-.12,'o'],[2.7,-.1],[3.3,.32],[4.9,.36],[5.42,1,'i'],[10.7,1],[11.9,.25],[12.4,.38],[14.1,.38],[14.45,.02],[15.3,.02],[15.75,.4],[17.0,.42],[17.7,.55],[19.6,.55],[21.8,.22],[25.8,.2],[27.0,.04],[30.6,.02],[32.6,-.14],[38.6,-.14],[40.6,.38],[42,.38]],
 turn:[[0,0],[14.1,0],[14.55,.6],[15.3,.6],[15.75,0],[26.1,0],[27.1,.55],[30.6,.55],[31.8,0],[42,0]],
 lid:[[0,.32],[1.12,.32],[1.5,.5],[2.7,.5],[3.3,.36],[5.2,.42],[5.5,.85],[10.7,.85],[11.9,.5],[15.6,.42],[16.9,.62],[17.7,.9],[25.2,.9],[26.1,.22],[30.6,.25],[32.4,1.0],[38.6,1.0],[40.0,.4],[42,.32]],
 lookX:[[0,0],[1.5,-.3],[2.7,-.3],[3.3,0],[14.1,0],[14.45,.9],[15.35,.9],[15.75,0],[26.1,0],[26.9,.95],[30.6,.95],[31.7,0],[42,0]],
 lookY:[[0,.85],[1.12,.85],[1.5,-.45],[2.7,-.4],[3.3,.8],[11.9,.2],[12.4,.85],[14.1,.85],[14.45,.1],[15.4,.1],[15.8,.85],[17.7,.9],[21.8,.4],[26.1,.25],[27.0,.05],[30.6,.05],[31.7,-.3],[33,-.5],[38.6,-.5],[40.4,.85],[42,.85]],

 glow:[[0,1],[1.3,1],[1.6,.5],[3.0,.5],[3.4,.95],[5.3,.6],[5.8,.2],[11.0,.2],[12.3,.95],[15.6,.95],[17.0,.15],[18.9,.12],[38.6,0],[40.3,1],[42,1]],
 bub:[[0,1],[5.05,1],[5.45,0],[12.25,0],[12.6,1],[30.0,1],[31.2,0],[39.7,0],[40.1,1],[42,1]],
 fl:[[0,0],[16.7,0],[17.7,1],[38,1],[39,0],[42,0]],
 W:[[0,0],[19.2,0],[31,1,'o2'],[38.6,1],[40.8,0],[42,0]],
 Z:[[0,1],[7.9,1.02],[9.6,.24],[10.7,.24],[12.1,.96],[16.4,1.04],[17.6,1.18],[19.4,1.18],[23.2,.9],[27,.88],[31,.5],[38.6,.5],[40.9,1],[42,1]],
 CX:[[0,630],[7.9,630],[9.6,540],[10.7,540],[12.1,630],[16.4,610],[17.6,500],[19.4,500],[23.2,668],[27,650],[31,540],[38.6,540],[40.9,630],[42,630]],
 CY:[[0,975],[7.9,985],[9.6,960],[10.7,960],[12.1,975],[16.4,975],[17.6,975],[19.4,975],[23.2,880],[27,880],[31,585],[38.6,585],[40.9,975],[42,975]],
};
const MSG="I miss you, Dad", MSG2="Dad?";
const S1=.85, S2=13.35, CALL=3.42, CALLEND=4.8;
const KEYS2=[12.52,12.66,12.82,12.98];
const KEYS3=(()=>{const a=[];for(let i=0;i<MSG.length;i++)a.push(40.08+i*.093+(MSG[i]===' '?.03:0)+(i>11?.04:0));return a;})();
function inputText(t){
  if(t<S1) return MSG;
  if(t>=KEYS2[0]-.001&&t<S2){let n=0;for(const k of KEYS2) if(t>=k) n++; return MSG2.slice(0,n);}
  if(t>=KEYS3[0]-.001){let n=0;for(const k of KEYS3) if(t>=k) n++; return MSG.slice(0,n);}
  return '';
}
const tv=(k,t)=>K(TR[k],t);
const HITS=[[1.45,55],[5.45,85]];
function hitOff(t){let d=0;for(const[h,a]of HITS){const x=t-h;if(x<0)continue;d+=x<.1?a*sm(x/.1):a*Math.exp(-(x-.1)*3.2)*Math.cos((x-.1)*5.2);}return d;}
function blink(t){let b=0;for(const bt of [2.2,3.9,12.15,13.9,16.2,28.4]){b=Math.max(b,bell(bt,bt+.2,t));}return b;}
// every repeating motion completes whole cycles in END, so the loop seam is invisible
const PER=f=>Math.max(1,Math.round(f*END/(2*Math.PI)))*2*Math.PI/END;
const BPH=(()=>{const n=Math.round(END*200)+1,a=new Float64Array(n);let ph=0;for(let i=1;i<n;i++){const t=(i-.5)/200;ph+=1/(200*lerp(3.6,5.4,K(TR.W,t)));a[i]=ph;}const k=Math.round(ph)/ph;for(let i=0;i<n;i++)a[i]*=k;return a;})();
function breath(t){const x=clamp(t,0,END)*200, i=Math.min(Math.floor(x),BPH.length-2), u=x-i; return Math.sin(2*Math.PI*lerp(BPH[i],BPH[i+1],u));}
// the father: gathers 20.2-22.2, looks at his son, dissolves upward 25.0-27.8
const FA=t=>ss(20.3,22.3,t), FD=t=>ss(24.6,27.5,t);

// ---------------- camera ----------------
function cam(t){
  const Z=KL(TR.Z,t), W=tv('W',t);
  let CX=tv('CX',t), CY=tv('CY',t);
  const drift=(1-W)*(1-ss(16.6,17.6,t)*(1-ss(19.3,20,t)));
  CX+= (2.2*Math.sin(t*PER(.61))+1.3*Math.sin(t*PER(1.37)+1))*drift/Z;
  CY+= (1.8*Math.sin(t*PER(.53)+2)+1.1*Math.sin(t*PER(1.11)))*drift/Z;
  CY-= hitOff(t)/Z;
  return {Z,CX,CY};
}
function setCam(c){ctx.setTransform(c.Z,0,0,c.Z,540-c.CX*c.Z,960-c.CY*c.Z);}
const toScr=(c,x,y)=>[540+(x-c.CX)*c.Z,960+(y-c.CY)*c.Z];

// ---------------- palette ----------------
const P={skin:hx('#e3a87b'),skinD:hx('#c98b60'),hair:hx('#221710'),beard:hx('#2a1b13'),shirt:hx('#8f969f'),shirtD:hx('#767c86'),
 seat:hx('#2f3339'),seatH:hx('#3b4047'),ceil:hx('#3c3f45'),dash:hx('#25282d'),wheel:hx('#1c1e22'),paint:hx('#3e5e7c'),paintD:hx('#2d4862'),paintH:hx('#5d7f9e')};

// ---------------- sky & world (blue hour -> golden morning light) ----------------
function skyCols(W){return {top:mixc([34,46,78],[236,176,118],W), bot:mixc([104,104,132],[255,226,178],W)};}
const STARS=(()=>{const R=rng(1724),a=[];for(let i=0;i<70;i++)a.push({x:R()*1080,y:R()*900,r:.8+R()*1.8,p:R()*6});return a;})();
function drawSky(t,W){
  ctx.setTransform(1,0,0,1,0,0); const s=skyCols(W);
  const g=ctx.createLinearGradient(0,0,0,H_); g.addColorStop(0,rgb(s.top)); g.addColorStop(.55,rgb(mixc(s.top,s.bot,.7))); g.addColorStop(1,rgb(s.bot)); ctx.fillStyle=g; ctx.fillRect(0,0,W_,H_);
  // the last band of dusk low on the horizon
  const hz=ctx.createLinearGradient(0,500,0,1100); hz.addColorStop(0,'rgba(200,140,150,0)'); hz.addColorStop(1,`rgba(214,150,140,${.22*(1-W)})`); ctx.fillStyle=hz; ctx.fillRect(0,0,W_,H_);
  // stars fade as the light comes
  const sa=1-ss(0,.35,W); if(sa>0){for(const st of STARS){const tw=.65+.35*Math.sin(t*PER(1.3)+st.p); ctx.fillStyle=`rgba(235,240,255,${.55*sa*tw})`; ctx.beginPath(); ctx.arc(st.x,st.y,st.r,0,7); ctx.fill();}}
  if(W>0){const r=ctx.createRadialGradient(860,560,0,860,560,1100); r.addColorStop(0,`rgba(255,240,205,${.75*W})`); r.addColorStop(.35,`rgba(255,214,150,${.35*W})`); r.addColorStop(1,'rgba(255,200,140,0)'); ctx.fillStyle=r; ctx.fillRect(0,0,W_,H_);}
  const R=rng(7); ctx.save();
  for(let i=0;i<12;i++){const bx=R()*1500-200, by=R()*900-100, rr_=220+R()*260, sp=(R()-.5)*4; const part=(bx<540?-1:1)*W*420;
    const x=bx+sp*7*Math.sin(t*PER(.15))+part, y=by-W*120, a=(.10+R()*.10)*(1-W*.85);
    const g2=ctx.createRadialGradient(x,y,0,x,y,rr_); const cc=mixc([84,92,124],[255,236,210],W); g2.addColorStop(0,rgb(cc,a)); g2.addColorStop(1,rgb(cc,0)); ctx.fillStyle=g2; ctx.fillRect(x-rr_,y-rr_,rr_*2,rr_*2);}
  ctx.restore();
}
function drawWorld(t,c,W){
  setCam(c);
  const fog=mixc([62,70,98],[236,196,150],W);
  ctx.fillStyle=rgb(fog,.95); const Rb=rng(11); let x=-2600;
  while(x<3700){const w=180+Rb()*320,h=60+Rb()*170; ctx.fillRect(x,710-h,w,h+2); x+=w+Rb()*60;}
  // a few warm windows in the far buildings at dusk
  const Rw=rng(12); for(let i=0;i<26;i++){const wx=-2400+Rw()*5900, wy=600+Rw()*90; ctx.fillStyle=`rgba(255,206,140,${.55*(1-W)*(.5+.5*Rw())})`; ctx.fillRect(wx,wy,14,16);}
  ctx.fillStyle=rgb(mixc([50,58,80],[214,170,124],W),.95); x=-2600; while(x<3700){const w=120+Rb()*200,h=30+Rb()*70; ctx.beginPath(); ctx.ellipse(x,710,w,h,0,Math.PI,0); ctx.fill(); x+=w*1.4;}
  const g=ctx.createLinearGradient(0,708,0,4200); g.addColorStop(0,rgb(mixc([66,70,90],[214,176,134],W))); g.addColorStop(.25,rgb(mixc([42,46,60],[150,118,92],W))); g.addColorStop(1,rgb(mixc([28,30,40],[104,82,66],W)));
  ctx.fillStyle=g; ctx.fillRect(-4000,708,9000,4000);
  // pools of lamp light on the road at dusk
  for(const [px,py,rx,ry] of [[-1350,1450,700,90],[2450,1420,700,90]]){
    const pg=ctx.createRadialGradient(px,py,0,px,py,rx); pg.addColorStop(0,`rgba(255,196,120,${.30*(1-W)})`); pg.addColorStop(1,'rgba(255,196,120,0)'); ctx.save(); ctx.translate(px,py); ctx.scale(1,ry/rx); ctx.translate(-px,-py); ctx.fillStyle=pg; ctx.beginPath(); ctx.arc(px,py,rx,0,7); ctx.fill(); ctx.restore();}
  ctx.strokeStyle=rgb(mixc([150,154,170],[255,240,214],W),.45); ctx.lineCap='round';
  for(const bx of [-1650,-700,1780,2730]){ctx.lineWidth=26; ctx.beginPath(); ctx.moveTo(540+(bx-540)*.42,900); ctx.lineTo(bx,2600); ctx.stroke();}
  ctx.lineWidth=22; ctx.beginPath(); ctx.moveTo(-2200,2600); ctx.lineTo(3300,2600); ctx.stroke();
  for(const lx of [-1500,2600]){ctx.fillStyle=rgb(mixc([44,48,62],[120,96,80],W)); ctx.fillRect(lx-14,-600,28,1900); const ax=lx<0?190:-190; ctx.fillRect(lx-14,-600,ax,22);
    const hx_=lx+ax*.92, la=1-W; if(la>0){ctx.fillStyle=`rgba(255,226,170,${.95*la})`; ctx.beginPath(); ctx.ellipse(hx_,-572,34,12,0,0,7); ctx.fill();
      const lg=ctx.createRadialGradient(hx_,-560,0,hx_,-560,420); lg.addColorStop(0,`rgba(255,206,140,${.35*la})`); lg.addColorStop(1,'rgba(255,206,140,0)'); ctx.fillStyle=lg; ctx.fillRect(hx_-420,-980,840,840);}}
  const sh=ctx.createRadialGradient(540,2070,0,540,2070,1000); sh.addColorStop(0,'rgba(8,10,14,.6)'); sh.addColorStop(1,'rgba(8,10,14,0)');
  ctx.save(); ctx.translate(540,2070); ctx.scale(1,.12); ctx.translate(-540,-2070); ctx.fillStyle=sh; ctx.beginPath(); ctx.arc(540,2070,1000,0,7); ctx.fill(); ctx.restore();
}

// ---------------- car ----------------
const WS=[[40,250],[1040,250],[1170,1335],[-90,1335]];
function wsPath(){ctx.beginPath(); ctx.moveTo(110,250); ctx.lineTo(970,250); ctx.quadraticCurveTo(1040,250,1048,318); ctx.lineTo(1170,1335); ctx.lineTo(-90,1335); ctx.lineTo(32,318); ctx.quadraticCurveTo(40,250,110,250); ctx.closePath();}
function drawCarBody(t,W){
  const pc=mixc(P.paint,[96,120,140],0), pd=P.paintD;
  // wheels
  ctx.fillStyle='#121316'; rr(-300,1850,230,220,40); ctx.fill(); rr(1150,1850,230,220,40); ctx.fill();
  // mirrors
  ctx.fillStyle=fc(pd); ctx.beginPath(); ctx.ellipse(-360,1215,120,72,-.12,0,7); ctx.fill(); ctx.beginPath(); ctx.ellipse(1440,1215,120,72,.12,0,7); ctx.fill();
  ctx.fillStyle=fc(pc); ctx.beginPath(); ctx.ellipse(-360,1205,112,62,-.12,0,7); ctx.fill(); ctx.beginPath(); ctx.ellipse(1440,1205,112,62,.12,0,7); ctx.fill();
  // body
  ctx.beginPath(); ctx.moveTo(80,168); ctx.lineTo(1000,168); ctx.quadraticCurveTo(1090,170,1100,262); ctx.lineTo(1250,1290); ctx.quadraticCurveTo(1410,1310,1416,1400);
  ctx.lineTo(1416,1870); ctx.quadraticCurveTo(1410,1950,1320,1952); ctx.lineTo(-240,1952); ctx.quadraticCurveTo(-330,1950,-336,1870); ctx.lineTo(-336,1400); ctx.quadraticCurveTo(-330,1310,-170,1290); ctx.lineTo(-20,262); ctx.quadraticCurveTo(-10,170,80,168); ctx.closePath();
  const g=ctx.createLinearGradient(0,160,0,1960); g.addColorStop(0,fc(P.paintH)); g.addColorStop(.12,fc(pc)); g.addColorStop(.62,fc(pc)); g.addColorStop(1,fc(pd)); ctx.fillStyle=g; ctx.fill();

  ctx.beginPath(); ctx.moveTo(-150,1345); ctx.lineTo(1230,1345); ctx.lineTo(1380,1640); ctx.lineTo(-300,1640); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.14)'; ctx.lineWidth=6; ctx.beginPath(); ctx.moveTo(-300,1645); ctx.quadraticCurveTo(540,1675,1380,1645); ctx.stroke();
  // headlights, grille, bumper
  const hl=mixc([206,214,222],[255,240,210],W);
  ctx.fillStyle='#1b2028'; rr(-262,1690,400,108,46); ctx.fill(); rr(942,1690,400,108,46); ctx.fill();
  ctx.fillStyle=rgb(hl,.9); rr(-246,1704,368,80,38); ctx.fill(); rr(958,1704,368,80,38); ctx.fill();
  ctx.fillStyle='#1a1e25'; rr(270,1712,540,120,40); ctx.fill();
  ctx.fillStyle=fc(pd); rr(-320,1860,1720,90,40); ctx.fill();

}
function rr(x,y,w,h,r){ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();}
// ---------------- the man ----------------
function ik(sx,sy,hx_,hy,l1,l2,side){
  let dx=hx_-sx, dy=hy-sy, d=Math.hypot(dx,dy); const dd=Math.min(d,l1+l2-1);
  const a=Math.atan2(dy,dx), c=clamp((l1*l1+dd*dd-l2*l2)/(2*l1*dd),-1,1), b=Math.acos(c);
  const ang=a+side*b; return [sx+Math.cos(ang)*l1, sy+Math.sin(ang)*l1];
}
function pose(t){
  const f=tv('lean',t), p=tv('pitch',t), turn=tv('turn',t), br=breath(t), W=tv('W',t);
  const heave=bell(5.5,10.8,t)*Math.sin((t-5.5)*2*Math.PI/2.6)*.5+.5*bell(5.5,10.8,t);
  const exhale=bell(26.4,29.4,t);
  const cx=470+turn*8;
  const shY=880+(f>0?f*320:f*70)-br*lerp(4.5,3,W)+heave*7+exhale*10;
  const shW=205*(1+Math.max(f,0)*.12);
  const hxp=470+turn*22, hyp=(f>0?655+f*385:655+f*95)-br*lerp(3,2,W)+heave*5+exhale*6;
  const hs=1+Math.max(f,0)*.1+Math.min(f,0)*.14;
  // phone + hands
  const py=tv('py',t), flat=tv('flat',t), wh=tv('wheel',t);
  const shake=((1-ss(.62,.8,t))+ss(41.55,41.85,t))*Math.sin(t*PER(41))*1.6;
  const px=470+shake;
  let hl=[px-86,py+28], hr=[px+86,py+28];
  // dua: cupped palms together under the phone
  hl=[lerp(hl[0],470-62,flat),lerp(hl[1],py+34,flat)]; hr=[lerp(hr[0],470+62,flat),lerp(hr[1],py+34,flat)];
  // collapsed: forearms on the wheel rim either side of his head
  hl=[lerp(hl[0],470-215,wh),lerp(hl[1],1196,wh)]; hr=[lerp(hr[0],470+215,wh),lerp(hr[1],1196,wh)];
  return {f,p,turn,cx,shY,shW,hxp,hyp,hs,px,py,flat,wh,hl,hr,W};
}
function drawTorso(s){
  const {cx,shY,shW}=s;
  ctx.fillStyle=fc(P.shirt);
  ctx.beginPath(); ctx.moveTo(cx-shW-20,1480); ctx.lineTo(cx-shW-4,shY+90); ctx.quadraticCurveTo(cx-shW+6,shY+8,cx-shW+90,shY); ctx.lineTo(cx+shW-90,shY); ctx.quadraticCurveTo(cx+shW-6,shY+8,cx+shW+4,shY+90); ctx.lineTo(cx+shW+20,1480); ctx.closePath(); ctx.fill();
  // soft side shade + fold
  const g=ctx.createLinearGradient(cx-shW,0,cx+shW,0); g.addColorStop(0,'rgba(0,0,0,.10)'); g.addColorStop(.3,'rgba(0,0,0,0)'); g.addColorStop(.75,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,.16)'); ctx.fillStyle=g; ctx.fill();
  // neck + collar
  ctx.fillStyle=fc(P.skinD); ctx.fillRect(s.hxp-58,s.hyp+60,116,Math.max(0,shY-s.hyp-50)); ctx.beginPath(); ctx.ellipse(cx,shY+4,62,34,0,0,7); ctx.fill();
  ctx.strokeStyle=fc(P.shirtD); ctx.lineWidth=12; ctx.beginPath(); ctx.ellipse(cx,shY+4,66,36,0,0.1,Math.PI-.1); ctx.stroke();
}
