<script>
// Fine (12:86). The lift mirror: the camera is the mirror, he faces us. One continuous take, deterministic draw(t), loops at END.
const cv=document.getElementById('c'), mctx=cv.getContext('2d'); let ctx=mctx;
const fcv=document.createElement('canvas'); fcv.width=1080; fcv.height=1920; const fctx=fcv.getContext('2d');
const END=40.0, W_=1080, H_=1920;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,u)=>a+(b-a)*u;
const sm=u=>{u=clamp(u);return u*u*u*(u*(u*6-15)+10);};
const inv=(a,b,t)=>clamp((t-a)/(b-a));
const ss=(a,b,t)=>sm(inv(a,b,t));
const bell=(a,b,t)=>{const m=(a+b)/2;return ss(a,m,t)*(1-ss(m,b,t));};
const EZ={io:sm, lin:u=>u, o:u=>1-Math.pow(1-u,3), i:u=>u*u*u, o2:u=>Math.sin(u*Math.PI/2)};
function K(keys,t){
  if(t<=keys[0][0]) return keys[0][1];
  for(let i=0;i<keys.length-1;i++){const a=keys[i],b=keys[i+1]; if(t<=b[0]){const u=(t-a[0])/(b[0]-a[0]); return lerp(a[1],b[1],(EZ[b[2]||'io'])(u));}}
  return keys[keys.length-1][1];
}
function KL(keys,t){return Math.exp(K(keys.map(k=>[k[0],Math.log(k[1]),k[2]]),t));}
const mixc=(a,b,u)=>[lerp(a[0],b[0],u),lerp(a[1],b[1],u),lerp(a[2],b[2],u)];
const rgb=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const hx=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
const wrap=t=>((t%END)+END)%END;

// ---------------- timeline ----------------
const TR={
 lean:[[0,0],[1.2,0],[1.45,.12],[2.6,.1],[3.4,.04],[4.85,.05],[5.0,.08],[5.45,.82],[5.62,.78],[7.4,.8],[8.7,.36],[10.9,.34],[11.6,.06],[12.8,.1],[14.6,.12],[15.8,.1],[17.3,.1],[18.4,.24],[20.4,.24],[22.4,.1],[24.2,0],[40,0]],
 pitch:[[0,.04],[1.2,.04],[1.45,.35],[2.6,.3],[3.4,.06],[5.0,.08],[5.45,1],[7.4,1],[8.7,.45],[10.8,.42],[11.5,.08],[12.8,.14],[14.6,.14],[14.9,-.22],[15.6,-.22],[16.0,.08],[17.3,.12],[18.4,.52],[20.4,.55],[22.4,.15],[24.2,-.04],[37.6,-.04],[39.4,.04],[40,.04]],
 turn:[[0,0],[14.6,0],[14.95,.32],[15.6,.32],[16.0,0],[40,0]],
 slump:[[0,0],[1.2,0],[1.5,.5],[2.6,.45],[3.6,.18],[5.0,.2],[5.5,.62],[7.6,.62],[8.7,.5],[11.2,.42],[11.8,.24],[12.6,.34],[14.6,.45],[17.3,.5],[18.4,.56],[20.4,.56],[23.0,.08],[25.5,-.1],[37.6,-.1],[39.6,0],[40,0]],
 S:[[0,.85],[1.2,.85],[1.42,-.35],[2.8,-.35],[3.2,-.2],[3.9,.68],[5.0,.66],[5.22,-.55],[7.6,-.6],[10.6,-.5],[11.4,-.4],[12.0,.5],[12.4,.46],[12.75,-.3],[13.4,-.32],[13.8,.36],[14.3,.34],[14.6,-.36],[15.8,-.4],[16.4,.12],[17.1,.1],[17.6,-.45],[20.4,-.4],[22.0,-.05],[24.0,.6],[37.6,.6],[38.7,.3],[39.5,.85],[40,.85]],
 teeth:[[0,1],[1.2,1],[1.36,0],[3.3,0],[3.9,.75],[5.0,.75],[5.18,0],[11.6,0],[12.0,.5],[12.45,.45],[12.7,0],[13.6,0],[13.9,.32],[14.35,.3],[14.6,0],[16.3,0],[16.6,.1],[17.1,.08],[17.4,0],[38.9,0],[39.6,1],[40,1]],
 eyeS:[[0,0],[21.8,0],[24.2,.62],[37.6,.62],[38.9,0],[40,0]],
 trem:[[0,0],[4.95,0],[5.12,1],[5.7,.6],[7.6,.45],[8.7,.2],[12.4,0],[12.55,.8],[13.0,.2],[14.4,0],[14.55,.6],[15.3,.2],[16.6,.3],[17.2,.65],[17.7,.3],[18.5,0],[40,0]],
 lid:[[0,.28],[1.2,.28],[1.45,.5],[2.6,.48],[3.6,.3],[5.0,.32],[5.4,.9],[7.6,.9],[8.7,.55],[11.4,.42],[14.6,.45],[14.9,.2],[15.6,.22],[16.0,.45],[17.3,.55],[17.9,1.0],[20.6,1.0],[22.0,.7],[23.6,.4],[37.6,.4],[39.0,.3],[40,.28]],
 brow:[[0,.7],[1.2,.7],[1.4,1],[3.6,.8],[5.0,.82],[5.3,1],[17.4,1],[20.4,.9],[22.2,.3],[24.2,0],[37.6,0],[39.4,.7],[40,.7]],
 wet:[[0,.25],[1.2,.25],[1.6,.5],[5.0,.55],[5.6,.8],[17.0,1],[19.0,.9],[24,.3],[37.6,.3],[40,.25]],
 lookX:[[0,0],[14.6,0],[14.9,.85],[15.6,.85],[16.0,0],[40,0]],
 lookY:[[0,0],[1.2,0],[1.45,.7],[2.8,.6],[3.6,0],[5.0,0],[5.4,.9],[10.6,.8],[11.4,.05],[14.6,.05],[14.9,-.35],[15.6,-.35],[16.0,0],[17.3,.15],[17.9,.6],[22.0,.4],[23.6,0],[40,0]],
 talk:[[0,0],[17.7,0],[18.0,1],[18.9,1],[19.2,0],[40,0]],
 W:[[0,0],[19.4,0],[31,1,'o2'],[37.6,1],[39.8,0],[40,0]],
 door:[[0,0],[23.3,0],[25.6,1],[37.4,1],[38.9,0],[40,0]],
 Z:[[0,1],[7.9,1.02],[9.7,.52],[10.8,.52],[12.0,.98],[15.0,1.0],[17.6,1.12],[19.6,1.2],[21.6,1.16],[24.0,1.06],[25.4,1.04],[31,.74],[37.6,.74],[39.8,1],[40,1]],
 CX:[[0,505],[7.9,505],[9.7,520],[10.8,520],[12.0,505],[40,505]],
 CY:[[0,920],[7.9,925],[9.7,1250],[10.8,1250],[12.0,925],[15.0,925],[17.6,935],[19.6,945],[21.6,940],[24.0,925],[25.4,925],[31,600],[37.6,600],[39.8,920],[40,920]],
};
const tv=(k,t)=>K(TR[k],t);
const HITS=[[1.2,40],[5.0,78]];
function hitOff(t){let d=0;for(const[h,a]of HITS){const x=t-h;if(x<0)continue;d+=x<.1?a*sm(x/.1):a*Math.exp(-(x-.1)*3.2)*Math.cos((x-.1)*5.2);}return d;}
function blink(t){let b=0;for(const bt of [2.3,3.5,11.3,16.1,28.5,33.8]){b=Math.max(b,bell(bt,bt+.2,t));}return b;}
// loop-safe breathing: whole numbers of breaths per loop, slow breaths blend in with the light
function breath(t){const W=tv('W',t);return lerp(Math.sin(2*Math.PI*11*t/END),Math.sin(2*Math.PI*8*t/END),W);}

// hand poses: positions are computed live from the body
const HP=[[0,'collar'],[1.2,'collar'],[1.62,'side'],[2.6,'side'],[3.3,'collar'],[5.0,'collar'],[5.45,'rail'],[10.9,'rail'],[11.6,'collar'],[12.6,'collar'],[13.0,'side'],[13.3,'side'],[13.75,'cheek'],[14.35,'cheek'],[14.75,'side'],[17.3,'side'],[18.3,'dua'],[24.6,'dua'],[26.4,'side'],[38.6,'side'],[39.5,'collar'],[40,'collar']];

// ---------------- the lift: physics ----------------
// lift speed (floors per second, normalised): steady climb, eases to a stop at the top, starts again at the loop
function liftV(t){return 1-ss(20.6,22.3,t)+ss(39.0,40.0,t);}
// acceleration felt in the cabin (px/s^2, positive = cabin pushed up): the jolt at hit 1, the stop, the start
function liftA(t){
  t=wrap(t); let a=0;
  const j=t-1.2; a+= 5200*Math.exp(-j*j/(2*.035*.035))*(j/.035)*-1;      // a short bump as it passes a floor
  a+= -900*bell(20.6,22.3,t);                                            // braking (feels lighter)
  a+= 900*bell(39.0,40.0,t);                                             // starting (feels heavier)
  return a;
}
// a damped spring for his knees/body and a pendulum for the tie, integrated from rest 6 s back (loop-safe, deterministic)
const SIMC=new Map();
function sim(t){
  const key=Math.round(t*960); if(SIMC.has(key)) return SIMC.get(key);
  const dt=1/480; let y=0,vy=0, th=0,vth=0; const w1=2*Math.PI*1.5, z1=.32, w2=2*Math.PI*1.1, z2=.12;
  let pcx=null, pv=0;
  for(let s=t-6; s<=t+1e-9; s+=dt){
    const a=liftA(s); vy+=(-w1*w1*y-2*z1*w1*vy+a*.012)*dt; y+=vy*dt;
    // tie driven by sideways chest acceleration and by the chest tipping (asymmetric bow)
    const cx=chestX(s), pit=wrap(s); const ax=(pcx===null?0:((cx-pcx)/dt-pv)/dt); pv=(pcx===null?0:(cx-pcx)/dt); pcx=cx;
    vth+=(-w2*w2*th-2*z2*w2*vth-ax*.0012+dLean(s)*6.4)*dt; th+=vth*dt;
  }
  const r={bob:y, tie:clamp(th,-.5,.5)}; if(SIMC.size>20000) SIMC.clear(); SIMC.set(key,r); return r;
}
function chestX(s){s=wrap(s); return tv('turn',s)*8+Math.sin(s*2*Math.PI*4/END)*1.5;}
function dLean(s){s=wrap(s); const e=.01; return ((tv('lean',s+e)-tv('lean',s-e))/(2*e))*Math.sin(1.3)*.25+((tv('slump',s+e)-tv('slump',s-e))/(2*e))*.15;}

// ---------------- camera ----------------
function cam(t){
  const Z=KL(TR.Z,t), W=tv('W',t);
  let CX=tv('CX',t), CY=tv('CY',t);
  const drift=(1-W)*(1-ss(17.2,18.2,t)*(1-ss(20.6,21.4,t)));
  const q=2*Math.PI/END; CX+= (2.0*Math.sin(t*q*4)+1.2*Math.sin(t*q*9+1))*drift/Z;
  CY+= (1.6*Math.sin(t*q*3+2)+1.0*Math.sin(t*q*7))*drift/Z;
  CY-= hitOff(t)/Z;
  return {Z,CX,CY};
}
function setCam(c){ctx.setTransform(c.Z,0,0,c.Z,540-c.CX*c.Z,960-c.CY*c.Z);}
const toScr=(c,x,y)=>[540+(x-c.CX)*c.Z,960+(y-c.CY)*c.Z];

// ---------------- palette ----------------
const P={skin:hx('#e3a87b'),skinD:hx('#c98b60'),hair:hx('#221710'),beard:hx('#2a1b13'),shirt:hx('#a9b6c4'),shirtD:hx('#77859a'),tie:hx('#2b3a55'),tieD:hx('#1e2a40'),
 pants:hx('#3a3f48'),pantsD:hx('#2c3038'),shoe:hx('#1a1612')};
const fc=(c,a=1)=>rgb(c,a);

// ---------------- the cabin (one-point perspective box; far wall = the doors) ----------------
const NB={x0:-1300,x1:2240,y0:-1500,y1:3900}, FB={x0:-150,x1:1090,y0:150,y1:2200};
const DOOR={x0:215,x1:725,y0:470,y1:2200};
function quad(a,b,c,d){ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.lineTo(c[0],c[1]); ctx.lineTo(d[0],d[1]); ctx.closePath();}
function drawCabin(t,c,W){
  setCam(c);
  const D=tv('door',t);
  const steel=mixc([104,112,124],[176,150,124],W*.8), steelD=mixc([74,80,92],[134,110,92],W*.8);
  // ceiling
  ctx.fillStyle=rgb(mixc([62,66,74],[120,100,86],W*.7)); quad([NB.x0,NB.y0],[NB.x1,NB.y0],[FB.x1,FB.y0],[FB.x0,FB.y0]); ctx.fill();
  // the ceiling light panel (cool, steady)
  const lp_=mixc([214,226,240],[255,236,206],W*.6);
  ctx.fillStyle=rgb(lp_,.9); quad([90,-300],[850,-300],[760,40],[180,40]); ctx.fill();
  const lg=ctx.createRadialGradient(470,-120,0,470,-120,900); lg.addColorStop(0,rgb(lp_,.22)); lg.addColorStop(1,rgb(lp_,0)); ctx.fillStyle=lg; ctx.fillRect(-500,-600,1940,1400);
  // side walls: brushed steel panels with vertical seams
  for(const side of [-1,1]){
    const nx=side<0?NB.x0:NB.x1, fx=side<0?FB.x0:FB.x1;
    const wood=mixc([96,72,58],[170,124,90],W*.8), woodD=mixc([58,44,38],[120,86,64],W*.8);
    const g=ctx.createLinearGradient(nx,0,fx,0); g.addColorStop(0,rgb(woodD)); g.addColorStop(1,rgb(wood)); ctx.fillStyle=g;
    quad([nx,NB.y0],[fx,FB.y0],[fx,FB.y1],[nx,NB.y1]); ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.18)'; ctx.lineWidth=5;
    for(const u of [.33,.66]){const x=lerp(nx,fx,u), y0=lerp(NB.y0,FB.y0,u), y1=lerp(NB.y1,FB.y1,u); ctx.beginPath(); ctx.moveTo(x,y0); ctx.lineTo(x,y1); ctx.stroke();}
    // side handrail
    ctx.strokeStyle=rgb(mixc([150,158,170],[230,206,170],W*.8),.8); ctx.lineWidth=18; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(lerp(nx,fx,.08),lerp(1820,1430,.08)); ctx.lineTo(lerp(nx,fx,.92),lerp(1820,1430,.92)); ctx.stroke();
  }
  // floor
  const fg=ctx.createLinearGradient(0,FB.y1,0,NB.y1); fg.addColorStop(0,rgb(mixc([66,68,74],[150,120,96],W*.7))); fg.addColorStop(1,rgb(mixc([40,42,48],[96,76,62],W*.7)));
  ctx.fillStyle=fg; quad([FB.x0,FB.y1],[FB.x1,FB.y1],[NB.x1,NB.y1],[NB.x0,NB.y1]); ctx.fill();
  // far wall
  const wg=ctx.createLinearGradient(0,FB.y0,0,FB.y1); wg.addColorStop(0,rgb(mixc(steel,[150,154,162],.2))); wg.addColorStop(1,rgb(steelD)); ctx.fillStyle=wg; ctx.fillRect(FB.x0,FB.y0,FB.x1-FB.x0,FB.y1-FB.y0);
  // beyond the doors: a bright, warm morning corridor
  if(D>0){
    ctx.save(); ctx.beginPath(); ctx.rect(DOOR.x0,DOOR.y0,DOOR.x1-DOOR.x0,DOOR.y1-DOOR.y0); ctx.clip();
    const bg=ctx.createLinearGradient(0,DOOR.y0,0,DOOR.y1); bg.addColorStop(0,'rgb(255,236,204)'); bg.addColorStop(.62,'rgb(255,222,176)'); bg.addColorStop(1,'rgb(226,180,134)');
    ctx.fillStyle=bg; ctx.fillRect(DOOR.x0,DOOR.y0,DOOR.x1-DOOR.x0,DOOR.y1-DOOR.y0);
    // a tall window far away, the floor running to it
    ctx.fillStyle='rgba(255,250,236,.95)'; ctx.fillRect(400,800,140,560);
    ctx.fillStyle='rgba(214,170,126,.55)'; quad([DOOR.x0,DOOR.y1],[DOOR.x1,DOOR.y1],[560,1420],[380,1420]); ctx.fill();
    const wgl=ctx.createRadialGradient(470,1080,0,470,1080,520); wgl.addColorStop(0,'rgba(255,248,226,.9)'); wgl.addColorStop(1,'rgba(255,240,210,0)'); ctx.fillStyle=wgl; ctx.fillRect(DOOR.x0,DOOR.y0,DOOR.x1-DOOR.x0,DOOR.y1-DOOR.y0);
    ctx.restore();
  }
  // door panels slide into the wall
  const hw=(DOOR.x1-DOOR.x0)/2, slide=hw*D;
  ctx.save(); ctx.beginPath(); ctx.rect(DOOR.x0,DOOR.y0,DOOR.x1-DOOR.x0,DOOR.y1-DOOR.y0); ctx.clip();
  for(const sd of [-1,1]){
    const x0=sd<0?DOOR.x0-slide:470+slide, w=hw;
    const pg=ctx.createLinearGradient(x0,0,x0+w,0); pg.addColorStop(0,rgb(mixc(steel,[255,255,255],.10))); pg.addColorStop(.5,rgb(mixc(steel,[255,255,255],.22))); pg.addColorStop(1,rgb(mixc(steel,[0,0,0],.08)));
    ctx.fillStyle=pg; ctx.fillRect(x0,DOOR.y0,w,DOOR.y1-DOOR.y0);
    // brushed lines
    ctx.strokeStyle='rgba(255,255,255,.05)'; ctx.lineWidth=2; for(let k=1;k<9;k++){ctx.beginPath(); ctx.moveTo(x0+k*w/9,DOOR.y0); ctx.lineTo(x0+k*w/9,DOOR.y1); ctx.stroke();}
    ctx.fillStyle='rgba(0,0,0,.28)'; ctx.fillRect(sd<0?x0+w-3:x0,DOOR.y0,3,DOOR.y1-DOOR.y0);
  }
  ctx.restore();
  // door frame
  ctx.strokeStyle=rgb(steelD); ctx.lineWidth=26; ctx.strokeRect(DOOR.x0-13,DOOR.y0-13,DOOR.x1-DOOR.x0+26,DOOR.y1-DOOR.y0+13);
  ctx.strokeStyle='rgba(255,255,255,.10)'; ctx.lineWidth=4; ctx.strokeRect(DOOR.x0-24,DOOR.y0-24,DOOR.x1-DOOR.x0+48,DOOR.y1-DOOR.y0+24);
  // light pouring from the open doors onto the floor and into the cabin
  if(D>0){
    ctx.save(); ctx.globalCompositeOperation='screen';
    const a=D*.55; const og=ctx.createLinearGradient(0,DOOR.y1,0,NB.y1); og.addColorStop(0,`rgba(255,214,160,${a})`); og.addColorStop(1,'rgba(255,200,140,0)'); ctx.fillStyle=og;
    const ww=(DOOR.x1-DOOR.x0)*D;
    quad([470-ww/2,DOOR.y1],[470+ww/2,DOOR.y1],[470+ww*1.9,NB.y1],[470-ww*1.9,NB.y1]); ctx.fill();
    const hg=ctx.createRadialGradient(470,1300,0,470,1300,1300); hg.addColorStop(0,`rgba(255,220,170,${.5*D})`); hg.addColorStop(1,'rgba(255,210,160,0)'); ctx.fillStyle=hg; ctx.fillRect(-700,-200,2400,3000);
    ctx.restore();
  }
  drawLamps(t,W);
}
// floor lamps: a column beside the doors, lit one by one going up (no digits: in a mirror they would read backwards)
const NL=6, LX=862, LY0=1390, LDY=124;
function floorPos(t){return K([[0,.2],[20.6,4.872,'lin'],[22.3,5.0,'o'],[40,5.0]],t);}
function drawLamps(t,W){
  const L=floorPos(t), back=ss(38.4,39.6,t);
  ctx.fillStyle='rgba(0,0,0,.35)'; rr(LX-34,LY0-(NL-1)*LDY-120,68,(NL-1)*LDY+160,34); ctx.fill();
  // a small up arrow on top
  ctx.fillStyle=`rgba(255,230,190,${.35+.5*liftV(t)*(1-W*.3)})`; ctx.beginPath(); ctx.moveTo(LX,LY0-(NL-1)*LDY-96); ctx.lineTo(LX+18,LY0-(NL-1)*LDY-66); ctx.lineTo(LX-18,LY0-(NL-1)*LDY-66); ctx.closePath(); ctx.fill();
  for(let i=0;i<NL;i++){
    const y=LY0-i*LDY; const lit=lerp(clamp(1-Math.abs(L-i)*2.2),clamp(1-Math.abs(.2-i)*2.2),back);
    ctx.fillStyle='rgba(30,32,38,.9)'; ctx.beginPath(); ctx.arc(LX,y,21,0,7); ctx.fill(); ctx.strokeStyle='rgba(255,255,255,.10)'; ctx.lineWidth=3; ctx.stroke();
    if(lit>0){ctx.save(); ctx.globalCompositeOperation='screen'; const g=ctx.createRadialGradient(LX,y,0,LX,y,95); g.addColorStop(0,`rgba(255,200,120,${.9*lit})`); g.addColorStop(1,'rgba(255,190,110,0)'); ctx.fillStyle=g; ctx.fillRect(LX-95,y-95,190,190); ctx.restore();
      ctx.fillStyle=`rgba(255,226,170,${lit})`; ctx.beginPath(); ctx.arc(LX,y,17,0,7); ctx.fill();}
  }
}
function rr(x,y,w,h,r){ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();}

// ---------------- the man ----------------
function ik(sx,sy,hx_,hy,l1,l2,side){
  let dx=hx_-sx, dy=hy-sy, d=Math.hypot(dx,dy); const dd=clamp(d,Math.abs(l1-l2)+1,l1+l2-1);
  const a=Math.atan2(dy,dx), c=clamp((l1*l1+dd*dd-l2*l2)/(2*l1*dd),-1,1), b=Math.acos(c);
  const ang=a+side*b; return [sx+Math.cos(ang)*l1, sy+Math.sin(ang)*l1];
}
function body(t){
  const f=tv('lean',t), p=tv('pitch',t), turn=tv('turn',t), br=breath(t), W=tv('W',t), sl=tv('slump',t);
  const S_=sim(t); const bob=S_.bob;
  const heave=bell(5.4,8.8,t)*(Math.sin((t-5.4)*2*Math.PI/2.4)*.5+.5);
  const exhale=bell(23.4,26.4,t);
  const cx=470+chestX(t);
  const shY=880+(f>0?f*300:f*70)-br*lerp(4.5,3,W)+heave*7+exhale*10+sl*30+bob;
  const shW=205*(1+Math.max(f,0)*.1)*(1-sl*.03);
  const hxp=470+turn*22+chestX(t)*.6, hyp=(f>0?690+f*345:690+f*95)-br*lerp(3,2,W)+heave*5+exhale*6+sl*22+bob*.8;
  const hs=1+Math.max(f,0)*.1+Math.min(f,0)*.14;
  return {f,p,turn,cx,shY,shW,hxp,hyp,hs,W,sl,bob,tie:S_.tie,t};
}
function poseHand(name,s,side){
  const t=s.t;

// ---------------- text ----------------
const A1a='إِنَّمَا أَشْكُو بَثِّي وَحُزْنِي', A1b='إِلَى اللَّهِ', A2='وَأَعْلَمُ مِنَ اللَّهِ مَا لَا تَعْلَمُونَ';

// ---------------- frame ----------------
function draw(tr){

function events(){
