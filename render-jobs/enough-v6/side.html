<script>
// Enough (65:3). One continuous take, deterministic draw(t), loops at END.
// A man at the kitchen table at night; unpaid bills pile on his back. He turns the calculator face down
// and opens his hands. The bills float off him and settle on the table: still there, but no longer on him.
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const END=39.9, W_=1080, H_=1920;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,u)=>a+(b-a)*u;
const sm=u=>{u=clamp(u);return u*u*u*(u*(u*6-15)+10);};
const inv=(a,b,t)=>clamp((t-a)/(b-a));
const ss=(a,b,t)=>sm(inv(a,b,t));
const bell=(a,b,t)=>{const m=(a+b)/2;return ss(a,m,t)*(1-ss(m,b,t));};
const EZ={io:sm, lin:u=>u, o:u=>1-Math.pow(1-u,3), i:u=>u*u*u, o2:u=>Math.sin(u*Math.PI/2), s:u=>u*u*(3-2*u)};
function K(keys,t){
  if(t<=keys[0][0]) return keys[0][1];
  for(let i=0;i<keys.length-1;i++){const a=keys[i],b=keys[i+1]; if(t<=b[0]){const u=(t-a[0])/(b[0]-a[0]); return lerp(a[1],b[1],(EZ[b[2]||'io'])(u));}}
  return keys[keys.length-1][1];
}
function KL(keys,t){return Math.exp(K(keys.map(k=>[k[0],Math.log(k[1]),k[2]]),t));}
const mixc=(a,b,u)=>[lerp(a[0],b[0],u),lerp(a[1],b[1],u),lerp(a[2],b[2],u)];
const rgb=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const hx=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const PER=r=>2*Math.PI*Math.max(1,Math.round(r*END/(2*Math.PI)))/END;   // loop-safe angular rate (whole cycles per reel)
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}

// ---------------- timeline ----------------

 lookX:[[0,-.62],[T1,-.62],[T1+.3,-.2],[2.0,-.2],[2.5,-.62],[11.0,-.62],[11.4,0],[14.4,0],[14.9,-.5],[16.4,-.5],[17.2,-.45],[23.3,-.3],[24.3,0],[29.6,0],[30.1,-.25],[32.2,-.2],[32.6,-.6],[33.7,-.6],[34.4,-.2],[RESET-.02,-.2],[RESET,-.62,'lin'],[END,-.62]],
 lookY:[[0,.75],[T1,.75],[T1+.3,.4],[2.0,.4],[2.5,.75],[9.6,.8],[10.8,.9],[11.4,-.5],[12.6,-.55],[14.4,-.5],[14.9,.55],[16.4,.5],[17.4,-.1],[19,-.15],[23.3,-.2],[24.77,-.2],[25.91,-.7],[26.86,-.75],[29.6,-.6],[30.1,.35],[30.8,.1],[32.2,.15],[32.6,.5],[33.7,.5],[34.4,-.2],[RESET-.02,-.2],[RESET,.75,'lin'],[END,.75]],
 brow:[[0,.8],[T2,.85],[T2+.3,1.0],[11.0,.95],[13.26,.9],[15.0,.75],[17.5,.55],[20,.4],[23.3,.35],[25.72,.2],[27.42,0],[RESET-.02,0],[RESET,.8,'lin'],[END,.8]],

 CX:[[0,505],[4.6,505],[5.6,520],[6.6,520],[7.6,500],[8.4,235],[9.6,265],[10.0,300],[10.85,300],[11.75,465],[12.6,470],[14.3,420],[23.3,445],[25.06,500],[28.6,640],[34.9,650],[36.4,1395],[37.2,1395],[END,505]],
 CY:[[0,880],[4.6,880],[5.6,900],[6.6,900],[7.6,890],[8.4,945],[9.6,985],[10.0,1010],[10.85,1010],[11.75,770],[12.6,770],[14.3,760],[23.3,760],[25.06,860],[28.6,728],[34.9,728],[36.4,610],[37.2,610],[END,880]],

};
const MANUAL=new Set(['lid','lookX','lookY','brow','neckUp','W','Z','CX','CY','stretch','heart','smile','cupR','cupU','reach','hold']);
// the three dhikr hold the body still between 13.3 s and 23.3 s; everything written after 13.3 s on the v3 clock moves 10 s later
{const FR0=13.3, FSH=10; for(const k in TR){ if(MANUAL.has(k)) continue; const tab=TR[k], v=K(tab,FR0), out=[]; let ins=false;
  for(const key of tab){ if(key[0]<FR0) out.push(key); else { if(!ins){out.push([FR0,v]); out.push([FR0+FSH,v]); ins=true;} if(key[0]>FR0) out.push([key[0]+FSH,...key.slice(1)]); } }
  if(!ins){out.push([FR0,v]);} TR[k]=out; }}

const tv=(k,t)=>K(TR[k],t);
const HITS=[[T1,46],[T2,82]];
function hitOff(t){let d=0;for(const[h,a]of HITS){const x=t-h;if(x<0)continue;d+=x<.09?a*sm(x/.09):a*Math.exp(-(x-.09)*3.0)*Math.cos((x-.09)*5.0);}return d;}
function blink(t){let b=0;for(const bt of [2.2,3.3,9.4,15.2,20.3,24.8,26.2]){b=Math.max(b,bell(bt,bt+.2,t));}return b;}
const BPH=(()=>{const n=Math.round(END*240),a=new Float64Array(n+1);let c=0;for(let i=0;i<n;i++){a[i]=c;const t=(i+.5)/240;c+=1/(240*lerp(3.4,5.6,tv('W',t)));}a[n]=c;const k=Math.round(c)/c;for(let i=0;i<=n;i++)a[i]*=k;return a;})();
function breath(t){const x=clamp(t,0,END)*240,i=Math.min(Math.floor(x),BPH.length-2),u=x-i;return Math.sin(2*Math.PI*lerp(BPH[i],BPH[i+1],u));}
// calculator: finger taps and the number on its screen
const TAPS=[.2,.5,.8,2.95,3.35];
const VALS=['$1,860','$2,740','$3,480','$4,915','$9,870','$14,050'];
function tapDip(t){let d=0;for(const k of TAPS){d=Math.max(d,bell(k-.07,k+.09,t));}return d;}
function calcVal(t){if(t>=RESET) return VALS[0]; let n=0;for(const k of TAPS) if(t>=k) n++; return VALS[n];}

// ---------------- camera ----------------
function cam(t){
  const Z=KL(TR.Z,t), W=tv('W',t);
  let CX=tv('CX',t), CY=tv('CY',t);
  const drift=(1-W)*(1-ss(9.6,10.4,t)*(1-ss(12.7,13.4,t)));     // breathing handheld in the struggle, still at prayer, steady with hope
  CX+= (2.0*Math.sin(t*PER(.61))+1.2*Math.sin(t*PER(1.37)+1))*drift/Z;
  CY+= (1.6*Math.sin(t*PER(.53)+2)+1.0*Math.sin(t*PER(1.11)))*drift/Z;
  CY-= hitOff(t)/Z;
  return {Z,CX,CY};
}
function setCam(c){ctx.setTransform(c.Z,0,0,c.Z,540-c.CX*c.Z,960-c.CY*c.Z);}
const toScr=(c,x,y)=>[540+(x-c.CX)*c.Z,960+(y-c.CY)*c.Z];

// ---------------- palette ----------------
const P={skin:hx('#e3a87b'),skinD:hx('#c98b60'),hair:hx('#221710'),beard:hx('#2a1b13'),shirt:hx('#8f969f'),shirtD:hx('#767c86'),shirtL:hx('#a3aab3'),
 pants:hx('#2c3038'),wood:hx('#6b4a35'),woodD:hx('#4f3526'),woodL:hx('#83604a'),chair:hx('#3d2c22')};
const fc=(c,a=1)=>rgb(c,a);
function rr(x,y,w,h,r){ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();}
function quad(p){ctx.beginPath(); ctx.moveTo(p[0][0],p[0][1]); for(let i=1;i<p.length;i++) ctx.lineTo(p[i][0],p[i][1]); ctx.closePath();}

// ---------------- the room ----------------
const WIN={x0:960,x1:1360,y0:250,y1:860};   // window on the back wall, to his right
const TAB={by:1040,fy:1250,bl:-300,br:545,fl:-380,fr:610}; // table top (back edge y, front edge y, x extents)
function skyCols(W){return {top:mixc([18,26,44],[246,178,120],W), bot:mixc([40,52,76],[255,224,170],W)};}
function drawRoom(t,c,W){
  ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle='#000'; ctx.fillRect(0,0,W_,H_);
  setCam(c);
  // back wall
  const wall=mixc([58,64,76],[196,160,128],W);
  const g=ctx.createLinearGradient(0,-400,0,1540); g.addColorStop(0,rgb(mixc(wall,[0,0,0],.25))); g.addColorStop(.55,rgb(wall)); g.addColorStop(1,rgb(mixc(wall,[0,0,0],.12)));
  ctx.fillStyle=g; ctx.fillRect(-2600,-400,6400,1940);
  // ceiling
  ctx.fillStyle=rgb(mixc([40,44,52],[150,118,96],W)); ctx.fillRect(-2600,-1600,6400,1200);
  ctx.fillStyle='rgba(0,0,0,.18)'; ctx.fillRect(-2600,-412,6400,14);
  // floor (from the back wall toward us)
  const fl=ctx.createLinearGradient(0,1530,0,3200); fl.addColorStop(0,rgb(mixc([50,52,58],[150,116,90],W))); fl.addColorStop(1,rgb(mixc([30,32,37],[104,78,60],W)));
  ctx.fillStyle=fl; ctx.fillRect(-2600,1530,6400,2000);
  ctx.fillStyle=rgb(mixc([36,38,44],[120,92,72],W)); ctx.fillRect(-2600,1522,6400,14); // skirting
  // kitchen on the left: lower cabinets + counter, upper cabinets, fridge
  const cab=mixc([66,72,84],[214,186,156],W), cabD=mixc([50,55,64],[180,150,122],W);
  ctx.fillStyle=rgb(cab); ctx.fillRect(-1250,1010,1180,512);
  ctx.fillStyle=rgb(mixc([84,90,102],[232,214,190],W)); ctx.fillRect(-1270,985,1220,34);   // counter top
  ctx.strokeStyle=rgb(cabD); ctx.lineWidth=6; for(const x of [-960,-660,-360]){ctx.beginPath(); ctx.moveTo(x,1030); ctx.lineTo(x,1500); ctx.stroke();}
  ctx.fillStyle=rgb(cab); ctx.fillRect(-1250,-130,1060,520);
  for(const x of [-990,-720,-460]){ctx.beginPath(); ctx.moveTo(x,-110); ctx.lineTo(x,370); ctx.stroke();}
  ctx.fillStyle=rgb(cabD); for(const x of [-1010,-740,-480,-220]){rr(x-4,320,8,40,4); ctx.fill();}
  // fridge
  ctx.fillStyle=rgb(mixc([82,88,100],[226,214,200],W)); rr(-1780,-80,470,1600,30); ctx.fill();
  ctx.strokeStyle=rgb(mixc([60,64,74],[190,176,160],W)); ctx.lineWidth=6; ctx.beginPath(); ctx.moveTo(-1780,520); ctx.lineTo(-1310,520); ctx.stroke();
  ctx.fillStyle=rgb(mixc([60,64,74],[180,164,148],W)); rr(-1370,120,14,260,7); ctx.fill(); rr(-1370,600,14,320,7); ctx.fill();
  // window: night city -> dawn
  drawWindow(t,c,W);
  // a small framed picture on the wall right of the window (plain, no content)
  ctx.fillStyle=rgb(mixc([44,48,58],[170,140,110],W)); rr(1520,380,230,290,10); ctx.fill();
  ctx.fillStyle=rgb(mixc([70,78,92],[226,200,170],W)); rr(1542,402,186,246,6); ctx.fill();
  // pendant lamp over the table
  const lx=300, ly=150;
  ctx.strokeStyle='#15171b'; ctx.lineWidth=5; ctx.beginPath(); ctx.moveTo(lx,-420); ctx.lineTo(lx,ly-60); ctx.stroke();
  ctx.fillStyle=rgb(mixc([34,38,44],[90,70,56],W)); ctx.beginPath(); ctx.moveTo(lx-22,ly-64); ctx.lineTo(lx+22,ly-64); ctx.lineTo(lx+120,ly+20); ctx.quadraticCurveTo(lx,ly+34,lx-120,ly+20); ctx.closePath(); ctx.fill();
  ctx.fillStyle='rgba(255,250,236,.95)'; ctx.beginPath(); ctx.ellipse(lx,ly+22,96,13,0,0,7); ctx.fill();
}
function drawWindow(t,c,W){
  const {x0,x1,y0,y1}=WIN;
  // frame
  ctx.fillStyle=rgb(mixc([34,38,46],[150,120,96],W)); rr(x0-26,y0-26,x1-x0+52,y1-y0+52,10); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.rect(x0,y0,x1-x0,y1-y0); ctx.clip();
  const s=skyCols(W); const g=ctx.createLinearGradient(0,y0,0,y1); g.addColorStop(0,rgb(s.top)); g.addColorStop(1,rgb(s.bot)); ctx.fillStyle=g; ctx.fillRect(x0,y0,x1-x0,y1-y0);
  // the sun rising low in the window (dawn only)
  if(W>0){const sx=1260, sy=lerp(900,720,W); const r=ctx.createRadialGradient(sx,sy,0,sx,sy,520); r.addColorStop(0,`rgba(255,246,220,${W})`); r.addColorStop(.12,`rgba(255,226,170,${.85*W})`); r.addColorStop(.45,`rgba(255,190,120,${.35*W})`); r.addColorStop(1,'rgba(255,170,100,0)'); ctx.fillStyle=r; ctx.fillRect(x0,y0,x1-x0,y1-y0);}
  // stars at night
  const Rs=rng(31); for(let i=0;i<22;i++){const x=x0+Rs()*(x1-x0), y=y0+Rs()*300, a=(1-W)*(.25+.5*Rs())*(.75+.25*Math.sin(t*PER(1.3)+i)); ctx.fillStyle=`rgba(230,236,255,${a})`; ctx.beginPath(); ctx.arc(x,y,1.6+Rs()*1.4,0,7); ctx.fill();}
  // distant buildings, lit windows fading at dawn
  const Rb=rng(12); let x=x0-40; const bc=mixc([14,18,28],[176,120,92],W);
  while(x<x1+40){const w=50+Rb()*90, h=110+Rb()*220; ctx.fillStyle=rgb(bc); ctx.fillRect(x,y1-h,w,h);
    for(let yy=y1-h+16;yy<y1-10;yy+=26) for(let xx=x+10;xx<x+w-12;xx+=20){ if(Rb()<.28){ctx.fillStyle=`rgba(255,214,150,${.55*(1-W)})`; ctx.fillRect(xx,yy,8,11);} }
    x+=w+Rb()*14;}
  const ra=rainAmt(t); if(ra>0){const Rr=rng(44); ctx.strokeStyle=`rgba(190,205,230,${.32*ra})`; ctx.lineWidth=2; ctx.lineCap='round';
    for(let i=0;i<90;i++){const bx=x0-60+Rr()*(x1-x0+120), ph=Rr(), n=Math.round(14+Rr()*6); const v=((t*n/END)+ph)%1; const yy=y0-40+v*(y1-y0+80), xx=bx-v*30; ctx.beginPath(); ctx.moveTo(xx,yy); ctx.lineTo(xx-6,yy+34); ctx.stroke();}
    // drops on the glass, sliding down slowly
    for(let i=0;i<26;i++){const bx=x0+Rr()*(x1-x0), ph=Rr(), n=Math.round(2+Rr()*3), sz=2+Rr()*3.5; const v=((t*n/END)+ph)%1; const yy=y0+v*(y1-y0), a=ra*Math.sin(Math.PI*v);
      ctx.fillStyle=`rgba(200,215,240,${.45*a})`; ctx.beginPath(); ctx.ellipse(bx,yy,sz,sz*1.3,0,0,7); ctx.fill(); ctx.fillStyle=`rgba(255,255,255,${.5*a})`; ctx.beginPath(); ctx.arc(bx-sz*.3,yy-sz*.4,sz*.35,0,7); ctx.fill();
      ctx.strokeStyle=`rgba(200,215,240,${.18*a})`; ctx.lineWidth=sz*.6; ctx.beginPath(); ctx.moveTo(bx,yy-sz); ctx.lineTo(bx,yy-sz-40*v); ctx.stroke();}}
  ctx.restore();
  // cross bars and sill
  ctx.fillStyle=rgb(mixc([34,38,46],[150,120,96],W)); ctx.fillRect((x0+x1)/2-9,y0,18,y1-y0); ctx.fillRect(x0,(y0+y1)/2-60,x1-x0,16);
  ctx.fillStyle=rgb(mixc([60,66,78],[214,190,160],W)); rr(x0-50,y1+18,x1-x0+100,30,8); ctx.fill();
}
// ---------------- the man ----------------
function ik(sx,sy,hx_,hy,l1,l2,side){
  let dx=hx_-sx, dy=hy-sy, d=Math.hypot(dx,dy); const Lm=l1+l2-1, k0=Lm-40; let dd=d>k0?Lm-40*Math.exp(-(d-k0)/40):d; dd=Math.max(dd,Math.abs(l1-l2)+1);   // soft reach limit: no snap when the arm straightens
  const a=Math.atan2(dy,dx), c=clamp((l1*l1+dd*dd-l2*l2)/(2*l1*dd),-1,1), b=Math.acos(c);
  const ang=a+side*b; return [sx+Math.cos(ang)*l1, sy+Math.sin(ang)*l1];
}
const CALC={x:130,y:1140};
const HIP=[720,1225];
function qpt(A,C,B,u){const m=1-u;return [m*m*A[0]+2*m*u*C[0]+u*u*B[0], m*m*A[1]+2*m*u*C[1]+u*u*B[1]];}
function qtan(A,C,B,u){const m=1-u;const x=2*m*(C[0]-A[0])+2*u*(B[0]-C[0]), y=2*m*(C[1]-A[1])+2*u*(B[1]-C[1]); const l=Math.hypot(x,y)||1; return [x/l,y/l];}

// ---------------- probes for the glitch scan and the sound ----------------
function probe(t){
  const c=cam(t), s=pose(t); const pts={};
  const S=(x,y)=>toScr(c,x,y);
  pts.head=S(...s.hc); pts.sh=S(...s.S); pts.top=S(...s.top); pts.hn=S(...s.hn); pts.hf=S(...s.hf);
  pts.en=S(...elbowOf(s,true)); pts.ef=S(...elbowOf(s,false));
  {const sp=pose(t); pts.frm=S(sp.frm.x,sp.frm.y); pts.cup=S(sp.cup.x,sp.cup.y);}
  for(let i=0;i<NB;i++){ if(onBack(i,t)){const q=stackSlot(s,i,t); pts['b'+i]=S(q[0],q[1]);} else {const f=flight(i,t); if(f) pts['b'+i]=S(f.x,f.y); else { for(const w of [1,2]){const b=bundleState(t,w); if(b&&i>=b.k&&i<b.k+b.n){const q=bundleMembers(b,w===1?T1:T2)[i-b.k]; pts['b'+i]=S(q.x,q.y);}} } } }
  pts.calc=S(CALC.x,CALC.y-Math.sin(Math.PI*s.flip)*58);

}

}
