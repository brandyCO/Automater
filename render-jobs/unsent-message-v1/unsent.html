<script>
// The unsent message (2:186). One continuous take, deterministic draw(t), loops at END.
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const END=41.0, W_=1080, H_=1920;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,u)=>a+(b-a)*u;
const sm=u=>{u=clamp(u);return u*u*u*(u*(u*6-15)+10);};
const inv=(a,b,t)=>clamp((t-a)/(b-a));
const ss=(a,b,t)=>sm(inv(a,b,t));
const bell=(a,b,t)=>{const m=(a+b)/2;return ss(a,m,t)*(1-ss(m,b,t));};
const EZ={io:sm, lin:u=>u, o:u=>1-Math.pow(1-u,3), i:u=>u*u*u, o2:u=>Math.sin(u*Math.PI/2)};
function K(keys,t){
  if(t<=keys[0][0]) return keys[0][1];
  for(let i=0;i<keys.length-1;i++){const a=keys[i],b=keys[i+1]; if(t<=b[0]){const u=(t-a[0])/(b[0]-a[0]); return lerp(a[1],b[1],(EZ[b[2]||'io'])(u));}}
  return keys[keys.length-1][1];
}
function KL(keys,t){return Math.exp(K(keys.map(k=>[k[0],Math.log(k[1]),k[2]]),t));}
const mixc=(a,b,u)=>[lerp(a[0],b[0],u),lerp(a[1],b[1],u),lerp(a[2],b[2],u)];
const rgb=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const hx=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}

// ---------------- timeline ----------------
const TR={

 pitch:[[0,.38],[1.12,.38],[1.5,-.12,'o'],[2.7,-.1],[3.3,.32],[4.9,.36],[5.42,1,'i'],[10.7,1],[11.9,.25],[12.4,.38],[14.1,.38],[14.45,.02],[15.3,.02],[15.75,.4],[17.0,.42],[17.7,.55],[19.6,.55],[21.6,-.22],[24.5,-.26],[26.5,-.12],[38.6,-.12],[40.6,.38],[41,.38]],
 turn:[[0,0],[14.1,0],[14.55,.6],[15.3,.6],[15.75,0],[41,0]],

 lookX:[[0,0],[1.5,-.3],[2.7,-.3],[3.3,0],[14.1,0],[14.45,.9],[15.35,.9],[15.75,0],[41,0]],
 lookY:[[0,.85],[1.12,.85],[1.5,-.45],[2.7,-.4],[3.3,.8],[11.9,.2],[12.4,.85],[14.1,.85],[14.45,.1],[15.4,.1],[15.8,.85],[17.7,.9],[19.6,.9],[21.6,-.95],[24.5,-.8],[38.6,-.8],[40.4,.85],[41,.85]],
 brow:[[0,.75],[5.5,.95],[17.0,.9],[19.8,.9],[22.5,.3],[26,0],[38.6,0],[40.6,.75],[41,.75]],
 smile:[[0,0],[24.2,0],[27.2,.8],[38.6,.8],[39.8,0],[41,0]],
 py:[[0,1060],[1.12,1060],[1.55,1262,'o'],[2.7,1258],[3.3,1075],[4.9,1075],[5.12,1100],[5.62,1335,'i'],[11.0,1335],[12.3,1090],[17.0,1090],[17.7,1112],[23.5,1112],[26,1205],[38.6,1205],[40.5,1060],[41,1060]],
 flat:[[0,0],[17.0,0],[17.7,1],[38.6,1],[40.3,0],[41,0]],
 wheel:[[0,0],[5.02,0],[5.5,1,'o'],[10.8,1],[11.8,0],[41,0]],

 glow:[[0,1],[1.3,1],[1.6,.45],[3.0,.45],[3.4,.95],[5.3,.6],[5.8,.2],[11.0,.2],[12.3,.95],[15.6,.95],[17.0,.05],[38.6,0],[40.3,1],[41,1]],
 W:[[0,0],[19.2,0],[31,1,'o2'],[38.6,1],[40.8,0],[41,0]],
 R:[[0,1],[20.6,1],[27.2,0],[38.6,0],[40.6,1],[41,1]],
 Z:[[0,1],[7.9,1.02],[9.6,.24],[10.7,.24],[12.1,.96],[16.4,1.04],[17.6,1.22],[19.4,1.22],[23,1.0],[31,.5],[38.6,.5],[40.9,1],[41,1]],
 CX:[[0,505],[7.9,505],[9.6,540],[10.7,540],[12.1,505],[16.4,500],[17.6,478],[19.4,478],[23,505],[31,540],[38.6,540],[40.9,505],[41,505]],
 CY:[[0,975],[7.9,985],[9.6,960],[10.7,960],[12.1,975],[16.4,975],[17.6,960],[19.4,960],[21.6,880],[23,900],[31,585],[38.6,585],[40.9,975],[41,975]],
};
const TYPE=[[3.40,[3.48,3.60,3.69,3.86,3.95,4.03,4.21,4.30,4.38,4.49,4.60]],[12.6,[12.72,12.95,13.12]],[40.05,[40.12,40.19,40.27,40.40,40.46,40.53,40.61,40.70,40.75,40.80,40.86,40.90]]];
function nAt(t){for(const[a,ks]of TYPE){if(t>=a&&t<=ks[ks.length-1]+.001){let n=0;for(const k of ks){if(t>=k)n++;else{n+=clamp(1-(k-t)/.04)*0;break;}}return n;}} return K(TR.n,t);}
const tv=(k,t)=>k==='n'?nAt(t):K(TR[k],t);
const MSG="I'm not okay";
const HITS=[[1.45,55],[5.45,85]];
function hitOff(t){let d=0;for(const[h,a]of HITS){const x=t-h;if(x<0)continue;d+=x<.1?a*sm(x/.1):a*Math.exp(-(x-.1)*3.2)*Math.cos((x-.1)*5.2);}return d;}
function blink(t){let b=0;for(const bt of [2.2,3.9,12.15,13.5,16.2,29.0]){b=Math.max(b,bell(bt,bt+.2,t));}return b;}
function breath(t){const W=tv('W',t);const per=lerp(3.6,5.4,W);return Math.sin(2*Math.PI*t/per);}

// ---------------- camera ----------------
function cam(t){
  const Z=KL(TR.Z,t), W=tv('W',t);
  let CX=tv('CX',t), CY=tv('CY',t);
  const drift=(1-W)*(1-ss(16.6,17.6,t)*(1-ss(19.3,20,t)));
  CX+= (2.2*Math.sin(t*.61)+1.3*Math.sin(t*1.37+1))*drift/Z;
  CY+= (1.8*Math.sin(t*.53+2)+1.1*Math.sin(t*1.11))*drift/Z;
  CY-= hitOff(t)/Z;
  return {Z,CX,CY};
}
function setCam(c){ctx.setTransform(c.Z,0,0,c.Z,540-c.CX*c.Z,960-c.CY*c.Z);}
const toScr=(c,x,y)=>[540+(x-c.CX)*c.Z,960+(y-c.CY)*c.Z];

// ---------------- palette ----------------
const P={skin:hx('#e3a87b'),skinD:hx('#c98b60'),hair:hx('#221710'),beard:hx('#2a1b13'),shirt:hx('#8f969f'),shirtD:hx('#767c86'),
 seat:hx('#2f3339'),seatH:hx('#3b4047'),ceil:hx('#3c3f45'),dash:hx('#25282d'),wheel:hx('#1c1e22'),paint:hx('#3e5e7c'),paintD:hx('#2d4862'),paintH:hx('#5d7f9e')};
const fc=(c,a=1)=>rgb(c,a);

// ---------------- sky & world ----------------
function skyCols(W){return {top:mixc([92,102,114],[236,176,118],W), bot:mixc([150,158,166],[255,226,178],W)};}
function drawSky(t,W){
  ctx.setTransform(1,0,0,1,0,0); const s=skyCols(W);
  const g=ctx.createLinearGradient(0,0,0,H_); g.addColorStop(0,rgb(s.top)); g.addColorStop(1,rgb(s.bot)); ctx.fillStyle=g; ctx.fillRect(0,0,W_,H_);

  // clouds: soft heavy blobs that part as the light comes
  const R=rng(7); ctx.save();
  for(let i=0;i<16;i++){const bx=R()*1500-200, by=R()*900-100, rr=220+R()*260, sp=(R()-.5)*6; const part=(bx<540?-1:1)*W*520;
    const x=bx+sp*t+part, y=by-W*120, a=(.22+R()*.18)*(1-W*.85);
    const g2=ctx.createRadialGradient(x,y,0,x,y,rr); const cc=mixc([118,126,136],[255,236,210],W); g2.addColorStop(0,rgb(cc,a)); g2.addColorStop(1,rgb(cc,0)); ctx.fillStyle=g2; ctx.fillRect(x-rr,y-rr,rr*2,rr*2);}
  ctx.restore();
}
function drawWorld(t,c,W,R){
  setCam(c);

  ctx.fillStyle=rgb(fog,.9); const Rb=rng(11); let x=-2600;
  while(x<3700){const w=180+Rb()*320,h=60+Rb()*170; ctx.fillRect(x,710-h,w,h+2); x+=w+Rb()*60;}
  ctx.fillStyle=rgb(mixc([110,118,128],[214,170,124],W),.95); x=-2600; while(x<3700){const w=120+Rb()*200,h=30+Rb()*70; ctx.beginPath(); ctx.ellipse(x,710,w,h,0,Math.PI,0); ctx.fill(); x+=w*1.4;}
  // asphalt
  const g=ctx.createLinearGradient(0,708,0,4200); g.addColorStop(0,rgb(mixc([96,103,112],[214,176,134],W))); g.addColorStop(.25,rgb(mixc([66,72,80],[150,118,92],W))); g.addColorStop(1,rgb(mixc([46,50,57],[104,82,66],W)));
  ctx.fillStyle=g; ctx.fillRect(-4000,708,9000,4000);

  for(const [px,py,rx,ry] of [[-620,2350,360,46],[1700,2260,300,38],[300,2650,520,60],[-1400,1600,260,26],[2500,1500,220,22],[1150,3100,420,52]]){
    const pg=ctx.createRadialGradient(px,py,0,px,py,rx); pg.addColorStop(0,rgb(pc,.42)); pg.addColorStop(1,rgb(pc,0)); ctx.save(); ctx.translate(px,py); ctx.scale(1,ry/rx); ctx.translate(-px,-py); ctx.fillStyle=pg; ctx.beginPath(); ctx.arc(px,py,rx,0,7); ctx.fill(); ctx.restore();}

  ctx.strokeStyle=rgb(mixc([196,200,204],[255,240,214],W),.55); ctx.lineCap='round';
  for(const bx of [-1650,-700,1780,2730]){ctx.lineWidth=26; ctx.beginPath(); ctx.moveTo(540+(bx-540)*.42,900); ctx.lineTo(bx,2600); ctx.stroke();}
  ctx.lineWidth=22; ctx.beginPath(); ctx.moveTo(-2200,2600); ctx.lineTo(3300,2600); ctx.stroke();
  // two lamp posts
  for(const lx of [-1500,2600]){ctx.fillStyle=rgb(mixc([60,66,74],[120,96,80],W)); ctx.fillRect(lx-14,-600,28,1900); ctx.fillRect(lx-14,-600,lx<0?190:-190,22);}
  // shadow under the car
  const sh=ctx.createRadialGradient(540,2070,0,540,2070,1000); sh.addColorStop(0,'rgba(10,12,16,.55)'); sh.addColorStop(1,'rgba(10,12,16,0)');
  ctx.save(); ctx.translate(540,2070); ctx.scale(1,.12); ctx.translate(-540,-2070); ctx.fillStyle=sh; ctx.beginPath(); ctx.arc(540,2070,1000,0,7); ctx.fill(); ctx.restore();
}
// ---------------- car ----------------
const WS=[[40,250],[1040,250],[1170,1335],[-90,1335]];
function wsPath(){ctx.beginPath(); ctx.moveTo(110,250); ctx.lineTo(970,250); ctx.quadraticCurveTo(1040,250,1048,318); ctx.lineTo(1170,1335); ctx.lineTo(-90,1335); ctx.lineTo(32,318); ctx.quadraticCurveTo(40,250,110,250); ctx.closePath();}
function drawCarBody(t,W){
  const pc=mixc(P.paint,[96,120,140],0), pd=P.paintD;
  // wheels
  ctx.fillStyle='#121316'; rr(-300,1850,230,220,40); ctx.fill(); rr(1150,1850,230,220,40); ctx.fill();
  // mirrors
  ctx.fillStyle=fc(pd); ctx.beginPath(); ctx.ellipse(-360,1215,120,72,-.12,0,7); ctx.fill(); ctx.beginPath(); ctx.ellipse(1440,1215,120,72,.12,0,7); ctx.fill();
  ctx.fillStyle=fc(pc); ctx.beginPath(); ctx.ellipse(-360,1205,112,62,-.12,0,7); ctx.fill(); ctx.beginPath(); ctx.ellipse(1440,1205,112,62,.12,0,7); ctx.fill();
  // body
  ctx.beginPath(); ctx.moveTo(80,168); ctx.lineTo(1000,168); ctx.quadraticCurveTo(1090,170,1100,262); ctx.lineTo(1250,1290); ctx.quadraticCurveTo(1410,1310,1416,1400);
  ctx.lineTo(1416,1870); ctx.quadraticCurveTo(1410,1950,1320,1952); ctx.lineTo(-240,1952); ctx.quadraticCurveTo(-330,1950,-336,1870); ctx.lineTo(-336,1400); ctx.quadraticCurveTo(-330,1310,-170,1290); ctx.lineTo(-20,262); ctx.quadraticCurveTo(-10,170,80,168); ctx.closePath();
  const g=ctx.createLinearGradient(0,160,0,1960); g.addColorStop(0,fc(P.paintH)); g.addColorStop(.12,fc(pc)); g.addColorStop(.62,fc(pc)); g.addColorStop(1,fc(pd)); ctx.fillStyle=g; ctx.fill();
  // hood highlight + crease
  const hg=ctx.createLinearGradient(0,1340,0,1650); hg.addColorStop(0,'rgba(255,255,255,.10)'); hg.addColorStop(1,'rgba(255,255,255,0)'); ctx.fillStyle=hg;
  ctx.beginPath(); ctx.moveTo(-150,1345); ctx.lineTo(1230,1345); ctx.lineTo(1380,1640); ctx.lineTo(-300,1640); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.14)'; ctx.lineWidth=6; ctx.beginPath(); ctx.moveTo(-300,1645); ctx.quadraticCurveTo(540,1675,1380,1645); ctx.stroke();
  // headlights, grille, bumper
  const hl=mixc([206,214,222],[255,240,210],W);
  ctx.fillStyle='#1b2028'; rr(-262,1690,400,108,46); ctx.fill(); rr(942,1690,400,108,46); ctx.fill();
  ctx.fillStyle=rgb(hl,.9); rr(-246,1704,368,80,38); ctx.fill(); rr(958,1704,368,80,38); ctx.fill();
  ctx.fillStyle='#1a1e25'; rr(270,1712,540,120,40); ctx.fill();
  ctx.fillStyle=fc(pd); rr(-320,1860,1720,90,40); ctx.fill();
  ctx.fillStyle=rgb(mixc([200,204,210],[250,240,220],W),.9); rr(420,1866,240,64,10); ctx.fill();
}
function rr(x,y,w,h,r){ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();}

// ---------------- the man ----------------
function ik(sx,sy,hx_,hy,l1,l2,side){
  let dx=hx_-sx, dy=hy-sy, d=Math.hypot(dx,dy); const dd=Math.min(d,l1+l2-1);
  const a=Math.atan2(dy,dx), c=clamp((l1*l1+dd*dd-l2*l2)/(2*l1*dd),-1,1), b=Math.acos(c);
  const ang=a+side*b; return [sx+Math.cos(ang)*l1, sy+Math.sin(ang)*l1];
}
function pose(t){
  const f=tv('lean',t), p=tv('pitch',t), turn=tv('turn',t), br=breath(t), W=tv('W',t);
  const heave=bell(5.5,10.8,t)*Math.sin((t-5.5)*2*Math.PI/2.6)*.5+.5*bell(5.5,10.8,t);
  const exhale=bell(25.6,28.4,t);
  const cx=470+turn*8;
  const shY=880+(f>0?f*320:f*70)-br*lerp(4.5,3,W)+heave*7+exhale*10;
  const shW=205*(1+Math.max(f,0)*.12);
  const hxp=470+turn*22, hyp=(f>0?655+f*385:655+f*95)-br*lerp(3,2,W)+heave*5+exhale*6;
  const hs=1+Math.max(f,0)*.1+Math.min(f,0)*.14;
  // phone + hands
  const py=tv('py',t), flat=tv('flat',t), wh=tv('wheel',t);
  const shake=((1-ss(1.0,1.15,t))+ss(40.6,40.9,t))*Math.sin(t*41)*1.6;
  const px=470+shake;
  let hl=[px-86,py+28], hr=[px+86,py+28];
  // dua: cupped palms together under the phone
  hl=[lerp(hl[0],470-62,flat),lerp(hl[1],py+34,flat)]; hr=[lerp(hr[0],470+62,flat),lerp(hr[1],py+34,flat)];
  // collapsed: forearms on the wheel rim either side of his head
  hl=[lerp(hl[0],470-215,wh),lerp(hl[1],1196,wh)]; hr=[lerp(hr[0],470+215,wh),lerp(hr[1],1196,wh)];
  return {f,p,turn,cx,shY,shW,hxp,hyp,hs,px,py,flat,wh,hl,hr,W};
}
function drawTorso(s){
  const {cx,shY,shW}=s;
  ctx.fillStyle=fc(P.shirt);
  ctx.beginPath(); ctx.moveTo(cx-shW-20,1480); ctx.lineTo(cx-shW-4,shY+90); ctx.quadraticCurveTo(cx-shW+6,shY+8,cx-shW+90,shY); ctx.lineTo(cx+shW-90,shY); ctx.quadraticCurveTo(cx+shW-6,shY+8,cx+shW+4,shY+90); ctx.lineTo(cx+shW+20,1480); ctx.closePath(); ctx.fill();
  // soft side shade + fold
  const g=ctx.createLinearGradient(cx-shW,0,cx+shW,0); g.addColorStop(0,'rgba(0,0,0,.10)'); g.addColorStop(.3,'rgba(0,0,0,0)'); g.addColorStop(.75,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,.16)'); ctx.fillStyle=g; ctx.fill();
  // neck + collar
  ctx.fillStyle=fc(P.skinD); ctx.fillRect(s.hxp-58,s.hyp+60,116,Math.max(0,shY-s.hyp-50)); ctx.beginPath(); ctx.ellipse(cx,shY+4,62,34,0,0,7); ctx.fill();
  ctx.strokeStyle=fc(P.shirtD); ctx.lineWidth=12; ctx.beginPath(); ctx.ellipse(cx,shY+4,66,36,0,0.1,Math.PI-.1); ctx.stroke();
}
function drawArm(s,side){
  const sx=s.cx+side*(s.shW-34), sy=s.shY+52; const h=side<0?s.hl:s.hr;

  ctx.strokeStyle=fc(P.skinD); ctx.lineWidth=60; ctx.beginPath(); ctx.moveTo(e[0],e[1]); ctx.lineTo(h[0],h[1]); ctx.stroke();
  ctx.strokeStyle=fc(P.skin); ctx.lineWidth=50; ctx.beginPath(); ctx.moveTo(e[0],e[1]); ctx.lineTo(h[0],h[1]); ctx.stroke();
  const mx=lerp(sx,e[0],.78), my=lerp(sy,e[1],.78);
  ctx.strokeStyle=fc(P.shirtD); ctx.lineWidth=86; ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(mx,my); ctx.stroke();
  ctx.strokeStyle=fc(P.shirt); ctx.lineWidth=76; ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(mx,my); ctx.stroke();
  ctx.fillStyle=fc(P.skin); ctx.beginPath(); ctx.arc(e[0],e[1],27,0,7); ctx.fill();
}
function drawPhoneBack(s,t){
  // the back of the phone faces us; its screen lights his face

  ctx.save(); ctx.translate(px,py); ctx.rotate(rot);
  ctx.fillStyle='#14171c'; rr(-78,-150,156,300,30); ctx.fill();
  ctx.strokeStyle='rgba(170,190,215,.35)'; ctx.lineWidth=3; rr(-78,-150,156,300,30); ctx.stroke();
  ctx.fillStyle='#22262d'; rr(-62,-134,62,72,18); ctx.fill(); ctx.fillStyle='#0b0c0f'; ctx.beginPath(); ctx.arc(-44,-116,12,0,7); ctx.arc(-44,-82,12,0,7); ctx.fill();
  ctx.restore();
  // fingers wrapping the edges
  ctx.fillStyle=fc(P.skin); for(const sd of [-1,1]) for(let k=0;k<3;k++){ctx.beginPath(); ctx.ellipse(px+sd*70,py-30+k*34,20,15,0,0,7); ctx.fill();}
}
function drawHoldHands(s){ctx.fillStyle=fc(P.skin); for(const h of [s.hl,s.hr]){ctx.beginPath(); ctx.arc(h[0],h[1],36,0,7); ctx.fill();}}
