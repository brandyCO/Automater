@font-face{font-family:'Corm';src:url(corm.woff2) format('woff2');}

<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// ============ helpers ============
const W=1080,H=1920,G=1340;
const cv=document.getElementById('c'); let ctx=cv.getContext('2d');
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const inv=(a,b,x)=>clamp((x-a)/(b-a));
const ss=(a,b,x)=>{const t=inv(a,b,x);return t*t*(3-2*t);};
const sm=t=>t*t*t*(t*(t*6-15)+10);
const eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eout=t=>1-Math.pow(1-t,3);
const ein=t=>t*t*t;
const eback=t=>{const c1=1.4,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
const D=Math.PI/180;
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
const mixc=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);
const rgba=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${clamp(a)})`;
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const P2D=(x,y)=>[x,y];

// ============ timeline (real seconds) ============
const STORY0=5.0, XF=1.4;
// v9: each stone now knocks him down to sitting in the dirt. That takes longer, so everything after the edge moves by SH.
const SH=3.0, D2=10.6; const S=x=>x+SH;
const T={END:S(51.6),
  w1:[[0,1.3],[1.15,2.2],[2.05,3.6],[3.45,5.0]], w1at:4.75,
  w2:[[0,1.0],[.85,1.75],[1.55,2.85],[2.6,3.95]], w2at:S(43.15),
  drops:[6.0,D2], edge:S(14.0), tryA:S(14.3), tryB:S(15.9), pebble:S(14.95),
  turnBack:[S(16.1),S(16.7)], turnFwd:[S(17.3),S(17.9)], lookUp:[S(18.0),S(19.2)],
  back:[S(19.3),S(20.6)], kneel:[S(20.6),S(22.0)], sujood:[S(22.0),S(23.7)],
  light:S(24.0), beats:[S(24.6),S(25.5),S(26.4)], bloom:S(24.8),
  glow0:S(25.2), lift0:S(26.0), liftGap:.6, fly:1.5,
  sitUp:[S(29.6),S(30.6)], stand:[S(30.8),S(31.8)],
  cross:S(32.0), hop:.74, pause:.9,
  turnBack2:[99,99.5], turnFwd2:[99.6,99.9], fin:[S(43.7),S(45.2)], land:S(42.48), arrive:S(43.6), w1out:[S(30.4),S(31.6)]};
// the two blows. land = his seat hits the ground. Hit 2 is harder: he tries to get up, his legs give, he drops back.
const HITS=[
  {d:6.0, land:6.45, fold:.55, sitTill:7.7, rise:[7.7,8.95], walk:[8.75,9.3], v:44, big:0},
  {d:D2, land:D2+.36, fold:.9, sitTill:D2+1.0, tr:[D2+1.0,D2+1.62], fail:[D2+1.62,D2+1.86], sit2:D2+2.75, rise:[D2+2.75,D2+4.35], walk:[D2+4.1,D2+4.75], v:34, big:1}];
const liftT=i=>T.lift0+T.liftGap*(4-i);
const SLOW=[S(25.9),S(27.7)], SLOWK=.55; // story-time window that plays slower
const SLOW2=[-9,-8]; const warp=[]; {let tau=STORY0; for(let t=0;t<=60;t+=1/480){warp.push(tau); const b=Math.sin(Math.PI*inv(SLOW[0],SLOW[1],tau)), b2=Math.sin(Math.PI*inv(SLOW2[0],SLOW2[1],tau)); tau+=(1-SLOWK*b*b-.5*b2*b2)/480;}}
const tauAt=t=>{ if(t<0) return STORY0+t; const i=t*480, a=Math.floor(i); if(a+1>=warp.length) return warp[warp.length-1]; return lerp(warp[a],warp[a+1],i-a);};
const realOf=tau=>{ if(tau<STORY0) return tau-STORY0; let lo=0,hi=warp.length-1; while(hi-lo>1){const m=(lo+hi)>>1; if(warp[m]<tau) lo=m; else hi=m;} return lo/480;};
const REAL_END=realOf(T.END);
const dawn=t=>ss(S(25.5),S(37.5),t);

// ============ walking ============
function speed(t){
  const [h1,h2]=HITS;
  if(t<h1.d) return 50;
  if(t<h2.d) return 50*(1-ss(h1.d,h1.d+.22,t))*(t<h1.d+.3?1:0)+h1.v*ss(...h1.walk,t);
  if(t<T.edge) return h1.v*(1-ss(h2.d,h2.d+.2,t))*(t<h2.d+.3?1:0)+h2.v*ss(...h2.walk,t)*(1-ss(T.edge-.9,T.edge,t));
  return 0;
}
const DT=1/480, tab=[]; const X0=96, X_EDGE=552;
{let raw=0;for(let t=0;t<=T.END+.01;t+=DT)raw+=speed(t)*DT; const f=(X_EDGE-X0)/raw; let x=X0;for(let t=0;t<=T.END+.01;t+=DT){tab.push(x);x+=speed(t)*f*DT;}}
const walkX=t=>tab[clamp(Math.round(t/DT),0,tab.length-1)];

// bridge + footholds
const BR=[{x:628,top:1323.9},{x:671,top:1309.2},{x:712,top:1294.8},{x:776,top:1287.2},{x:836,top:1277.6}];
const PLAT_X=918, PLAT_Y=1267.4;
const KNEEL_X=440;
// stepping back from the edge: real steps with planted feet (front = foot 1)
const BACKS=[{f:0,a:550.8,b:508,t0:0,t1:.36},{f:1,a:574.8,b:470,t0:.30,t1:.70},{f:0,a:508,b:449,t0:.64,t1:1.0},{f:1,a:470,b:431,t0:.94,t1:1.3}];
function backFoot(f,t){ const u=t-T.back[0]; let x=f?574.8:550.8, lift=0;
  for(const e of BACKS){ if(e.f!==f) continue; if(u>=e.t1){x=e.b; continue;} if(u>e.t0){const q=(u-e.t0)/(e.t1-e.t0); x=lerp(e.a,e.b,eio(q)); lift=7*Math.sin(Math.PI*q);} break; }
  return {x,lift}; }
function backHip(t){ const a=backFoot(0,t), b=backFoot(1,t); const u=clamp((t-T.back[0])/1.3); return (a.x+b.x)/2-10.8*(1-sm(u)); }
//const FH=[{x:KNEEL_X-14,y:G},{x:KNEEL_X+14,y:G},{x:X_EDGE-6,y:G},...BR.map(b=>({x:b.x-2,y:b.top-12})),{x:PLAT_X+36,y:PLAT_Y},{x:PLAT_X+70,y:PLAT_Y},{x:PLAT_X+96,y:PLAT_Y}];

// ============ breathing (phase integrated) ============
function breathPeriod(t){
  let p=2.9; for(const d of T.drops) p-=1.2*Math.exp(-Math.max(0,t-d-.6)/2.2)*(t>d?1:0);
  p=lerp(p,4.6,ss(T.sujood[0],T.sujood[1],t)); p=lerp(p,3.6,ss(T.sitUp[0],T.sitUp[1],t)); return Math.max(1.4,p);
}
const btab=[]; {let ph=0;for(let t=0;t<=T.END+.01;t+=DT){btab.push(ph);ph+=2*Math.PI*DT/breathPeriod(t);}}
const breathPh=t=>btab[clamp(Math.round(t/DT),0,btab.length-1)];
function breathAmp(t){let a=2.2; for(const d of T.drops) if(t>d) a+=2.9*Math.exp(-(t-d-.6)/2.8); a=lerp(a,1.6,ss(T.sujood[0],T.sujood[1],t)); a=lerp(a,1.3,ss(S(31),S(34),t)); return a;}

// ============ poses (angles, facing right) ============
const P={
 hunch:{torso:27,head:16,thF:4,thB:4,knF:14,knB:14},
 heavy:{torso:35,head:22,thF:4,thB:4,knF:22,knB:22},
 stumble:{torso:56,head:28,thF:64,thB:-10,knF:104,knB:94},
 tryStep:{torso:26,head:38,thF:4,thB:4,knF:16,knB:16},
 lookUp:{torso:14,head:-30,thF:4,thB:4,knF:12,knB:12},
 slump:{torso:44,head:42,thF:4,thB:4,knF:20,knB:20},
 kneel:{torso:16,head:24,thF:58,thB:52,knF:148,knB:142},
 sujood:{torso:104,head:26,thF:8,thB:8,knF:88,knB:88},
 sujoodL:{torso:99,head:20,thF:8,thB:8,knF:88,knB:88},
 situp:{torso:4,head:4,thF:58,thB:52,knF:148,knB:142},
 crouch:{torso:24,head:-4,thF:42,thB:36,knF:70,knB:64},
 tall:{torso:-3,head:-8,thF:0,thB:0,knF:3,knB:3},
 buckle:{torso:50,head:30,thF:40,thB:22,knF:92,knB:82},     // knees give way
 sit:{torso:38,head:44,thF:122,thB:100,knF:84,knB:32},      // down in the dirt, one knee up, the other leg out
 sitFold:{torso:60,head:52,thF:124,thB:102,knF:88,knB:34},  // the jolt folds him over his knees
 sitSlump:{torso:33,head:62,thF:122,thB:100,knF:84,knB:32}, // sits up a little, head hanging, can't get up
 push:{torso:58,head:30,thF:72,thB:56,knF:112,knB:98},      // hand on the ground, hips up, legs under him
};
// one blow: buckle, drop to the ground, fold, sit; hit 2 also tries to rise and fails. Returns weights for figureState.
function hitPhase(h,t){
  const o={buck:0,sit:0,fold:0,slump:0,push:0,up:0,shake:0,hand:0};
  if(t<h.d) return o;
  o.buck=ss(h.d+.01,h.d+(h.big?.13:.16),t);
  const q=inv(h.d+.08,h.land,t); o.sit=q*q;                      // falls like a dead weight, stops hard on the ground
  const v=t-h.land;
  if(v>0){ o.fold=h.fold*eout(clamp(v/.22))*(1-.55*sm(inv(.3,1.3,v))); }
  o.slump=ss(h.land+.5,h.land+1.4,t);
  o.hand=ss(h.d+.2,h.land-.02,t)*(1-ss(h.land+.4,h.land+1.0,t));   // a hand slaps the ground to catch himself
  if(h.tr){ // tries to stand: hand down, hips lift, legs shake... and give way
    const a=sm(inv(h.tr[0],h.tr[1],t)), f=inv(h.fail[0],h.fail[1],t);
    const tryW=.5*a*(1-f*f);
    o.push=Math.max(o.push,tryW); o.hand=Math.max(o.hand,ss(h.tr[0]-.2,h.tr[0]+.2,t)*(1-ss(h.fail[1],h.fail[1]+.6,t)));
    o.shake=ss(h.tr[0]+.3,h.tr[1],t)*(1-ss(h.fail[0],h.fail[0]+.1,t));
    const w=t-h.fail[1]; if(w>0) o.fold=Math.max(o.fold,.7*eout(clamp(w/.2))*(1-.5*sm(inv(.3,1.2,w))));
  }
  if(h.rise){ const [r0,r1]=h.rise, R=r1-r0;
    const p=sm(inv(r0,r0+R*.6,t)); o.push=Math.max(o.push,p); o.up=sm(inv(r0+R*.5,r1,t));
    o.hand=Math.max(o.hand,ss(r0-.15,r0+.2,t)*(1-ss(r0+R*.55,r0+R*.8,t)));
    if(t>r0) o.slump*=1-ss(r0,r0+.4,t); }
  return o;
}
const hipDX=t=>{ let dx=0; for(const h of HITS){ const p=hitPhase(h,t); dx+=-42*p.sit*(1-p.push)*(1-p.up); } return dx; };
const bp=(a,b,t)=>{if(t<=0)return a;const o={};for(const k in a)o[k]=lerp(a[k],b[k],t);return o;};

// ============ figure state ============
function facingAt(t){
  const tb=(a,b)=>sm(inv(a,b,t));
  const v=tb(...T.turnBack)-tb(...T.turnFwd)+tb(...T.turnBack2)-tb(...T.turnFwd2);
  return 1;
}
function figureState(t){
  let x=walkX(t), gy=G, pose=P.hunch, ground=0, handDown=0, kneeG=0, walkW=1, carry=1, fin=0;
  const heavy=ss(T.drops[0],T.drops[0]+.8,t)*.5+ss(T.drops[1],T.drops[1]+.8,t)*.5;
  pose=bp(P.hunch,P.heavy,heavy);
  // each blow: knees give, he drops to the ground and sits there; getting up again takes everything he has
  const stand0=pose; let shake=0, sitG=0, pushG=0;
  for(const h of HITS){ const p=hitPhase(h,t); if(t<h.d) continue;
    pose=bp(pose,P.buckle,p.buck*(1-p.sit));
    pose=bp(pose,P.sit,p.sit);
    pose=bp(pose,P.sitSlump,p.slump*p.sit);
    pose=bp(pose,P.sitFold,p.fold);
    pose=bp(pose,P.push,p.push);
    pose=bp(pose,stand0,p.up);
    const down=Math.max(p.buck,p.sit)*(1-p.up);
    kneeG=Math.max(kneeG,down); sitG=Math.max(sitG,p.sit*(1-p.push)*(1-p.up));
    handDown=Math.max(handDown,p.hand); shake=Math.max(shake,p.shake); pushG=Math.max(pushG,p.push*(1-p.up));
  }
  x+=hipDX(t);
  // the edge: try to step, foot over the gap, pull back
  const tw=sm(inv(T.tryA,T.tryA+.7,t))*(1-sm(inv(T.tryB-.7,T.tryB,t)));
  pose=bp(pose,P.tryStep,tw);
  // look up at the sky
  const sl=sm(inv(T.turnBack[0],T.turnBack[0]+1.0,t))*(1-sm(inv(T.lookUp[0]-.4,T.lookUp[0]+.5,t))); pose=bp(pose,P.slump,sl);
  const lu=sm(inv(T.lookUp[0],T.lookUp[0]+.9,t))*(1-sm(inv(T.back[0]-.2,T.back[0]+.4,t)));
  pose=bp(pose,P.lookUp,lu);
  // step back from the edge
  if(t>=T.back[0]) x=backHip(t);
  // kneel: front knee first, then the back one, slowly
  const kF=sm(inv(T.kneel[0],T.kneel[0]+.9,t)), kB=sm(inv(T.kneel[0]+.45,T.kneel[1],t));
  if(kF>0){ const kp=bp(pose,P.kneel,kB); pose={...kp, thF:lerp(pose.thF,P.kneel.thF,kF), knF:lerp(pose.knF,P.kneel.knF,kF)}; kneeG=Math.max(kneeG,kF); }
  // hands to the ground first, then the forehead
  const hg=sm(inv(T.sujood[0],T.sujood[0]+.7,t)), sj=sm(inv(T.sujood[0]+.3,T.sujood[1],t));
  pose=bp(pose,P.sujood,sj); ground=Math.max(hg,sj);
  // relief as each stone leaves his back
  let rel=0; for(let i=0;i<5;i++) rel+=ss(liftT(i)+.2,liftT(i)+1.0,t)/5;
  pose=bp(pose,P.sujoodL,rel*sj);
  carry=1-ss(T.lift0,T.lift0+2.8,t);
  // sit up (pushing with hands), then stand with a small gathering crouch
  const su=sm(inv(T.sitUp[0],T.sitUp[1],t)); pose=bp(pose,P.situp,su); ground*= 1-sm(inv(T.sitUp[0]+.3,T.sitUp[1],t));
  const s1=sm(inv(T.stand[0],T.stand[0]+.5,t)); pose=bp(pose,P.crouch,s1);
  const s2=sm(inv(T.stand[0]+.3,T.stand[1]+.1,t)); pose=bp(pose,P.tall,s2);
  if(s1>0) kneeG*= 1-s1;
  // legs: walk weight
  walkW=1-Math.max(kF, tw*.0);
  if(t>=T.kneel[0]) walkW=1-Math.max(kF, ss(T.kneel[0],T.kneel[0]+.9,t));
  // crossing
  let cross=null;
  if(t>=T.stand[0]) walkW=Math.max(walkW, ss(T.stand[0]+.3,T.stand[1]+.1,t));
  if(t>=T.cross){ cross={};
    // joy: chest up, arms lift on landing
    const J={t0:0,t1:0}; const joy=ss(J.t0-.3,J.t0,t)*(1-ss(J.t1+.6,J.t1+1.4,t));
    let lean=0; if(false) for(const e of SCHED){ if(e.f!==9&&e.b.y<e.a.y-5) lean=Math.max(lean,Math.sin(Math.PI*inv(e.t0-.15,e.t1+.1,t))); } pose=bp(pose,{...P.tall,torso:8+20*lean,head:-14+10*lean},.6); carry=0;
    fin=Math.max(fin, .9*Math.sin(Math.PI*inv(J.t1,J.t1+1.3,t)));
  }
  fin=sm(inv(...T.fin,t)); pose=bp(pose,{...P.tall,head:-20,torso:-6},fin);
  // breathing
  const ba=breathAmp(t), bph=breathPh(t);
  pose={...pose, torso:pose.torso+Math.sin(bph)*ba*.9, head:pose.head-Math.sin(bph)*ba*.3};
  if(shake>0){ pose={...pose, torso:pose.torso+shake*2.4*Math.sin(t*41), thF:pose.thF+shake*3*Math.sin(t*37+1), thB:pose.thB+shake*3*Math.sin(t*43+2)}; }
  if(MC&&t>=T.cross){ const P=mcFrame(t); x=(P[1][0]+P[2][0])/2; }
  return {t,x,gy,pose,ground,handDown,kneeG,walkW,carry,fin,cross,face:facingAt(t),bph,ba,tw,sitG,shake,pushG};
}

// ============ crossing: real recorded human motion (CMU mocap, retargeted) ============
let MC=null; const MCJ={hip:0,lh:1,rh:2,lk:3,rk:4,la:5,ra:6,lt:7,rt:8,sp:9,nk:10,hd:11,he:12,ls:13,rs:14,le:15,re:16,lw:17,rw:18};
const MC_END=()=>T.cross+(MC.n-1)/MC.fps;
function mcFrame(t){ const f=clamp((t-T.cross)*MC.fps,0,MC.n-1), a=Math.floor(f), b=Math.min(a+1,MC.n-1), u=f-a; const A=MC.frames[a], B=MC.frames[b];
  return A.map((p,i)=>[lerp(p[0],B[i][0],u),lerp(p[1],B[i][1],u),lerp(p[2],B[i][2],u)]); }
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], addv=(a,b,k=1)=>[a[0]+b[0]*k,a[1]+b[1]*k,a[2]+b[2]*k], nrm=a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return [a[0]/l,a[1]/l,a[2]/l];}, mid=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2,(a[2]+b[2])/2];
function mcSkel(t){
  const P=mcFrame(t), j=MCJ;
  const hip=mid(P[j.lh],P[j.rh]); const am=mid(P[j.ls],P[j.rs]);
  const sh=addv(hip,nrm(sub(am,hip)),L.torso);
  const hc=addv(sh,nrm(sub(P[j.he],P[j.nk])),L.neck+L.hr);
  const arm=(s3,e3,w3)=>{ const so=addv(sh,sub(s3,am),.45); const e=addv(so,nrm(sub(e3,s3)),L.ua); const h=addv(e,nrm(sub(w3,e3)),L.fa); return {s:so,e,h}; };
  // after arrival: arms open, chest and face lift to the light
  let al=arm(P[j.ls],P[j.le],P[j.lw]), ar=arm(P[j.rs],P[j.re],P[j.rw]);
  const fin=sm(inv(...T.fin,t));
  if(fin>0){ const op=(a,dx,dy)=>{const e=[lerp(a.e[0],a.s[0]+dx*.55,fin),lerp(a.e[1],a.s[1]+dy*.5,fin),a.e[2]], h=[lerp(a.h[0],a.s[0]+dx,fin),lerp(a.h[1],a.s[1]+dy,fin),a.h[2]]; return {s:a.s,e,h};};
    al=op(al,24,40); ar=op(ar,-18,42); }
  const hd=[hc[0]+fin*2,hc[1]-fin*1.5,hc[2]];
  const L3={hip,lh:P[j.lh],rh:P[j.rh],lk:P[j.lk],rk:P[j.rk],la:P[j.la],ra:P[j.ra],lt:P[j.lt],rt:P[j.rt],sh,head:hd,al,ar};
  return L3;
}
// 2D skeleton in the old layout (for the scarf, stones, camera), plus the 3D joints for drawing
function mcToSk(m){ const two=p=>[p[0],p[1]];
  let legs=[[m.lk,m.la,m.lt,m.lh],[m.rk,m.ra,m.rt,m.rh]], arms=[m.al,m.ar];
  const dz=(m.lk[2]+m.la[2])-(m.rk[2]+m.ra[2]), dza=(m.al.e[2]+m.al.h[2])-(m.ar.e[2]+m.ar.h[2]);
  const nl=clamp(.5+dz/30), na=clamp(.5+dza/30);
  const lA=[lerp(.62,1,nl),lerp(.62,1,1-nl)], aA=[lerp(.6,1,na),lerp(.6,1,1-na)];
  let legA=lA, armA=aA; if(dz<0){legs=[legs[1],legs[0]]; legA=[lA[1],lA[0]];} if(dza<0){arms=[arms[1],arms[0]]; armA=[aA[1],aA[0]];}
  const ux=(m.sh[0]-m.hip[0])/L.torso, uy=(m.sh[1]-m.hip[1])/L.torso;

function wrap(text,font,maxw){ if(text.includes('|')) return text.split('|').map(l=>l.trim().split(' '));ctx.font=font; const words=text.split(' '); const lines=[[]]; for(const w of words){const cur=lines[lines.length-1]; const test=[...cur,w].join(' '); if(ctx.measureText(test).width>maxw&&cur.length){lines.push([w]);} else cur.push(w);} return lines;}

  const font='italic 50px CormI'; const lines=wrap(text,font,900); ctx.save(); ctx.font=font; ctx.textBaseline='middle'; let idx=0;
  lines.forEach((ln,li)=>{const full=ln.join(' '); let x=540-ctx.measureText(full).width/2; const y=cy+li*64;
    ln.forEach(w=>{const st=t0+idx*.12; const p=sm(inv(st,st+1.0,tt)); idx++; if(p>0){ctx.globalAlpha=alpha*p; ctx.filter=`blur(${(1-p)*6}px)`; ctx.fillStyle='#f6eee0'; ctx.shadowColor='rgba(0,0,0,.65)'; ctx.shadowBlur=14; ctx.fillText(w,x,y+(1-p)*12);} x+=ctx.measureText(w+' ').width;});});
  ctx.filter='none'; ctx.restore();
}
function drawRef(txt,t0,cy,alpha){const p=sm(inv(t0,t0+1,tt)); if(p<=0)return; ctx.save(); ctx.font='30px Corm'; ctx.letterSpacing='7px'; ctx.textAlign='center'; ctx.fillStyle=`rgba(240,226,200,${.72*p*alpha})`; ctx.shadowColor='rgba(0,0,0,.6)'; ctx.shadowBlur=10; ctx.fillText(txt,540,cy); ctx.restore();}

// ============ frame ============
function camFinal(t){
  const c=simAt(CAM,t); const dn=dawn(t); const h=(1-dn)*(1-ss(T.sujood[0],T.sujood[1],t)*.6);
  let ox=(Math.sin(t*.53)*3.2+Math.sin(t*1.31+1)*1.6)*h, oy=(Math.sin(t*.41+2)*2.6+Math.sin(t*1.07)*1.2)*h;
  // the weight, felt by the camera
  let rot=(Math.sin(t*.37)*.18+Math.sin(t*.9)*.08)*h, zk=0;
  const relief=ss(T.lift0,T.lift0+3.2,t);                       // stones leave his back
  const load=(3+ss(T.drops[0],T.drops[0]+.4,t)+ss(T.drops[1],T.drops[1]+.4,t))*(1-relief);   // stones carried
  for(const h of HITS){const u=t-h.d, A=h.big?1.3:1; if(u>0&&u<4){ const e=Math.exp(-u*5.2);
    oy+=62*A*(1-Math.exp(-u*30))*Math.exp(-u*1.5);               // the hit: a hard drop that does not bounce back
    rot+=-.9*A*Math.sin(u*12+.3)*e; zk+=.045*A*Math.sin(u*10)*Math.exp(-u*4.5);
    ox+=6*A*Math.sin(u*23)*Math.exp(-u*9); }
   const v=t-h.land; if(v>0&&v<3){ oy+=(h.big?30:24)*(1-Math.exp(-v*40))*Math.exp(-v*2.6); rot+=.35*A*Math.sin(v*17)*Math.exp(-v*7); }   // his body hits the ground
   if(h.fail){ const w=t-h.fail[1]; if(w>0&&w<3){ oy+=20*(1-Math.exp(-w*40))*Math.exp(-w*2.8); rot+=.25*Math.sin(w*17)*Math.exp(-w*7); } } }
  oy+=(load-3)*9;                                                // the frame sinks a little with every stone
  for(const st of steps){ const u=t-st.t; if(u>-.05&&u<.4){ oy+=(1.2+1.9*load)*Math.sin(Math.PI*clamp((u+.05)/.4))*Math.exp(-Math.max(0,u)*3); } }   // each heavy step
  oy-=14*ss(T.lift0+.5,T.lift0+4,t)*(1-ss(T.cross-1,T.cross+2,t));  // relief: the camera lifts and floats
  return {x:c[0]+ox/c[2], y:c[1]+oy/c[2], z:c[2]*(1+zk), rot:rot*D};
}
const lcv=document.createElement('canvas'); lcv.width=W; lcv.height=H; const lctx=lcv.getContext('2d');
function draw(tr){
  const w=ss(REAL_END-XF,REAL_END,tr);
  if(w>0){ drawFrame(tr-REAL_END); lctx.clearRect(0,0,W,H); lctx.drawImage(cv,0,0); drawFrame(tr); ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha=w; ctx.globalCompositeOperation='source-over'; ctx.filter='none'; ctx.drawImage(lcv,0,0); ctx.restore(); return; }
  drawFrame(tr);
}
function drawFrame(tr){
  const t=tauAt(tr); tt=t; cam=camFinal(t);
  ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over'; ctx.filter='none';
  ctx.fillStyle='#070a11'; ctx.fillRect(0,0,W,H);
  ctx.save(); ctx.translate(540,960); ctx.rotate(cam.rot); ctx.translate(-540,-960);
  drawWorld(t);
  const s=figureState(t), sk=skeleton(s); const dn=dawn(t);
  ctx.save(); worldT(); drawGrass(t); ctx.restore();
  drawShadow(sk,s);
  drawFootLight(t);
  drawDustKicks(t);
  const sts=[0,1,2,3,4].map(i=>stoneState(i,t,sk));
  ctx.save(); worldT(); ctx.globalCompositeOperation='lighter';
  sts.forEach((st,i)=>{ if(st.glow<=0||t<liftT(i))return; const rr=90*st.sc; const g=ctx.createRadialGradient(st.x,st.y+20,0,st.x,st.y+20,rr); g.addColorStop(0,`rgba(255,170,90,${.26*st.glow})`); g.addColorStop(1,'rgba(255,150,80,0)'); ctx.fillStyle=g; ctx.fillRect(st.x-rr,st.y+20-rr,rr*2,rr*2);});
  ctx.restore();
  // stones still on his back sit behind him (mirrored with him when he turns)
  ctx.save(); worldT(); mirror(sk); sts.forEach((st,i)=>{ if(t>=liftT(i)) return; if(i>=3&&t<stoneOnAt[i]&&t>stoneOnAt[i]-.66) drawStoneBlur(i,t,dn); else drawStone(i,st,dn); });
  const strapA=.55*(1-ss(T.glow0,T.glow0+1.2,t)); if(strapA>0.02){ctx.strokeStyle=`rgba(140,130,122,${strapA})`; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(...sk.sh); ctx.lineTo(sts[2].x,sts[2].y); ctx.moveTo(sk.hip[0]+sk.ux*24,sk.hip[1]+sk.uy*24); ctx.lineTo(sts[0].x,sts[0].y); ctx.stroke();}
  ctx.restore();
  drawFigure(sk,s);
  ctx.save(); worldT(); sts.forEach((st,i)=>{ if(t>=liftT(i)) drawStone(i,st,dn); });
  if(t>T.pebble&&t<T.pebble+3){const u=(t-T.pebble)*.85; const px=606; ctx.fillStyle=`rgba(160,165,175,${1-ss(1.6,2.4,u)})`; ctx.beginPath(); ctx.arc(px+u*10, G-4+0.5*620*u*u,3.4,0,7); ctx.fill(); ctx.beginPath(); ctx.arc(px-6+u*7, G-2+0.5*560*Math.max(0,u-.14)**2,2.1,0,7); ctx.fill();}
  ctx.restore();
  drawBreath(t);
  drawHeartLight(t);
  ctx.restore();
  { const fb=focusBlur(t); if(fb>.05){ fctx.clearRect(0,0,W,H); fctx.drawImage(cv,0,0); ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.filter=`blur(${fb}px)`; ctx.drawImage(fcv,0,0); ctx.restore(); ctx.filter='none'; } }
  drawFG(t);
  drawDust(t,1);
  bloomPass(t);
  const A=1; const A1=A*Math.max(1-ss(...T.w1out,t), ss(S(42.55),S(43.4),t));
  drawArabic('a',T.w1at,T.w1,300,A1,'a'); sparks(T.w1at,T.w1at+5.2,300,A1*.55);
  drawTrans(TR1,T.w1at+5.0,420,A1*.95); drawRef('ASH-SHARḤ  ·  94:5',T.w1at+6.2,560,A1);
  drawArabic('b',T.w2at,T.w2,680,A,'b'); sparks(T.w2at,T.w2at+5,680,A*.55);
  drawTrans(TR2,T.w2at+4.5,796,A*.95); drawRef('ASH-SHARḤ  ·  94:6',T.w2at+5.2,870,A);
  const wm=ss(T.END-3.2,T.END-2.4,t)*(1-ss(T.END-1.9,T.END-1.3,t)); if(wm>0){ctx.save(); ctx.font='30px Corm'; ctx.letterSpacing='10px'; ctx.textAlign='center'; ctx.fillStyle=`rgba(245,230,205,${.55*wm})`; ctx.fillText('AYAH STUDIO',540,1780); ctx.restore();}
  const vg=ctx.createRadialGradient(540,900,500,540,960,1250); vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.5)'); ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
  // loop: open from and close into the same deep night sky colour
  
}

function events(){
  const ev=[];
  steps.forEach(s=>ev.push({t:s.t,type:'step',gain:.7+.4*ss(6,14,s.t)}));
  [S(19.6),S(20.25)].forEach(t=>ev.push({t,type:'step',gain:.5}));
  if(MC){ for(const c of mcContacts()){ if(c.t<T.cross+.4) continue; const onStone=c.y<G-5&&c.x<PLAT_X; ev.push({t:c.t,type:onStone?'stepstone':(c.x>PLAT_X?'stepplat':'step'),gain:.9}); }
    MC.flights.forEach((f,k)=>{ const t0=T.cross+f.takeoff/MC.fps, t1=T.cross+f.land/MC.fps; ev.push({t:t0-.05,type:f.spin?'bigjump':'jump'}); if(f.spin) ev.push({t:t0+.02,type:'spin',d:t1-t0}); ev.push({t:t1,type:f.spin?'landplat':'landstone'}); }); }
  HITS.forEach(h=>{ const d=h.d; ev.push({t:d,type:'thud_back',big:h.big}); ev.push({t:d-.03,type:'thunder',big:h.big}); ev.push({t:d+.05,type:'rustle',d:.6});
    ev.push({t:h.land,type:'sit_thud',big:h.big}); ev.push({t:h.land-.06,type:'hand'});
    if(h.tr){ ev.push({t:h.tr[0],type:'strain',d:h.tr[1]-h.tr[0]+.3}); ev.push({t:h.tr[0]+.1,type:'rustle',d:.7}); ev.push({t:h.fail[1],type:'sit_thud',big:0,soft:1}); ev.push({t:h.fail[1]+.05,type:'rustle',d:.5}); }
    const [r0,r1]=h.rise; ev.push({t:r0,type:'strain',d:(r1-r0)*.8}); ev.push({t:r0+.05,type:'hand'}); ev.push({t:r0+.1,type:'rustle',d:(r1-r0)*.9});
    ev.push({t:r0+(r1-r0)*.55,type:'step',gain:.55}); ev.push({t:r1-.05,type:'step',gain:.5}); });
  ev.push({t:T.tryA+.2,type:'rustle',d:.8}); ev.push({t:T.pebble,type:'pebble'});
  ev.push({t:T.turnBack[0],type:'rustle',d:.9});
  ev.push({t:T.kneel[0]+.85,type:'knees'}); ev.push({t:T.kneel[0]+1.35,type:'knees'});
  ev.push({t:T.sujood[0]+.6,type:'hand'}); ev.push({t:T.sujood[0],type:'rustle',d:1.6});
  ev.push({t:T.light,type:'light'}); T.beats.forEach(b=>ev.push({t:b,type:'beat'}));
  ev.push({t:T.bloom,type:'bloom'});
  [0,1,2,3,4].forEach(o=>{const i=4-o; ev.push({t:T.glow0+.3*o,type:'glow'}); ev.push({t:liftT(i)-.5,type:'tremble'}); ev.push({t:liftT(i),type:'lift'}); ev.push({t:liftT(i)+T.fly,type:'land'});});
  ev.push({t:T.sitUp[0],type:'rustle',d:1.0}); ev.push({t:T.stand[0],type:'rustle',d:1.0});
  // breaths: inhale at the trough, exhale at the crest
  let prev=null; for(let t=0;t<T.END;t+=1/240){const ph=breathPh(t); const k=Math.floor(ph/Math.PI); if(prev!==null&&k!==prev) ev.push({t,type:(k%2===0)?'inhale':'exhale',amp:breathAmp(t),per:breathPeriod(t)}); prev=k;}
  return ev.filter(e=>e.t>STORY0-XF-.6).map(e=>({...e,t:realOf(e.t)}));
}
window.SH=SH; window.HITS=HITS; window.draw=draw; window.REAL_END=()=>REAL_END; window.warpTable=()=>{const o=[];for(let s=STORY0-XF-1;s<=T.END;s+=.05)o.push([s,realOf(s)]);return o;}; window.events=events; window.T=T;
window.ready=(async()=>{MC=await (await fetch('cross.json')).json(); await document.fonts.load('108px AmiriQ'); await document.fonts.load('italic 52px CormI'); await document.fonts.load('30px Corm'); prepWords(); simulate(); return true;})();
</script></body></html>
