<script>
// The drip (26:80). One continuous take, deterministic draw(t), loops at END.
// Same character and flat style as The Unsent Message. The IV line and the bag are a real rope / pendulum
// simulation, the drops form, fall under gravity and splash, the water in the cup sloshes; all precomputed
// over three loops so the loop seam is continuous and every frame is reproducible on any machine.
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const END=41.0, W_=1080, H_=1920, OM=k=>2*Math.PI*k/END;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,u)=>a+(b-a)*u;
const sm=u=>{u=clamp(u);return u*u*u*(u*(u*6-15)+10);};
const inv=(a,b,t)=>clamp((t-a)/(b-a));
const ss=(a,b,t)=>sm(inv(a,b,t));
const bell=(a,b,t)=>{const m=(a+b)/2;return ss(a,m,t)*(1-ss(m,b,t));};
const EZ={io:sm, lin:u=>u, o:u=>1-Math.pow(1-u,3), i:u=>u*u*u, o2:u=>Math.sin(u*Math.PI/2), h:u=>lerp(sm(u),1-Math.pow(1-u,3),sm(clamp(u/.3)))};
function K(keys,t){
  if(t<=keys[0][0]) return keys[0][1];
  for(let i=0;i<keys.length-1;i++){const a=keys[i],b=keys[i+1]; if(t<=b[0]){const u=(t-a[0])/(b[0]-a[0]); return lerp(a[1],b[1],(EZ[b[2]||'io'])(u));}}
  return keys[keys.length-1][1];
}
function K2(keys,t){ // [t,x,y,ease]
  if(t<=keys[0][0]) return [keys[0][1],keys[0][2]];
  for(let i=0;i<keys.length-1;i++){const a=keys[i],b=keys[i+1]; if(t<=b[0]){const u=(EZ[b[3]||'io'])((t-a[0])/(b[0]-a[0])); return [lerp(a[1],b[1],u),lerp(a[2],b[2],u)];}}
  const z=keys[keys.length-1]; return [z[1],z[2]];
}
function KL(keys,t){return Math.exp(K(keys.map(k=>[k[0],Math.log(k[1]),k[2]]),t));}
const mixc=(a,b,u)=>[lerp(a[0],b[0],u),lerp(a[1],b[1],u),lerp(a[2],b[2],u)];
const rgb=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const hx=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
const wrap=t=>((t%END)+END)%END;

// ---------------- timeline ----------------
const TR={
 lean:[[0,.08],[1.3,.08],[1.52,.36,'h'],[2.3,.3],[3.4,.24],[4.6,.24],[5.3,.27],[5.62,.3],[5.98,-.35,'i'],[6.25,-.3,'o'],[6.7,-.32],[15.3,-.32],[15.95,-.18],[16.55,-.33],[25.4,-.33],[27.1,.05],[36.6,.06],[40.2,.08],[41,.08]],
 pitch:[[0,.12],[1.3,.12],[1.52,.42,'h'],[2.4,.3],[3.4,.28],[4.4,.3],[5.5,.28],[5.98,-.16,'i'],[6.5,-.08],[10.8,-.06],[11.3,.12],[12.9,.12],[13.3,-.2],[14.3,-.2],[14.6,-.04],[15.3,-.04],[15.95,.1],[16.6,-.06],[17.2,.04],[18.0,.2],[22.4,.2],[23.4,-.16],[24.8,-.14],[25.6,0],[27.1,.06],[28.0,.18],[28.6,.05],[29.3,-.05],[30.3,.04],[36.6,.04],[40.2,.12],[41,.12]],
 turn:[[0,0],[10.9,0],[11.4,-.3],[12.9,-.3],[13.3,.42],[14.3,.42],[14.65,-.45],[15.3,-.45],[15.7,0],[22.6,0],[23.3,.34],[24.9,.34],[25.6,0],[26.9,-.28],[27.9,-.28],[28.5,0],[41,0]],
 lookY:[[0,.35],[1.3,.35],[1.5,.8],[3.4,.8],[4.0,.6],[5.5,.7],[6.0,-.2],[6.6,.1],[10.9,.1],[11.4,.5],[12.9,.5],[13.3,-.85],[14.3,-.85],[14.65,-.1],[15.3,-.1],[15.7,.3],[17.0,.3],[22.6,.3],[23.3,-.75],[24.9,-.75],[25.6,0],[26.9,.55],[27.9,.55],[28.5,0],[36.6,0],[40.2,.35],[41,.35]],
 lid:[[0,.42],[1.3,.42],[1.46,.78,'h'],[2.4,.62],[4.0,.5],[5.5,.55],[5.92,.82],[8.5,.7],[10.6,.68],[11.2,.55],[13.0,.5],[13.3,.38],[14.3,.42],[15.6,.6],[16.5,.86],[17.1,.99],[22.5,.99],[23.3,.22],[26,.3],[36.6,.3],[40.2,.42],[41,.42]],
 brow:[[0,.8],[1.4,1],[17,.9],[21.8,.9],[23.4,.25],[25,0],[36.6,0],[40.3,.8],[41,.8]],
 smile:[[0,0],[23.6,0],[25.6,.75],[36.6,.75],[38.6,0],[41,0]],
 sick:[[0,1],[21.7,1],[24.8,0],[36.6,0],[40.2,1],[41,1]],
 W:[[0,0],[18.7,0],[30.6,1,'o2'],[36.6,1],[40.6,0],[41,0]],
 upL:[[0,0],[16.9,0],[18.0,1],[25.3,1],[26.2,0],[41,0]],
 upR:[[0,0],[16.9,0],[18.05,1],[25.3,1],[26.3,0],[41,0]],
 tilt:[[0,0],[28.9,0],[29.4,.34],[30.1,.34],[30.7,0],[41,0]],
 armGlow:[[0,0],[21.55,0],[22.2,1,'o'],[24.5,1],[27,.45],[36.6,.4],[38.4,0],[41,0]],
 Z:[[0,1],[7.4,1.02],[8.9,.6],[10.5,.6],[11.9,1],[15.4,1.04],[16.6,1.1],[18.4,1.1],[19.8,1.16],[20.5,1.16],[21.7,1.1],[22.6,1.08],[30.6,.74],[36.6,.74],[40.6,1],[41,1]],
 CX:[[0,505],[7.4,505],[8.9,560],[10.5,560],[11.9,505],[15.4,500],[16.6,482],[18.4,482],[19.8,690],[20.5,695],[21.7,600],[22.6,560],[30.6,540],[36.6,540],[40.6,505],[41,505]],
 CY:[[0,958],[7.4,962],[8.9,1060],[10.5,1060],[11.9,958],[15.4,958],[16.6,966],[18.4,966],[19.8,905],[20.5,912],[21.7,1010],[22.6,995],[30.6,1010],[36.6,1010],[40.6,958],[41,958]],
};
// his right hand (screen left): the cup hand
const HL=[[0,420,1000],[1.3,420,964,'o'],[1.5,442,1010,'h'],[2.3,436,1004],[2.9,334,1128],[3.4,194,1092],[3.75,165,1098],[4.0,165,1098],[4.3,320,1150],[4.7,452,1075],[4.95,446,1080],[5.18,380,1168],[5.5,222,1076],[5.62,230,1072],[6.05,300,1203,'h'],[6.3,300,1199],[10.9,300,1199],[12.0,216,1160],[12.35,206,1128],[12.75,212,1134],[13.15,292,1202,'i'],[13.4,300,1199],[15.3,300,1199],[15.95,312,1193],[16.45,300,1200],[16.9,300,1199],[18.0,395,1012],[25.3,395,1012],[26.3,322,1168],[26.9,250,1140],[27.55,165,1098],[27.9,165,1098],[28.3,292,1092],[28.8,400,1000],[29.3,412,880],[30.2,416,888],[30.9,420,962],[36.6,420,968],[40.0,420,1030],[41,420,1000,'i']];
// his left hand (screen right): the IV hand
const HR=[[0,650,1192],[1.3,650,1192],[1.5,662,1180,'h'],[2.2,652,1190],[5.62,650,1192],[5.82,706,1118,'h'],[6.2,648,1196,'i'],[6.45,650,1192],[15.3,650,1192],[15.95,642,1187],[16.45,650,1193],[16.9,650,1192],[18.05,548,1014],[25.3,548,1014],[26.35,650,1192],[41,650,1192]];
const HELD_A=3.85, HELD_B=27.72; // he puts the cup down at 3.85 and picks it up again at 27.72
const tv=(k,t)=>K(TR[k],t);
const HITS=[[1.42,40],[5.98,80]];
function hitOff(t){let d=0;for(const[h,a]of HITS){const x=t-h;if(x<0)continue;d+=x<.1?a*sm(x/.1):a*Math.exp(-(x-.1)*3.2)*Math.cos((x-.1)*5.2);}return d;}
function blink(t){let b=0;for(const bt of [2.9,4.3,9.6,12.2,14.0,27.5,31.6,35.0]){b=Math.max(b,bell(bt,bt+.2,t));}return b;}
// tremble of a weak hand (periodic over END so the loop is exact)
const trem=(t,amp)=>amp*(Math.sin(OM(271)*t)*.6+Math.sin(OM(433)*t+1)*.4);

// ---------- breathing: phase integrated so the rate can change without running backwards ----------
const BR=(()=>{const n=Math.round(END*240), ph=new Float64Array(n+1); let p=0; for(let i=0;i<n;i++){const t=i/240; const per=lerp(lerp(2.6,3.4,ss(6,16,t)),5.2,K(TR.W,t)); p+=1/(240*per); ph[i+1]=p;}
  const sc=Math.round(p)/p; for(let i=0;i<=n;i++) ph[i]*=sc; return ph;})();
function breath(t){const x=wrap(t)*240, i=Math.floor(x), u=x-i; const p=lerp(BR[i],BR[Math.min(i+1,BR.length-1)],u); return Math.sin(2*Math.PI*p);}

// ---------------- camera ----------------
function cam(t){
  const Z=KL(TR.Z,t), W=tv('W',t);
  let CX=tv('CX',t), CY=tv('CY',t);
  const drift=(1-W)*(1-ss(16.6,17.6,t)*(1-ss(21.5,22.5,t)));
  CX+=(2.0*Math.sin(OM(4)*t)+1.2*Math.sin(OM(9)*t+1))*drift/Z;
  CY+=(1.6*Math.sin(OM(3)*t+2)+1.0*Math.sin(OM(7)*t))*drift/Z;
  CY-=hitOff(t)/Z;
  return {Z,CX,CY};
}
function setCam(c){ctx.setTransform(c.Z,0,0,c.Z,540-c.CX*c.Z,960-c.CY*c.Z);}
const toScr=(c,x,y)=>[540+(x-c.CX)*c.Z,960+(y-c.CY)*c.Z];

// ---------------- palette ----------------
const P={skin:hx('#e3a87b'),skinD:hx('#c98b60'),sick:hx('#d4b09a'),sickD:hx('#b9937c'),hair:hx('#221710'),beard:hx('#2a1b13'),
 gown:hx('#a9c3d2'),gownD:hx('#8eaabb'),gownP:hx('#7f9db0'),wall:hx('#8fa9ad'),wallD:hx('#7c9599'),ceil:hx('#76898c'),floor:hx('#a2adab'),
 frame:hx('#dfe5e6'),head:hx('#6f8794'),pillow:hx('#e6edf1'),pillowD:hx('#c3d0d8'),blank:hx('#c6d4dd'),blankD:hx('#a9bac6'),sheet:hx('#eef3f5'),
 cab:hx('#b9a68e'),cabT:hx('#d3c2a6'),cabD:hx('#9c8a73'),pole:hx('#c4cbd0'),poleD:hx('#8f989f'),chair:hx('#5f7684'),chairD:hx('#4b606d'),door:hx('#a99a86')};
const fc=(c,a=1)=>rgb(c,a);
function skinCols(t){const s=tv('sick',t); return {sk:mixc(P.skin,P.sick,s), skD:mixc(P.skinD,P.sickD,s)};}

// ---------------- the man: pose ----------------
function ik(sx,sy,hx_,hy,l1,l2,side){
  let dx=hx_-sx, dy=hy-sy, d=Math.hypot(dx,dy); const dd=clamp(d,Math.abs(l1-l2)+1,l1+l2-1);
  const a=Math.atan2(dy,dx), c=clamp((l1*l1+dd*dd-l2*l2)/(2*l1*dd),-1,1), b=Math.acos(c);
  const ang=a+side*b; return [sx+Math.cos(ang)*l1, sy+Math.sin(ang)*l1];
}
// elbow as a real 3D hinge seen from the front: it turns smoothly around the shoulder-hand axis (k = -1..1), never flips
function elbow(sx,sy,hx_,hy,l1,l2,k){
  let dx=hx_-sx, dy=hy-sy, d=Math.hypot(dx,dy)||1; const dd=clamp(d,Math.abs(l1-l2)+1,l1+l2-1);
  const ux=dx/d, uy=dy/d, p=(l1*l1-l2*l2+dd*dd)/(2*dd), h=Math.sqrt(Math.max(0,l1*l1-p*p));
  return [sx+ux*p-uy*k*h, sy+uy*p+ux*k*h];
}
function armK(side,s){ // his right arm (screen left): elbow out to the left when the hand is left of the shoulder, below when right
  if(side>0) return -1; const sx=s.cx-(s.shW-34); const x=clamp((s.hl[0]-sx-40)/260,-1,1); return sm((x+1)/2)*2-1;
}
function pose(t){
  const f=tv('lean',t), p=tv('pitch',t), turn=tv('turn',t), br=breath(t), W=tv('W',t), sick=tv('sick',t);
  const heave=bell(6.0,11.2,t)*(.5+.5*Math.sin(OM(17)*t));
  const exhale=bell(23.4,26.6,t);
  const ba=lerp(4,7,sick)*(1-.4*W);
  const cx=470+turn*6;
  const shY=880+(f>0?f*320:-f*50)-br*ba+heave*6+exhale*8;
  const shW=205*(1+Math.max(f,0)*.12);
  const hxp=470+turn*22, hyp=(f>0?655+f*385:655-f*60)-br*ba*.6+heave*4+exhale*5;
  const hs=1+Math.max(f,0)*.1+Math.min(f,0)*.14;
  let hl=K2(HL,t), hr=K2(HR,t);
  // a weak hand trembles a little while it reaches; it steadies with the light
  const tw=(bell(1.5,3.9,t)*1.4+bell(10.9,13.2,t)*2.2+bell(15.4,16.6,t)*1.6+bell(16.9,21.8,t)*.9);
  hl=[hl[0]+trem(t,tw),hl[1]+trem(t+3.1,tw*.7)]; hr=[hr[0]+trem(t+1.7,tw*.6),hr[1]+trem(t+5.3,tw*.5)];
  // breath lifts the raised hands with the chest
  const up=tv('upL',t), upR=tv('upR',t); hl[1]-=br*ba*.5*up; hr[1]-=br*ba*.5*upR;
  return {f,p,turn,cx,shY,shW,hxp,hyp,hs,hl,hr,W,up,upR,sick};
}
// the cup: in his hand, or standing on the cabinet
const CUP_ON=[165,1063];
function cupHeld(t){t=wrap(t); return t<HELD_A||t>=HELD_B;}
function cupPos(t){t=wrap(t); if(!cupHeld(t)) return {x:CUP_ON[0],y:CUP_ON[1],a:0};
  const h=K2(HL,t); const a=tv('tilt',t); return {x:h[0]+Math.sin(a)*35,y:h[1]-35*Math.cos(a),a};}
function cannula(s){ // the needle on the back of his left hand (screen right)
  const h=s.hr, u=s.upR; return [h[0]+lerp(4,-2,u), h[1]+lerp(-8,10,u)];
}

// ---------------- physics: IV line (rope) + hanging bag (pendulum), cup water ----------------
const HOOK=[860,575], LB=380, NR=34, LROPE=430, SEG=LROPE/NR, SIM=240;
const ROPE=(()=>{
  const n=Math.round(END*SIM), rec=new Float32Array((n+1)*(NR+1)*2);
  const px=new Float64Array(NR+1), py=new Float64Array(NR+1), ox=new Float64Array(NR+1), oy=new Float64Array(NR+1);
  const im=new Float64Array(NR+1); for(let i=1;i<NR;i++) im[i]=1; im[0]=1/3000; im[NR]=0;
  const s0=pose(0), c0=cannula(s0);
  for(let i=0;i<=NR;i++){const u=i/NR; px[i]=lerp(HOOK[0],c0[0],u); py[i]=lerp(HOOK[1]+LB,c0[1],u)+Math.sin(u*Math.PI)*60; ox[i]=px[i]; oy[i]=py[i];}
  const G=3000, dt=1/SIM;
  const floorY=x=>x<786?1208:1560;
  for(let loop=0;loop<4;loop++){
    for(let k=0;k<n;k++){
      const t=k/SIM;
      if(loop===3){for(let i=0;i<=NR;i++){rec[(k*(NR+1)+i)*2]=px[i]; rec[(k*(NR+1)+i)*2+1]=py[i];}}
      const s=pose(t+dt), cn=cannula(s);
      for(let i=0;i<NR;i++){const damp=i===0?.996:.992; const vx=(px[i]-ox[i])*damp, vy=(py[i]-oy[i])*damp; ox[i]=px[i]; oy[i]=py[i]; px[i]+=vx; py[i]+=vy+G*dt*dt;}
      ox[NR]=px[NR]; oy[NR]=py[NR]; px[NR]=cn[0]; py[NR]=cn[1];
      for(let it=0;it<18;it++){
        // bag on its hook
        {const dx=px[0]-HOOK[0], dy=py[0]-HOOK[1], d=Math.hypot(dx,dy)||1; px[0]=HOOK[0]+dx/d*LB; py[0]=HOOK[1]+dy/d*LB;}
        for(let i=0;i<NR;i++){const w=im[i]+im[i+1]; if(w<=0) continue; const dx=px[i+1]-px[i], dy=py[i+1]-py[i], d=Math.hypot(dx,dy)||1e-6, e=(d-SEG)/d/w;
          px[i]+=dx*e*im[i]; py[i]+=dy*e*im[i]; px[i+1]-=dx*e*im[i+1]; py[i+1]-=dy*e*im[i+1];}
        // the tube is a little stiff: soft bending constraint
        for(let i=1;i<NR-1;i++){const mx=(px[i-1]+px[i+1])/2, my=(py[i-1]+py[i+1])/2; const k_=.06*im[i]; px[i]+=(mx-px[i])*k_; py[i]+=(my-py[i])*k_;}
        // it lies on the blanket and hangs down the side of the bed
        for(let i=1;i<NR;i++){const fy=floorY(px[i]); if(py[i]>fy){py[i]=fy; ox[i]=lerp(ox[i],px[i],.35);}}
      }
    }
  }
  for(let i=0;i<=NR;i++){rec[(n*(NR+1)+i)*2]=px[i]; rec[(n*(NR+1)+i)*2+1]=py[i];}
  // close the loop exactly: ease away the small difference between the end and the start state over the last seconds
  // (the line is lying still on the blanket then, so this reads as nothing at all)
  const k0=Math.round(37.2*SIM);
  for(let k=k0;k<=n;k++){const w=sm((k-k0)/(n-k0)); for(let j=0;j<(NR+1)*2;j++){const e=rec[j]-rec[n*(NR+1)*2+j]; rec[k*(NR+1)*2+j]+=e*w;}}
  return rec;
})();
function ropeAt(t){
  const x=wrap(t)*SIM, k=Math.floor(x), u=x-k, n=Math.round(END*SIM), k2=Math.min(k+1,n); const pts=[];
  for(let i=0;i<=NR;i++){const a=(k*(NR+1)+i)*2, b=(k2*(NR+1)+i)*2; pts.push([lerp(ROPE[a],ROPE[b],u),lerp(ROPE[a+1],ROPE[b+1],u)]);}
  return pts;
}
// cup water: the surface tilts against the cup's acceleration (damped spring)
const SLOSH=(()=>{const n=Math.round(END*SIM), out=new Float32Array(n+1); let ph=0, v=0; const w=2*Math.PI*2.4, z=.11, dt=1/SIM, g=2400;
  for(let loop=0;loop<3;loop++) for(let k=0;k<n;k++){const t=k/SIM; const a=(x=>x)(0);
    const p0=cupPos(t-dt), p1=cupPos(t), p2=cupPos(t+dt); const ax=(p2.x-2*p1.x+p0.x)/(dt*dt); const ay=(p2.y-2*p1.y+p0.y)/(dt*dt);
    const tgt=Math.atan2(-ax,g+ay)-p1.a; const acc=-w*w*(ph-tgt)-2*z*w*v; v+=acc*dt; ph+=v*dt; ph=clamp(ph,-.6,.6); if(loop===2) out[k]=ph;}
  return out;})();
function sloshAt(t){const x=wrap(t)*SIM, k=Math.floor(x), u=x-k; return lerp(SLOSH[k],SLOSH[Math.min(k+1,SLOSH.length-1)],u);}

// ---------------- the drip: drops form, fall and land ----------------
const DP=END/29, D0=.307, ORI=286, POOL=358, CH_TOP=262, CH_BOT=380; // local bag coords (y down from hook)
const SLOWDROP=14; // the first gold drop falls in native slow motion
function goldAmt(tf){return ss(18.5,18.8,tf)*(1-ss(36.8,37.6,tf));}
function dropTimes(k){const td=D0+k*DP; const fall=k===SLOWDROP?.17:.085; return {tf:td-DP+.03, td, ti:td+fall, fall};}
function bagAngle(t){const r=ropeAt(t)[0]; return Math.atan2(r[0]-HOOK[0], r[1]-HOOK[1]);}
function dropList(t){ // every drop event near t, with times unwrapped around t
  const out=[]; for(let j=-2;j<31;j++){const kk=((j%29)+29)%29, off=Math.floor(j/29)*END; const d=dropTimes(kk);
    out.push({k:kk,tf:d.tf+off,td:d.td+off,ti:d.td+d.fall+off,g:goldAmt(wrap(d.td))});}
  return out;}
function dropState(t){
  t=wrap(t); const res={form:0,formGold:0,fall:null,imp:[]};
  for(const d of dropList(t)){
    if(t>=d.tf&&t<d.td){res.form=(t-d.tf)/(d.td-d.tf); res.formGold=d.g; res.slow=d.k===SLOWDROP;}
    if(t>=d.td&&t<d.ti){res.fall={u:(t-d.td)/(d.ti-d.td),g:d.g,slow:d.k===SLOWDROP};}
    if(t>=d.ti&&t<d.ti+1.2) res.imp.push({age:t-d.ti,g:d.g,k:d.k});
  }
  return res;
}
function poolGold(t){ // the pool takes the colour of the drops landing in it, blending over ~0.6 s
  t=wrap(t); const L=dropList(t).filter(d=>d.ti<=t).sort((a,b)=>b.ti-a.ti); const a=L[0], b=L[1];
  return lerp(b.g,a.g,ss(0,.6,t-a.ti));
}
// the gold flow in the line: a front that runs down from the chamber to his hand, and later the clear tail
function lineGold(t){t=wrap(t); return {front:ss(20.3,21.6,t)*1, tail:ss(37.0,38.7,t)};}

function ropePath(pts,from,to){ // smooth curve through the rope points between arclength fractions from..to

  const q=[P_(a)]; for(let i=Math.ceil(a+1e-6);i<b;i++) q.push(pts[i]); q.push(P_(b));
  ctx.beginPath(); ctx.moveTo(q[0][0],q[0][1]);
  for(let i=1;i<q.length-1;i++){const mx=(q[i][0]+q[i+1][0])/2, my=(q[i][1]+q[i+1][1])/2; ctx.quadraticCurveTo(q[i][0],q[i][1],mx,my);}

}
