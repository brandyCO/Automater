<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'AmiriQ';src:url(amiri.woff2) format('woff2');}
@font-face{font-family:'Corm';src:url(corm.woff2) format('woff2');}
@font-face{font-family:'CormI';src:url(cormi.woff2) format('woff2');}

<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// 3:07 AM (Qaf 50:16). The app's own character lies awake at 3 am, his heart racing. Two blows (a buzz, then a pounding),
// weaker and weaker tries to calm down, then he turns the phone over and bows down. The same heartbeat that kept him
// awake turns to warm light, beat by beat, until the room is golden and he sleeps. One continuous take, loops to night.
// ============ helpers ============
const W=1080,H=1920;
const cv=document.getElementById('c'); const ctx=cv.getContext('2d');
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const inv=(a,b,x)=>clamp((x-a)/(b-a));
const ss=(a,b,x)=>{const t=inv(a,b,x);return t*t*(3-2*t);};
const sm=t=>t*t*t*(t*(t*6-15)+10);
const D=Math.PI/180;
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mixh=(a,b,t)=>{const x=hex(a),y=hex(b);return '#'+x.map((v,i)=>Math.round(v+(y[i]-v)*t).toString(16).padStart(2,'0')).join('');};
const rgba=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${clamp(a)})`;
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
// keyframes [[t,v],...] eased with smootherstep between keys; v may be number or array
function K(keys,t,ease=sm){
  if(t<=keys[0][0]) return keys[0][1];
  for(let i=1;i<keys.length;i++){ if(t<=keys[i][0]){ const [a,va]=keys[i-1],[b,vb]=keys[i]; const u=ease((t-a)/(b-a));
    return Array.isArray(va)? va.map((x,j)=>lerp(x,vb[j],u)) : lerp(va,vb,u);} }
  return keys[keys.length-1][1];
}
const P2=s=>new Path2D(s);
const circ=(x,y,r)=>`M${x-r} ${y}a${r} ${r} 0 1 0 ${2*r} 0a${r} ${r} 0 1 0 ${-2*r} 0z`;
// The app's two-tone shape: shade underneath, base shifted up-left and clipped to the shape.
function S(d,base,shade,dx=-6,dy=-5){ const p=typeof d==='string'?P2(d):d; ctx.fillStyle=shade; ctx.fill(p); ctx.save(); ctx.clip(p); ctx.translate(dx,dy); ctx.fillStyle=base; ctx.fill(p); ctx.restore(); }
function strokeP(d,col,w,alpha=1){ ctx.save(); ctx.globalAlpha*=alpha; ctx.strokeStyle=col; ctx.lineWidth=w; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.stroke(typeof d==='string'?P2(d):d); ctx.restore(); }

// ============ the character (the app's default man: skin 2, short dark hair, trimmed beard; plain grey tee) ============
const SK=['#e0a676','#bf7c4f'], HC=['#2a1c14','#140c07'], TEE=['#8f9aab','#626c7d'], DARK='#26160f';
const SOFT=mixh(SK[0],SK[1],.62), LIP=mixh(SK[1],'#4a2216',.45);
const U=2.3;                 // world px per character unit
const L=86;                  // hip to neck, units
// ============ timeline (seconds) ============
const T={END:40.3,
  buzz1:1.12, hit1:1.45, buzz2:4.85, hit2:5.1, up2:[5.1,5.75],
  down1:[9.3,10.7], cover:[11.0,11.5], uncover:[12.5,13.0], reach:[13.0,13.6], tap:13.75, look:[13.6,14.4],
  up3:[14.6,15.9], hold:[15.9,17.3], flip:[17.3,17.95], bow:[18.0,19.0], hush:[19.0,20.0],
  ANS:20.0, rise:[22.6,25.0], exhale:25.0, smile:[24.6,26.2], down2:[26.6,29.2], still:[32.0,38.8], seam:[38.8,40.3]};

// heart rate (beats per minute) through the story, and the beat times from it
function bpm(t){
  if(t<T.hit1) return 0;
  return K([[T.hit1,96],[4.6,92],[T.hit2,122],[8.6,116],[12,104],[16.5,98],[18.6,96],[T.ANS,84],[24,72],[29,58],[34,54],[38.8,54]],t,x=>x);
}
const BEATS=(()=>{ const b=[]; let t=T.hit1, h2=0; while(t<T.seam[0]+.2){
    // the hush: one beat held back before the answer
    if(t>T.hush[0]+.05 && t<T.ANS-.02){ t=T.ANS; continue; }
    if(!h2 && t>T.hit2-.32){ h2=1; b.push(T.hit2, T.hit2+.2); t=T.hit2+.2+60/bpm(T.hit2+.3); continue; }
    b.push(t); t+=60/bpm(t+.01); }
  // hit 2 is a double thump: make sure a beat lands exactly on it
  return b; })();
function beatK(t,decay=6){ let v=0; for(const b of BEATS){ if(b>t) break; const u=t-b; if(u<1.2) v=Math.max(v, Math.exp(-u*decay)*(1-Math.exp(-u*60))); } return v; }
function beatsBefore(t){ let n=0; for(const b of BEATS) if(b<=t) n++; return n; }

// ============ pose ============
// r: torso rotation (deg): -90 lying on his back (head to the left, face to us), 0 sitting up, +60 bowed over his knees.
const HIP=[566,1004];
function pose(t){
  const p={};
  p.r=K([[0,-90],[T.hit2,-90],[T.up2[1],0],[T.down1[0],0],[T.down1[1],-90],[T.up3[0],-90],[T.up3[1],-4],[T.hold[1],-2],[T.bow[0],-1],[T.bow[1],0],[T.rise[0],0],[T.rise[1],0],[T.down2[0],0],[T.down2[1],-90]],t);
  // a sudden jolt up (blow 2) is fast, with a little overshoot
  if(t>T.up2[0]&&t<T.up2[1]+.6){ const u=(t-T.up2[0]); p.r+= Math.sin(clamp(u/.6)*Math.PI)*0 + 6*Math.exp(-((u-.75)**2)/.03); }
  p.bow=K([[0,0],[T.bow[0],0],[T.bow[1],1],[T.rise[0],1],[T.rise[1]-.2,0]],t);
  // breathing: depth and rate
  const depth=K([[0,.010],[T.hit1,.016],[T.hit2,.034],[8.6,.03],[T.down1[1],.024],[T.hold[0],.02],[T.bow[1],.014],[T.ANS,.012],[T.exhale-.6,.03],[T.exhale+1.5,.012],[30,.008],[T.seam[1],.010]],t);
  const rate=K([[0,.22],[T.hit1,.36],[T.hit2,.85],[8.6,.7],[12,.5],[T.hold[1],.4],[T.ANS,.32],[26,.2],[30,.16],[T.seam[1],.22]],t);
  p.breath=depth*Math.sin(phaseOf(t));
  // the big exhale at peace: a long out-breath
  p.breath+= -.03*Math.exp(-((t-T.exhale-.4)**2)/.5) + .025*Math.exp(-((t-T.exhale+.7)**2)/.25);
  p.beat=beatK(t);
  // blanket: how far up the torso it covers (units)
  p.cover=K([[0,64],[T.hit2,64],[T.up2[1],16],[T.down1[0],16],[T.down1[1],60],[T.up3[0],60],[T.up3[1],16],[T.down2[0],16],[T.down2[1]+.4,64]],t);
  // hands (torso-local units, or {w:[x,y]} world). A = near hand (screen bottom when lying), B = far hand.
  const chest=[4,-50], chestB=[-2,-48];
  const restA=[-46,-14], restB=[16,-34];
  const lapA=[-10,-2], lapB=[12,-4];
  p.A=KH([[0,chest],[T.hit2,chest],[T.up2[1],[2,-54]],[T.down1[1],chest],[T.cover[0],chest],[T.cover[1],[-12,-122]],[T.uncover[0],[-12,-122]],[T.uncover[1],chest],[T.up3[0],chest],[T.up3[1],lapA],[T.bow[0],lapA],[T.bow[1],[-9,-30]],[T.rise[0],[-9,-30]],[T.rise[1]-.3,chest],[T.down2[1],chest],[T.seam[1],chest]],t);
  p.B=KH([[0,restB],[T.hit1+.1,restB],[T.hit1+.6,[22,-40]],[T.hit2,[22,-40]],[T.up2[1],[44,-6]],[T.down1[1],restB],[T.cover[0],restB],[T.cover[1],[12,-124]],[T.uncover[0],[12,-124]],[T.uncover[1],restB],
    [T.reach[0],restB],[T.reach[1],{w:[PHONE0[0]-4,PHONE0[1]+30]}],[T.look[1],[30,-70]],[T.up3[0],[34,-66]],[T.up3[1],lapB],[T.flip[0],lapB],[T.flip[0]+.35,{w:[PHONEDOWN[0]-4,PHONEDOWN[1]-2]}],[T.flip[1],{w:[PHONEDOWN[0]-4,PHONEDOWN[1]+30]}],[T.bow[0],{w:[PHONEDOWN[0]-4,PHONEDOWN[1]+30]}],[T.bow[1],[9,-30]],[T.rise[0],[9,-30]],[T.rise[1],[40,-12]],[T.down2[1],restB],[T.seam[1],restB]],t);
  // head: tilt (deg, relative to torso), eyes, brows, mouth
  p.tilt=K([[0,-6],[T.hit1,-6],[T.hit1+.3,-2],[T.hit2,-4],[T.up2[1],4],[7.4,-3],[8.6,2],[T.down1[1],-4],[T.look[0],-4],[T.look[1],12],[T.up3[0],8],[T.up3[1],14],[T.hold[1],18],[T.bow[1],0],[T.rise[0],0],[T.rise[1],-6],[T.exhale+1,-2],[T.down2[1],-8],[T.seam[1],-6]],t);
  let lid=K([[0,.42],[T.hit1-.02,.2],[T.hit1+.08,1.18],[T.hit1+.9,1.05],[4.4,.5],[T.buzz2,.5],[T.hit2+.06,1.28],[7,1.15],[T.down1[1],1.18],[T.cover[1],1.1],[T.uncover[1],.85],[T.look[1],.8],[T.up3[1],.62],[T.hold[1],.5],[T.flip[1],.55],[T.bow[1]-.3,0],[T.seam[0],0],[T.seam[1],.42]],t);
  // blinks (the panicked ones are quick)
  for(const [b,d] of [[3.1,.16],[7.3,.12],[9.0,.14],[10.9,.18],[14.3,.2],[16.6,.3]]) lid*= 1-Math.exp(-((t-b)**2)/(d*d*.12));
  p.lid=lid;
  p.worry=K([[0,.35],[T.hit1,.35],[T.hit1+.2,.9],[T.hit2,.8],[T.hit2+.2,1],[T.hold[1],.9],[T.bow[1],.7],[T.ANS,.6],[T.rise[1],.15],[T.smile[1],0],[T.seam[0],0],[T.seam[1],.35]],t);
  p.open=K([[0,0],[T.hit2,0],[T.hit2+.2,1],[8.6,.6],[T.down1[1],.3],[T.up3[0],.2],[T.hold[0],0],[T.exhale-.3,0],[T.exhale+.2,.55],[T.exhale+1.6,0]],t);
  p.smile=K([[0,0],[T.smile[0],0],[T.smile[1],1],[T.seam[0],1],[T.seam[1],0]],t);
  p.look=K([[0,[3.2,-.6]],[T.hit1,[3.2,-.6]],[T.hit1+.12,[0,0]],[T.hit2,[0,0]],[T.up2[1],[-2,0]],[6.8,[2.6,0]],[7.6,[-2.6,.4]],[8.6,[0,1.6]],[T.down1[1],[0,-.6]],[T.look[0],[0,-.6]],[T.look[1],[2.2,1.4]],[T.up3[1],[1.4,2.4]],[T.hold[1],[1,2.6]],[T.seam[0],[0,0]],[T.seam[1],[3.2,-.6]]],t);
  return p;
}
function phaseOf(t){ // integrate breathing rate so the phase never jumps
  let ph=0, s=0; const n=Math.ceil(t/.05); const dt=t/Math.max(1,n);
  for(let i=0;i<n;i++){ const x=i*dt; const r=K([[0,.22],[T.hit1,.36],[T.hit2,.85],[8.6,.7],[12,.5],[T.hold[1],.4],[T.ANS,.32],[26,.2],[30,.16],[T.seam[1],.22]],x); ph+=2*Math.PI*r*dt; }
  return ph;
}
// hand keys may mix torso-local and world targets: convert both ends to world at time t, then blend
let CUR=null;
function KH(keys,t){
  let i=1; if(t<=keys[0][0]) return toW(keys[0][1]); while(i<keys.length && t>keys[i][0]) i++;
  if(i>=keys.length) return toW(keys[keys.length-1][1]);
  const [a,va]=keys[i-1],[b,vb]=keys[i]; const u=sm((t-a)/(b-a)); const A=toW(va), B=toW(vb); return [lerp(A[0],B[0],u),lerp(A[1],B[1],u)];
}
function toW(v){ if(v.w) return v.w; if(!CUR) return [0,0]; return CUR.L2W(v[0],v[1]); }
const PHONE0=[392,872], PHONEDOWN=[742,1012];

// ============ the frame ============
let ROOM=null;
function setup(){
  // the room's still layer at the world scale (drawn under the camera)
}
function frame(t){
  const p0={r:0}; // placeholder
  // camera (world point at screen 540,905; zoom)
  const cam=K([[0,[318,950,1.56]],[T.hit2,[318,950,1.56]],[T.up2[1]+.1,[470,850,1.22]],[8.4,[560,888,1.0]],[T.hold[1],[566,900,1.08]],[T.bow[1],[566,900,1.42]],[T.ANS,[566,900,1.42]],[26.4,[560,872,.96]],[T.down2[0]+.6,[540,890,1.0]],[31.6,[318,950,1.56]],[T.seam[1],[318,950,1.56]]],t);
  // the camera feels his body: a hard drop and spring back on each blow
  const drop=(at,amp)=>{const u=t-at; return u<0?0:amp*Math.exp(-u*3.2)*Math.sin(u*9.5+.2)*(u<.05?u/.05:1);};
  let cy=cam[1]-drop(T.hit1,9)-drop(T.hit2,16);
  // very subtle handheld drift in the struggle, steady after the answer
  const hh=(1-ss(T.ANS,T.ANS+3,t))*ss(0,.01,t);
  const dx=hh*(Math.sin(t*.53)*3+Math.sin(t*1.31)*1.4), dy=hh*(Math.sin(t*.41+1)*2.5+Math.sin(t*1.07)*1.2);
  return {cx:cam[0]+dx, cy:cy+dy, z:cam[2]};
}

// ============ light ============
function warmK(t){ return t<T.ANS?0: 1-Math.exp(-(t-T.ANS)/4.2); }   // keeps rising, no pause
function nightAmt(t){ return 1-ss(T.seam[0],T.seam[1],t)*0; }
function phoneLight(t){
  let a=K([[0,.62],[T.buzz1,.62],[T.buzz1+.08,1],[T.buzz1+1.4,.75],[T.buzz2,.7],[T.buzz2+.08,1],[T.buzz2+1.6,.72],[T.tap,.72],[T.tap+.1,1],[17.58,.95],[17.7,0],[T.seam[0],0],[T.seam[1],.62]],t);
  return a;
}

// ============ drawing the room (world coordinates) ============
const STARS=(()=>{const r=rng(7),a=[];for(let i=0;i<26;i++)a.push([r(),r(),r()]);return a;})();
function drawRoom(t,warm){
  // wall
  const g=ctx.createLinearGradient(0,300,0,1300); g.addColorStop(0,mixh('#6b7fb0','#e9cfae',warm)); g.addColorStop(1,mixh('#8c9ac0','#f6e2c6',warm));
  ctx.fillStyle=g; ctx.fillRect(-800,-400,2800,1800);
  // a soft wainscot line
  ctx.fillStyle='rgba(40,50,90,.10)'; ctx.fillRect(-800,980,2800,40);
  // window (upper right): night sky, a few stars
  const wx=660,wy=520,ww=250,wh=300;
  ctx.fillStyle='#e9e2d4'; roundRect(wx-16,wy-16,ww+32,wh+32,10); ctx.fill();
  ctx.fillStyle='#c9bfae'; ctx.fillRect(wx-16,wy+wh+6,ww+32,14);
  const sky=ctx.createLinearGradient(0,wy,0,wy+wh); sky.addColorStop(0,'#16224a'); sky.addColorStop(1,'#2b3d74');
  ctx.fillStyle=sky; ctx.fillRect(wx,wy,ww,wh);
  for(const [a,b,c] of STARS){ const tw=.5+.5*Math.sin(t*(1+c*2)+c*20); ctx.fillStyle=`rgba(255,250,235,${.35+.5*tw*c})`; ctx.beginPath(); ctx.arc(wx+8+a*(ww-16),wy+8+b*(wh*.7),1.2+c*1.3,0,7); ctx.fill(); }
  // a thin crescent
  ctx.fillStyle='#fff6dc'; ctx.beginPath(); ctx.arc(wx+ww*.72,wy+wh*.26,22,0,7); ctx.fill();
  ctx.fillStyle='#17244c'; ctx.beginPath(); ctx.arc(wx+ww*.72+9,wy+wh*.26-6,20,0,7); ctx.fill();
  ctx.fillStyle='#e9e2d4'; ctx.fillRect(wx+ww/2-5,wy,10,wh); ctx.fillRect(wx,wy+wh/2-5,ww,10);
  // curtain on the left of the window
  S(`M${wx-40} ${wy-36}Q${wx+10} ${wy+120} ${wx-6} ${wy+wh+40}L${wx-62} ${wy+wh+40}Q${wx-70} ${wy+150} ${wx-60} ${wy-36}Z`,'#b8a7c9','#8d7aa3',-5,-3);
  // floor
  ctx.fillStyle=mixh('#5b5272','#8a6a5a',warm); ctx.fillRect(-800,1190,2800,900);
  ctx.fillStyle='rgba(0,0,0,.12)'; ctx.fillRect(-800,1190,2800,10);
}
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function drawBedBack(){
  // headboard
  S('M92 730Q92 700 122 700L150 700Q172 700 172 730L172 1150L92 1150Z','#9c6a48','#7a4e33',-6,-4);
  // mattress top (seen a little from above) and its front face
  S('M150 900Q150 884 168 884L962 884Q990 884 990 906L990 1110L150 1110Z','#efe9df','#d6cdbf',-4,-6);
  S('M150 1104L990 1104L990 1176Q990 1192 972 1192L168 1192Q150 1192 150 1176Z','#d9cfc0','#bfb3a2',-3,-3);
  // bed frame rail
  S('M136 1168L1004 1168L1004 1214Q1004 1226 990 1226L150 1226Q136 1226 136 1214Z','#9c6a48','#7a4e33',-4,-3);
  ctx.fillStyle='rgba(30,20,40,.25)'; ctx.fillRect(150,1226,840,10);
  // pillow
  S('M168 930Q160 900 196 898L360 902Q392 904 390 940L384 1062Q380 1094 350 1094L200 1096Q166 1096 166 1064Z','#fbf8f1','#ddd5c7',-5,-6);
  strokeP('M206 912Q280 924 360 912','#d6cdbf',3,.7);
}
function blanketLegs(p){
  // from the hips to the feet, a soft lump with the feet at the end
  const x0=HIP[0]-6;
  const d=`M${x0} 920Q${x0+120} 900 ${x0+260} 924Q${x0+330} 900 ${x0+372} 930Q${x0+408} 960 ${x0+400} 1040L${x0+404} 1112Q${x0+200} 1124 ${x0} 1116Z`;
  S(d,'#5d7fbe','#3f5f9c',-6,-6);
  strokeP(`M${x0+40} 1000Q${x0+180} 1010 ${x0+330} 994`,'#3f5f9c',3,.5);
  strokeP(`M${x0+60} 1060Q${x0+200} 1068 ${x0+360} 1054`,'#3f5f9c',3,.4);
  // the fold-over at the top edge (sheet showing)
}
function blanketCover(p,lying){
  // the part over his body, in torso-local units, so it follows the torso as he lies back and sits up
  const c=p.cover;
  ctx.save(); ctx.translate(HIP[0],HIP[1]); ctx.rotate(p.r*D*lying); ctx.scale(U,U);
  const ly=inv(-10,-80,p.r), top=-c, w=lerp(58,38,ly), wl=lerp(46,49,ly);
  const d=`M${-wl} 22L${-wl} ${top+6}Q${-wl} ${top-2} ${-wl+10} ${top}Q0 ${top+5} ${w-10} ${top}Q${w} ${top-2} ${w} ${top+6}L${w} 22Z`;
  S(d,'#5d7fbe','#3f5f9c',-3,-2);
  // the turned-down sheet along the top edge
  S(`M${-wl} ${top+6}Q${-wl} ${top-2} ${-wl+10} ${top}Q0 ${top+5} ${w-10} ${top}Q${w} ${top-2} ${w} ${top+6}L${w} ${top+13}Q0 ${top+17} ${-wl} ${top+13}Z`,'#f3eee5','#d8cfc1',-2,-2);
  ctx.restore();
}

// ============ the character's parts ============
function torsoPath(){ return P2(`M-44 6Q-49 -40 -40 ${-L+18}Q-36 ${-L+2} -18 ${-L}Q0 ${-L+6} 18 ${-L}Q36 ${-L+2} 40 ${-L+18}Q49 -40 44 6Q0 14 -44 6Z`); }
function drawTorso(p){
  const br=(1+p.breath)*(1-.46*p.bow);
  ctx.save(); ctx.scale(1+p.breath*.4+.04*p.bow,br);
  S(torsoPath(),TEE[0],TEE[1],-5,-4);
  // collar and a soft fold
  strokeP(`M-17 ${-L+1}Q0 ${-L+13} 17 ${-L+1}`,mixh(TEE[1],'#000000',.15),3.2,.8);
  strokeP(`M-30 -20Q-26 -4 -30 4`,TEE[1],2.2,.5);
  ctx.restore();
}
function drawNeckAndHead(p,ex){
  // head local: the app's 200-unit head, neck base at (100,142) -> attach at the torso's neck
  ctx.save(); ctx.translate(0,-L*(1+p.breath)*(1-.46*p.bow)+3+p.bow*30); ctx.rotate(p.tilt*D); ctx.scale(1,1-.1*p.bow); ctx.translate(-100,-140);
  const fy=96;
  S(`M88 ${fy+26}H112V${fy+46}Q100 ${fy+51} 88 ${fy+46}Z`,mixh(SK[0],SK[1],.45),SK[1],-3,4);
  // ears
  S(circ(57,fy+8,8.5),SK[0],SOFT,-2,-2); S(circ(143,fy+8,8.5),SK[0],SOFT,-2,-2);
  strokeP(`M56 ${fy+5}q2.6 3.6 0 7M144 ${fy+5}q-2.6 3.6 0 7`,SK[1],2);
  const fr=44,hx=100;

  o.push([t,{A:pp.A,B:pp.B,neck:CUR.L2W(0,-L),phone:ph.pos,cam:[cam.cx,cam.cy,cam.z],lid:p.lid}]);}return o;};
