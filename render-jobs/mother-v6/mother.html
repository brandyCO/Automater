<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="mother_mc.js"></script><script src="mother_mom.js"></script>
<script>
// MOTHER (Al-Baqarah 2:156). Her hand slips out of his; she walks up a path of light into the distance and is gone.
// On his knees he opens his hands: "Indeed we belong to Allah, and indeed to Him we will return." Her light comes down to the earth
// and wakes the prints she left on the road; he stands and walks on in her footsteps.
// ============ helpers ============
const W=1080,H=1920;
const cv=document.getElementById('c'); let ctx=cv.getContext('2d');
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const inv=(a,b,x)=>clamp((x-a)/(b-a));
const ss=(a,b,x)=>{const t=inv(a,b,x);return t*t*(3-2*t);};
const sm=t=>t*t*t*(t*(t*6-15)+10);
const eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eout=t=>1-Math.pow(1-t,3);
const ein=t=>t*t*t;
const D=Math.PI/180;
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
const mixc=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);
const rgba=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${clamp(a)})`;
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const bell=(a,b,x)=>{const m=(a+b)/2; return ss(a,m,x)*(1-ss(m,b,x));};
const lobe=(u,tau)=>u<=0?0:(u/tau)*Math.exp(1-u/tau);

// ============ the place ============
const G=1340, EDGE=-99999;
const MI=window.MCD.info;
const FORK=[770,G-8], FW=54, VP=[840,1098], FD=500;   // the path of light: its foot, half-width, where it goes, depth scale
const KX0=MI.x.sit[1], KX=712;                        // hip x when he sits up, and on his knees at the foot of the path
// ============ timeline (story seconds; the tail renders story time t-END) ============
const T={END:48.0, SW:46.72,
  w1at:-4.2, w1:[[0,1.15],[.95,2.15]],
  hit1:1.0, cut:2.2, lunge:3.0, hit2:MI.hit2,
  sitK:[9.35,10.4], try1:[9.95,10.9], try2:[11.3,12.3], try3:[13.0,13.9], wave:[13.35,14.9], gone:[15.0,15.9], drop:[15.95,16.4],
  hes:[16.25,16.85], open:[17.0,18.3],
  w2at:17.0, w2:[[0,1.0],[.85,1.95],[1.75,2.95]],
  pulse:19.05, beat:19.12, look:[19.7,20.7], touch:[21.5,22.5], lift:[24.3,25.3], rise:26.0, arrive:36.1, down:[36.5,37.4], ahead:[38.7,39.9],
  ret:38.0, out:[45.3,46.0], gust:[45.25,47.95]};
const MC0=window.MCD.t0;
const warmK=t=>ss(T.pulse-.2,T.pulse+5.5,t);
const calmK=t=>ss(T.pulse+.3,T.pulse+5,t);
// the release: from the answer the night keeps opening into dawn, without a pause, to the end
const dawnK=t=>{ const u=inv(T.pulse-.1,35.0,t); return u*(1.35-.35*u); };
// ============ wind: a cold night breeze from where she goes, with a gust on each blow ============
function gustAt(t){ let g=0; for(const [c,a,w] of [[-1.0,.3,.6],[.9,.85,.45],[2.7,.3,.7],[4.7,.7,.45],[8.0,.25,.9],[12.8,.3,1.0],[15.35,.5,.6]]) g+=a*Math.exp(-Math.pow((t-c)/w,2)); return g; }
function windAt(t){ const night=-(70+20*Math.sin(t*1.3)+14*Math.sin(t*3.1+1)+260*gustAt(t)); const breeze=-(26+8*Math.sin(t*.9)); return lerp(night,breeze,calmK(t)); }
// ============ the recorded performance (CMU mocap) ============
const MC=window.MCD; const MCJ={hip:0,lh:1,rh:2,lk:3,rk:4,la:5,ra:6,lt:7,rt:8,sp:9,nk:10,hd:11,he:12,ls:13,rs:14,le:15,re:16,lw:17,rw:18};
function mcFrame(t){ const f=clamp((t-MC0)*MC.fps,0,MC.n-1), a=Math.floor(f), b=Math.min(a+1,MC.n-1), u=f-a; const A=MC.frames[a], B=MC.frames[b];
  return A.map((p,i)=>[lerp(p[0],B[i][0],u),lerp(p[1],B[i][1],u),lerp(p[2],B[i][2],u)]); }
const L={th:37,sh:36,torso:52,neck:7,hr:15,ua:28,fa:27,ft:9};
function ik2(sx,sy,tx,ty,l1,l2,bend){
  let dx=tx-sx,dy=ty-sy,d=Math.hypot(dx,dy)||1e-3; const dd=Math.min(d,l1+l2-0.01);
  const a=Math.acos(clamp((l1*l1+dd*dd-l2*l2)/(2*l1*dd),-1,1)); const base=Math.atan2(dy,dx)+bend*a;
  return [[sx+Math.cos(base)*l1, sy+Math.sin(base)*l1],[sx+dx/d*dd, sy+dy/d*dd]];
}
const sub3=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], mid3=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2,(a[2]+b[2])/2];
const nrm2=a=>{const l=Math.hypot(a[0],a[1])||1;return [a[0]/l,a[1]/l];};
// facing from the feet (toes ahead of the ankles)
function mcFace(P){ const j=MCJ; const s=(P[j.lt][0]-P[j.la][0])+(P[j.rt][0]-P[j.ra][0]); return s; }
function mcSk(t){
  const P=mcFrame(t), j=MCJ, two=p=>[p[0],p[1]];
  const hip=mid3(P[j.lh],P[j.rh]), am=mid3(P[j.ls],P[j.rs]);
  const tu=nrm2(sub3(am,hip)); const sh=[hip[0]+tu[0]*L.torso, hip[1]+tu[1]*L.torso];
  const hu=nrm2(sub3(P[j.he],P[j.nk])); const head=[sh[0]+hu[0]*(L.neck+L.hr), sh[1]+hu[1]*(L.neck+L.hr)];
  const arm=(s3,e3,w3)=>{ const so=[sh[0]+(s3[0]-am[0])*.45, sh[1]+(s3[1]-am[1])*.45]; const ue=nrm2(sub3(e3,s3)), uf=nrm2(sub3(w3,e3)); const e=[so[0]+ue[0]*L.ua, so[1]+ue[1]*L.ua]; const h=[e[0]+uf[0]*L.fa, e[1]+uf[1]*L.fa]; return {e,h,z:(e3[2]+w3[2])}; };
  const al=arm(P[j.ls],P[j.le],P[j.lw]), ar=arm(P[j.rs],P[j.re],P[j.rw]);
  const dz=(P[j.lk][2]+P[j.la][2])-(P[j.rk][2]+P[j.ra][2]), dza=al.z-ar.z;
  const nl=clamp(.5+dz/24), na=clamp(.5+dza/24);
  let legs=[{k:two(P[j.lk]),f:two(P[j.la])},{k:two(P[j.rk]),f:two(P[j.ra])}], toes=[two(P[j.lt]),two(P[j.rt])], arms=[{e:al.e,h:al.h},{e:ar.e,h:ar.h}];
  let legA=[lerp(.62,1,nl),lerp(.62,1,1-nl)], armA=[lerp(.6,1,na),lerp(.6,1,1-na)];
  if(legA[1]>legA[0]){ legs=[legs[1],legs[0]]; toes=[toes[1],toes[0]]; legA=[legA[1],legA[0]]; }
  if(armA[1]>armA[0]){ arms=[arms[1],arms[0]]; armA=[armA[1],armA[0]]; }
  const ha=Math.atan2(hu[0],-hu[1]); const fc=mcFace(P);
  return {hip:two(hip),sh,head,legs,toes,arms,ux:tu[0],uy:tu[1],ha,face:clamp(fc/8,-1,1),legA,armA};
}
function lerpSk(a,b,w){ if(w<=0) return a; if(w>=1) return b; const L2=(p,q)=>[lerp(p[0],q[0],w),lerp(p[1],q[1],w)];
  const dd=(p,q)=>Math.hypot(p[0]-q[0],p[1]-q[1]);
  if(dd(a.legs[0].f,b.legs[1].f)+dd(a.legs[1].f,b.legs[0].f) < dd(a.legs[0].f,b.legs[0].f)+dd(a.legs[1].f,b.legs[1].f)) b={...b,legs:[b.legs[1],b.legs[0]],toes:[b.toes[1],b.toes[0]],legA:[b.legA[1],b.legA[0]]};
  if(dd(a.arms[0].h,b.arms[1].h)+dd(a.arms[1].h,b.arms[0].h) < dd(a.arms[0].h,b.arms[0].h)+dd(a.arms[1].h,b.arms[1].h)) b={...b,arms:[b.arms[1],b.arms[0]],armA:[b.armA[1],b.armA[0]]};
  const la=a.legA||[1,.62], aa=a.armA||[1,.6];
  return {...b, hip:L2(a.hip,b.hip), sh:L2(a.sh,b.sh), head:L2(a.head,b.head), legs:b.legs.map((l,i)=>({k:L2(a.legs[i].k,l.k),f:L2(a.legs[i].f,l.f)})), toes:b.toes.map((q,i)=>L2(a.toes[i],q)), arms:b.arms.map((q,i)=>({e:L2(a.arms[i].e,q.e),h:L2(a.arms[i].h,q.h)})), ux:lerp(a.ux,b.ux,w), uy:lerp(a.uy,b.uy,w), face:lerp(a.face??1,b.face??1,w), legA:[lerp(la[0],b.legA[0],w),lerp(la[1],b.legA[1],w)], armA:[lerp(aa[0],b.armA[0],w),lerp(aa[1],b.armA[1],w)]}; }

// ============ breathing ============
function breathPeriod(t){ let p=3.0; for(const h of [T.hit1,T.hit2]) if(t>h) p-=1.4*Math.exp(-(t-h-.5)/2.8);
  p-=.7*bell(2.9,4.6,t); p=lerp(p,2.2,bell(12.6,16.2,t)*.7); p=lerp(p,4.2,ss(16.2,17.8,t)); p=lerp(p,4.8,ss(19.5,24,t)); return Math.max(1.2,p); }
const BDT=1/240, BT0=-6, btab=[]; {let ph=0; for(let t=BT0;t<=T.END+.1;t+=BDT){btab.push(ph); ph+=2*Math.PI*BDT/breathPeriod(t);}}
const breathPh=t=>btab[clamp(Math.round((t-BT0)/BDT),0,btab.length-1)];
function breathAmp(t){ let a=2.0+.8*bell(-3,1.5,t); for(const h of [T.hit1,T.hit2]) if(t>h) a+=3.0*Math.exp(-(t-h-.4)/2.6); a+=1.0*bell(12.6,16.2,t); a=lerp(a,1.1,ss(20,25,t)); return a; }

// ============ the mother: a recorded walk (CMU), seen from behind as she goes up the path into the distance ============
const MOM=window.MOM;
const momU=(()=>{ const o=[]; let u=-2; for(let t=-2;t<=T.END+.1;t+=1/120){ o.push(u); const sp=1-ss(12.6,13.25,t)+ss(14.8,15.25,t); u+=sp/120; } return o; })();
const momClock=t=>momU[clamp(Math.round((t+2)*120),0,momU.length-1)];
const MOMX0=MOM.frames[clamp(Math.round((0-MOM.t0)*MOM.fps),0,MOM.frames.length-1)][0][0], MOMD0=-25;
function momJ3(t){ const u=momClock(t); const f=clamp((u-MOM.t0)*MOM.fps,0,MOM.frames.length-1); const a=Math.floor(f), b=Math.min(a+1,MOM.frames.length-1), q=f-a; const A=MOM.frames[a], B=MOM.frames[b]; return A.map((p,i)=>[lerp(p[0],B[i][0],q),lerp(p[1],B[i][1],q),lerp(p[2],B[i][2],q)]); }
// depth d along the path, height above it, lateral offset -> world point, its scale k and its parallax p
function projW(d,up,lat){ d=Math.max(d,-FD*.5); const k=FD/(FD+d); const wx=VP[0]+(FORK[0]+lat-VP[0])*k, wy=VP[1]+(FORK[1]-VP[1])*k-up*k; return {x:wx,y:wy,k,p:lerp(.3,1,k)}; }
function projS(d,up,lat){ const w=projW(d,up,lat); const s=toS(w.x,w.y,w.p); return [s[0],s[1],w.k*(1+(cam.z-1)*w.p)]; }
const n3=v=>{const l=Math.hypot(v[0],v[1],v[2])||1; return [v[0]/l,v[1]/l,v[2]/l];};
const add3=(a,v,s)=>[a[0]+v[0]*s,a[1]+v[1]*s,a[2]+v[2]*s];
function waveW(t){ return ss(T.wave[0],T.wave[0]+.4,t)*(1-ss(T.wave[1]-.35,T.wave[1],t)); }
function momSk3(t){ // [fwd(depth), up, lateral]
  const P=momJ3(t), j=MCJ; const off=-MOMX0+MOMD0; const S3=p=>[p[0]+off,p[1]*.94,p[2]*.9];
  const hip=S3(mid3(P[j.lh],P[j.rh])), am=S3(mid3(P[j.ls],P[j.rs]));
  const sh=add3(hip,n3(sub3(am,hip)),47); let head=add3(sh,n3(sub3(S3(P[j.he]),S3(P[j.nk]))),20);
  const so=i=>{ const s3=S3(P[i]); return [sh[0]+(s3[0]-am[0])*.5, sh[1]+(s3[1]-am[1])*.5, sh[2]+(s3[2]-am[2])]; };
  const arm=(si,ei,wi)=>{ const s=so(si); const e=add3(s,n3(sub3(S3(P[ei]),S3(P[si]))),24); const h=add3(e,n3(sub3(S3(P[wi]),S3(P[ei]))),23); return [s,e,h]; };
  const arms=[arm(j.ls,j.le,j.lw), arm(j.rs,j.re,j.rw)];
  // she stops, turns her head back to him and lifts her hand: goodbye
  const wv=waveW(t); if(wv>0){ const s=arms[0][0]; const sw=Math.sin((t-T.wave[0])*7.5)*9;
    const e=[s[0]-4,s[1]+14,s[2]-16], h=[s[0]-6,s[1]+36,s[2]-14+sw];
    arms[0]=[s,[lerp(arms[0][1][0],e[0],wv),lerp(arms[0][1][1],e[1],wv),lerp(arms[0][1][2],e[2],wv)],[lerp(arms[0][2][0],h[0],wv),lerp(arms[0][2][1],h[1],wv),lerp(arms[0][2][2],h[2],wv)]];
    head=[head[0],head[1],head[2]-5*wv]; }
  const leg=(a,b,c,d)=>[S3(P[a]),S3(P[b]),S3(P[c]),S3(P[d])];
  return {hip,sh,head,legs:[leg(j.lh,j.lk,j.la,j.lt),leg(j.rh,j.rk,j.ra,j.rt)],arms};
}
function momHeadW(t){ const s=momSk3(t); const w=projW(s.head[0],s.head[1],s.head[2]); return [w.x,w.y]; }
const momA=t=>1-ss(T.gone[0]+.15,T.gone[1],t);

// ============ the prints she left on the earth road: where his own steps will fall ============
const PRINTS=(()=>{ const o=[]; let last=-1e9; for(const s of window.MCD.steps){ if(s.t<27.4||s.t>36.4||s.x<KX+55) continue; if(s.x-last<30) continue; o.push({x:s.x+2,side:s.side,t:s.t}); last=s.x; }
  let x=o[o.length-1].x, sd=o[o.length-1].side; for(let i=0;i<16;i++){ x+=55+((i*37)%9); sd=1-sd; o.push({x,side:sd,t:null}); } return o; })();

// ============ hand-posed part: on his knees at the foot of the path (built facing right) ============
const P={
 sit:{torso:-8,head:16,thF:118,thB:110,knF:84,knB:78},
 kneel:{torso:10,head:-12,thF:80,thB:76,knF:170,knB:166},
 tall:{torso:-4,head:-36,thF:14,thB:10,knF:104,knB:100},
 hover:{torso:60,head:30,thF:80,thB:76,knF:170,knB:166},
 heels:{torso:30,head:48,thF:56,thB:50,knF:150,knB:144},
 open:{torso:12,head:14,thF:58,thB:52,knF:150,knB:144},
 up:{torso:2,head:-34,thF:62,thB:56,knF:154,knB:148},
 down:{torso:22,head:54,thF:62,thB:56,knF:154,knB:148},
 touch:{torso:76,head:28,thF:66,thB:60,knF:160,knB:154},
 road:{torso:4,head:-6,thF:70,thB:64,knF:162,knB:156},
};
const bp=(a,b,t)=>{if(t<=0)return a; if(t>=1) return b; const o={};for(const k in a)o[k]=lerp(a[k],b[k],t);return o;};
function buildAngle(o){
  const p=o.pose; const ba=breathAmp(o.t), bph=breathPh(o.t);
  const torso=p.torso+Math.sin(bph)*ba*.8, head=p.head-Math.sin(bph)*ba*.3;
  const legs=[0,1].map(i=>{ const th=(i?p.thB:p.thF), kn=(i?p.knB:p.knF);
    const k=[Math.sin(th*D)*L.th, Math.cos(th*D)*L.th]; const fa=(th-kn)*D; return {k, f:[k[0]+Math.sin(fa)*L.sh, k[1]+Math.cos(fa)*L.sh], fa}; });
  const ux=Math.sin(torso*D), uy=-Math.cos(torso*D);
  const sh=[ux*L.torso, uy*L.torso]; const ha=(torso+head)*D; const hd=[sh[0]+Math.sin(ha)*(L.neck+L.hr), sh[1]-Math.cos(ha)*(L.neck+L.hr)];
  let low=8; for(const l of legs){ low=Math.max(low,l.f[1]+2,l.k[1]+3); } low=Math.max(low, sh[1]+6, hd[1]+L.hr*.92);
  const hx=o.x, hy=o.gy-low; const O=v=>[hx+v[0],hy+v[1]];
  const sk={hip:[hx,hy], sh:O(sh), head:O(hd), legs:legs.map(l=>({k:O(l.k),f:O(l.f)})), ux, uy, legA:[1,.62], armA:[1,.6], face:1};
  sk.toes=sk.legs.map((l,i)=>{ const sx=l.f[0]-l.k[0], sy=l.f[1]-l.k[1], n=Math.hypot(sx,sy)||1; let fx=-sy/n, fy=sx/n; if(fx<0){fx=-fx; fy=-fy;}
    { const q=1-sm(inv(.3,.7,Math.abs(sy/n))); const a0=Math.atan2(fy,fx); let da=-Math.PI/2-a0; da=Math.atan2(Math.sin(da),Math.cos(da)); fx=Math.cos(a0+da*q); fy=Math.sin(a0+da*q); } return [l.f[0]+fx*L.ft, l.f[1]+fy*L.ft]; });
  const tg=o.arms? o.arms(sk) : [[sk.sh[0]+5,sk.sh[1]+52],[sk.sh[0]-1,sk.sh[1]+52]];
  sk.arms=[0,1].map(i=>{const [e,h]=ik2(sk.sh[0],sk.sh[1],tg[i][0],tg[i][1],L.ua,L.fa,1); return {e,h};});
  return sk;
}
function mirrorSk(s,ax){ const m=p=>[2*ax-p[0],p[1]]; return {...s, hip:m(s.hip), sh:m(s.sh), head:m(s.head), legs:s.legs.map(l=>({k:m(l.k),f:m(l.f)})), toes:s.toes.map(m), arms:s.arms.map(a=>({e:m(a.e),h:m(a.h)})), ux:-s.ux, face:-(s.face??1)}; }
function procSk(t){
  const w=(a,b)=>sm(inv(a,b,t));
  const kn=w(...T.sitK), t1=w(...T.try1)*(1-w(10.95,11.4)), t2=w(...T.try2)*(1-w(12.65,13.05)), t3=w(...T.try3)*(1-w(...T.drop)), dr=w(...T.drop), op=w(...T.open),
        up=w(T.pulse+.05,T.pulse+.55)*(1-w(...T.look)), lk=w(...T.look)*(1-w(...T.touch)), tc=w(...T.touch)*(1-w(...T.lift)), lf=w(...T.lift);
  let pose=bp(P.sit,P.kneel,kn); pose=bp(pose,P.tall,t1); pose=bp(pose,P.hover,t2); pose=bp(pose,P.tall,t3); pose=bp(pose,P.heels,dr); pose=bp(pose,P.open,op);
  pose=bp(pose,P.up,up); pose=bp(pose,P.down,lk); pose=bp(pose,P.touch,tc); pose=bp(pose,P.road,lf);
  pose={...pose}; pose.head-=10*bell(...T.hes,t);
  pose.head=lerp(pose.head,-22,t2*w(12.0,12.45));          // over her print he lifts his eyes to her again
  const x=lerp(KX0,KX,kn);
  const arms=sk=>{
    const h=momHeadW(clamp(t,2.2,15.6)); const dir=nrm2([h[0]-sk.sh[0],h[1]-sk.sh[1]]); const tr=Math.sin(t*21)*1.4;
    const rest=[[sk.sh[0]+18,sk.sh[1]+44],[sk.sh[0]+10,sk.sh[1]+46]];
    const sitA=[[sk.hip[0]-16,G-3],[sk.hip[0]-24,G-3]];
    const reach=[[sk.sh[0]+dir[0]*54,sk.sh[1]+dir[1]*54+tr],[sk.sh[0]+dir[0]*40+6,sk.sh[1]+dir[1]*40+12]];
    const reachHi=[[sk.sh[0]+dir[0]*51,sk.sh[1]+dir[1]*51+tr*1.6],[sk.sh[0]+dir[0]*44+2,sk.sh[1]+dir[1]*44+8]];
    const hov=[[PRINTS[0].x+1,G-16-3*Math.sin(t*5)],[sk.legs[0].k[0]+2,sk.legs[0].k[1]-4]];
    const lap=[[sk.hip[0]+22,sk.hip[1]-4],[sk.hip[0]+14,sk.hip[1]-2]];

  const g=ctx.createRadialGradient(o[0],o[1],0,o[0],o[1],R); g.addColorStop(0,`rgba(255,240,214,${a})`); g.addColorStop(.3,`rgba(240,200,156,${.8*a})`); g.addColorStop(1,'rgba(230,180,140,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  const sh=ctx.createRadialGradient(TXC,Y1,0,TXC,Y1,420); sh.addColorStop(0,`rgba(70,44,34,${.32*a})`); sh.addColorStop(1,'rgba(70,44,34,0)'); ctx.fillStyle=sh; ctx.fillRect(0,0,W,900); ctx.restore();
}
function gustWall(tr){
  const [A,B]=T.gust; if(tr<A) return; const u=inv(A,B,tr);

  const front=lerp(W+500,-900,eio(clamp((tr-A)/(T.SW+.55-A))));
  const back=lerp(W+1800,-700,ss(T.SW-.35,B,tr));
  const L0=Math.min(front,back), R0=Math.max(front,back);
  ctx.save(); ctx.setTransform(1,0,0,1,0,0);
  const g=ctx.createLinearGradient(front-260,0,front+120,0); g.addColorStop(0,'rgba(26,30,40,.97)'); g.addColorStop(1,'rgba(26,30,40,0)');
  const g2=ctx.createLinearGradient(back-160,0,back+320,0); g2.addColorStop(0,'rgba(26,30,40,0)'); g2.addColorStop(1,'rgba(26,30,40,.97)');
  ctx.fillStyle='rgba(26,30,40,.97)'; ctx.fillRect(Math.max(-10,front+120-1e-3)>back-160? back-160:front+120, 0, 0, 0);
  // body of the wall between the two edges
  const x0=Math.max(front-260,-10), x1=Math.min(back+320,W+10);
  if(x1>x0){ ctx.beginPath(); ctx.rect(x0,0,x1-x0,H); ctx.clip();
    ctx.fillStyle='rgba(26,30,40,.97)'; ctx.fillRect(front+120,0,Math.max(0,back-160-(front+120)),H);
    ctx.fillStyle=g; ctx.fillRect(front-260,0,380,H); ctx.fillStyle=g2; ctx.fillRect(back-160,0,480,H);
    const so=(tr-A)*-2600; ctx.globalAlpha=.9; for(let k=-1;k<3;k++){ ctx.drawImage(gustCv,((so%1080)+1080)%1080-1080+k*1080,0,1080,H); }
  }
  ctx.restore();
}

// ============ frame ============
function draw(tr){
  const ts=tr>=T.SW? tr-T.END : tr; tt=tr;
  cam=camFinal(tr,Math.max(ts,T.cut));
  ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over'; ctx.filter='none';
  ctx.fillStyle='#0b111c'; ctx.fillRect(0,0,W,H);
  // one continuous take: the lens racks from his hand to the road behind it; his hand drops out of frame (no cut)
  const pk=ts<0?0:ss(PULL[0],PULL[1],ts); const close=pk<=0; MOTEA=pk;
  if(close){ drawCloseUp(ts); }
  else {
    const mid=pk<1; let c0=null;
    if(mid){ c0=ctx; ctx=wcx; ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha=1; ctx.filter='none'; ctx.fillStyle='#0b111c'; ctx.fillRect(0,0,W,H); }
    ctx.save(); ctx.translate(540,960); ctx.rotate(cam.rot); ctx.translate(-540,-960);
    const sad=.55*ss(5.3,6.4,ts)*(1-ss(8.6,9.8,ts))+.75*ss(15.4,16.2,ts)*(1-ss(16.9,18.6,ts)); if(sad>.02) ctx.filter=`blur(${(2.2*sad).toFixed(2)}px)`;
    drawSky(ts); drawGround(ts); ctx.filter='none';
    drawPath(ts); drawMom(ts); drawPrints(ts);
    const sk=skAt(ts);
    drawShadow(sk,ts); drawKicks(ts);
    drawFigure(sk,ts);
    drawBreath(ts);
    ctx.restore();
    if(mid){ ctx=c0;
      // the close shot behind: its bokeh light melts away as the road comes into focus
      ctx.save(); ctx.globalAlpha=1-ss(PULL[0],PULL[1]-.15,ts); drawCloseBg(ts); ctx.restore();
      ctx.save(); const bw=14*(1-sm(inv(PULL[0]+.1,PULL[1],ts))); if(bw>.05) ctx.filter=`blur(${bw.toFixed(1)}px)`; ctx.globalAlpha=ss(PULL[0],PULL[1]-.3,ts); ctx.drawImage(WC,0,0); ctx.restore();
      // his hand, still closing on nothing, falls away past the lens (foreground: it goes soft as it leaves)
      const e=sm(inv(PULL[0],PULL[1],ts)); ctx.save(); ctx.translate(GRIP[0],GRIP[1]); ctx.scale(1+.7*e,1+.7*e); ctx.translate(-GRIP[0]-260*e,-GRIP[1]+620*e*e);
      EXTRA_BLUR=16*e; drawHands(ts); EXTRA_BLUR=0; ctx.restore(); }
  }
  drawStorm(ts);
  // grade: cold and grey while she goes, warm from the moment her light comes down to his road
  { const cold=(1-warmK(ts)); if(cold>.01){ ctx.save(); ctx.globalCompositeOperation='saturation'; ctx.fillStyle=`rgba(128,128,128,${.36*cold})`; ctx.fillRect(0,0,W,H);
      ctx.globalCompositeOperation='soft-light'; ctx.fillStyle=`rgba(70,100,150,${.16*cold})`; ctx.fillRect(0,0,W,H); ctx.restore(); }
    const wm=warmK(ts); if(wm>.01){ ctx.save(); ctx.globalCompositeOperation='soft-light'; ctx.fillStyle=`rgba(255,190,120,${.12*wm})`; ctx.fillRect(0,0,W,H); ctx.restore(); }
    const dk=close?0:dawnK(ts); if(dk>.01){ ctx.save(); ctx.globalCompositeOperation='screen'; const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,`rgba(255,214,170,${.0*dk})`); g.addColorStop(.55,`rgba(255,200,150,${.16*dk})`); g.addColorStop(.75,`rgba(255,196,146,${.12*dk})`); g.addColorStop(1,`rgba(255,190,140,${.03*dk})`); ctx.fillStyle=g; ctx.fillRect(0,0,W,H); ctx.restore(); } }
  if(!close) drawMotes(ts);
  bloomPass(ts);
  drawPain(ts);
  lightLoop(tr);
  if(tr<T.SW){
    const fadeAll=1-ss(...T.out,tr);
    const A1=Math.max(1-ss(25.6,26.9,tr), ss(T.ret-.5,T.ret+.4,tr)), A1t=(1-ss(25.6,26.9,tr))*fadeAll;
    drawArabic('a',T.w1at,T.w1,Y1,A1,'a',false); sparks(T.w1at,T.w1at+4.2,Y1,A1*.55);
    drawTrans(TR1,2.5,Y1T,A1t*.95);
    const A2=Math.max(1-ss(25.6,26.9,tr), ss(T.ret+.3,T.ret+1.2,tr))*fadeAll, A2t=(1-ss(25.6,26.9,tr))*fadeAll;
    drawArabic('b',T.w2at,T.w2,Y2,A2,'b',true); sparks(T.w2at,T.w2at+4.4,Y2,A2*.55); if(tr>T.ret) sparks(T.ret+.3,T.ret+3.5,Y2,A2*.5);
    drawTrans(TR2,20.6,Y2T,A2t*.95); drawRef('AL-BAQARAH  ·  2:156',21.8,YREF+10,A2t);
    // the frame people keep: both lines and the English, clean and still, two seconds before the loop
    drawTrans('Indeed we belong to Allah, | and indeed to Him we will return.',T.ret+1.1,772,fadeAll*ss(T.ret+.9,T.ret+1.6,tr),60);
    const wmk=ss(39.6,40.2,tr)*(1-ss(45.0,45.6,tr)); if(wmk>0){ctx.save(); ctx.font='30px Corm'; ctx.letterSpacing='10px'; ctx.textAlign='center'; ctx.fillStyle=`rgba(245,230,205,${.55*wmk})`; ctx.fillText('AYAH STUDIO',505,1300); ctx.restore();}
  } else {
    // the loop: line 1 stays on across the seam (frame 0 shows it whole)
    drawArabic('a',T.w1at,T.w1,Y1,1,'a',false);
  }
  if(window.SAFE){ ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle='rgba(255,40,40,.16)'; ctx.fillRect(0,0,W,270); ctx.fillRect(0,1250,W,H-1250); ctx.fillRect(940,270,140,980);
    ctx.strokeStyle='rgba(255,80,80,.9)'; ctx.setLineDash([14,10]); ctx.lineWidth=3; ctx.strokeRect(0,270,940,980); ctx.restore(); }
  ctx.setTransform(1,0,0,1,0,0);
  const vg=ctx.createRadialGradient(540,900,500,540,960,1250); vg.addColorStop(0,'rgba(0,0,0,0)'); let vk=.5-.15*(ts<T.cut?0:dawnK(ts)); if(tr>=T.gust[0]) vk=lerp(.35,.5,tr<T.SW?0:sm(inv(T.SW,T.END,tr))); vg.addColorStop(1,`rgba(0,0,0,${vk})`); ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
}

function events(){
  const ev=[]; const add=(t,type,o={})=>ev.push({t,type,...o});
  add(-1.3,'slide',{d:2.3}); add(T.hit1,'gust',{g:.8}); add(T.hit1,'slip'); add(T.hit1+.02,'hit',{g:.75});
  add(T.lunge,'rustle',{d:.6}); add(T.hit2-.55,'through'); add(T.hit2,'hit',{g:1.0}); add(T.hit2+.12,'rustle',{d:.6});
  add(7.5,'rustle',{d:1.4}); add(T.sitK[0]+.2,'rustle',{d:1.0}); add(T.sitK[1]-.3,'knees');
  add(T.try1[0],'rustle',{d:.8}); add(T.try2[0],'rustle',{d:.8}); add(T.try3[0],'rustle',{d:.9}); add(T.gone[0]+.1,'gone'); add(T.drop[0],'rustle',{d:.6}); add(T.drop[0]+.25,'knees',{g:.6});
  add(T.open[0],'rustle',{d:1.1});
  add(T.pulse-.15,'pulse'); add(T.beat,'beat'); for(let i=0;i<PRINTS.length;i++){ const ti=T.pulse+.62+(PRINTS[i].x-PRINTS[0].x)/650; if(PRINTS[i].x<1750) add(ti,'wake',{g:Math.exp(-i/6)}); }
  add(T.look[0],'rustle',{d:.6}); add(T.touch[0],'rustle',{d:.8}); add(T.touch[1]-.35,'touch'); add(T.lift[0],'rustle',{d:.7});
  add(T.rise,'rustle',{d:1.2});
  for(const s of STEPS){ if(s.t<2.6) continue; const run=s.t<4.5; const kind=run?'run':(s.t>27?'walk':'step'); const inPrint=PRINTS.some(p=>p.t!==null&&Math.abs(p.t-s.t)<.01); ev.push({t:s.t,type:'step',kind,x:s.x,print:inPrint?1:0}); }
  let prev=null; for(let t=-2;t<T.END;t+=1/240){const ph=breathPh(t); const k=Math.floor(ph/Math.PI); if(prev!==null&&k!==prev) ev.push({t,type:(k%2===0)?'inhale':'exhale',amp:breathAmp(t),per:breathPeriod(t)}); prev=k;}
  ev.push({t:0,type:'marks',T:{...T}, gust:Array.from({length:Math.ceil((T.END+3)*20)+1},(_,i)=>gustAt(i/20-3)), wind:Array.from({length:Math.ceil((T.END+3)*20)+1},(_,i)=>windAt(i/20-3))});
  return ev;
}
window.draw=draw; window.REAL_END=()=>T.END; window.events=events; window.T=T;
