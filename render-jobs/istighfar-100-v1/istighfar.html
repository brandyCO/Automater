<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'AmiriQ';src:url(amiri.woff2) format('woff2');}
@font-face{font-family:'Corm';src:url(corm.woff2) format('woff2');}
@font-face{font-family:'CormI';src:url(cormi.woff2) format('woff2');}
@font-face{font-family:'Cinzel';src:url(cinzel.woff2) format('woff2');font-weight:400 900;}
html,body{margin:0;background:#000;overflow:hidden}
canvas{display:block}
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// ISTIGHFAR x100. One place, one change: a burnt, burning land around a man sitting with his back to us.
// Each istighfar puts out a fire, then brings the rain, then grows the garden outward from where he sits,
// until rivers run and the sun comes up (Nuh 71:10-12: ask forgiveness... He sends rain, gardens and rivers).
// One continuous take. draw(t) is deterministic.
const W=1080,H=1920,HZ=880,FX=505,FY=1188;
const cv=document.getElementById('c'),ctx0=cv.getContext('2d');
const off=document.createElement('canvas');off.width=W;off.height=H;const offx=off.getContext('2d');
let ctx=ctx0;
// ---------- helpers
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const inv=(a,b,v)=>cl((v-a)/(b-a));
const sm=x=>x*x*(3-2*x);
const ss=(a,b,v)=>sm(inv(a,b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const eob=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const hash=(i,j=0)=>{let h=Math.imul(i*374761393+j*668265263,1274126177);h^=h>>>13;h=Math.imul(h,1103515245);return((h^h>>>16)>>>0)/4294967296;};
function hx(c){return[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];}
function mixc(a,b,t){return[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];}
function rgb(c,a=1){return`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;}
function keys(ks,p){ // ks: [[p,'#hex'],...]
  if(p<=ks[0][0])return hx(ks[0][1]);
  for(let i=1;i<ks.length;i++){if(p<=ks[i][0]){const t=sm(inv(ks[i-1][0],ks[i][0],p));return mixc(hx(ks[i-1][1]),hx(ks[i][1]),t);}}
  return hx(ks[ks.length-1][1]);
}
function noise1(x){const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return lerp(hash(i,7)*2-1,hash(i+1,7)*2-1,u);}

// ---------- timeline: 100 counts, slow enough to say along at first, then a steady quick tasbih rhythm,
// easing off over the last five so 100 lands with weight.
const N=100,CT=[0];
(function(){let t=0.85;CT[1]=t;
  for(let k=1;k<N;k++){
    let g=lerp(1.1,0.36,ss(4,26,k));
    if(k>=94)g+= [0.04,0.08,0.13,0.2,0.28,0.38][k-94];
    t+=g;CT[k+1]=t;}
})();
const T100=CT[N];
const TB=T100+0.15;           // bloom starts
const TXT=T100+2.2;           // ayah text in
const TLOOP=T100+9.6;        // loop dissolve starts
const END=TLOOP+1.6;
function countAt(t){let lo=0,hi=N;while(lo<hi){const m=(lo+hi+1)>>1;if(CT[m]<=t)lo=m;else hi=m-1;}return lo;}
// smooth progress: each count adds 1/100, eased over ~0.55 s
function prog(t){const k=countAt(t);let p=Math.max(0,k-3)/N;for(let j=Math.max(1,k-3);j<=k;j++){p+=sm(cl((t-CT[j])/0.55))/N;}return Math.min(1,p);}

// ---------- world / layout
const R=rng(11);
function depth(y){return cl((y-HZ)/(H-HZ),0.0001,1);} // 0 at horizon, 1 at bottom
function scl(y){return 0.12+depth(y)*1.25;}
// ground-plane distance from the man (for spreading growth outward from him)
function gdist(x,y){const d=depth(y),dF=depth(FY);const wx=(x-FX)/scl(y);const z=1/(d+0.02),zF=1/(dF+0.02);return Math.sqrt(Math.hypot(wx,(z-zF)*450)/9000)*2.6;}

// hills: two layers of silhouettes
function hillPts(seed,base,amp,f){const r=rng(seed),ph=[r()*6,r()*6,r()*6];const a=[];for(let x=-20;x<=W+20;x+=12){a.push([x,base-amp*(0.55*Math.sin(x*f+ph[0])+0.3*Math.sin(x*f*2.3+ph[1])+0.15*Math.sin(x*f*5.1+ph[2]))-amp*0.4]);}return a;}
const HILL1=hillPts(3,HZ-10,46,0.0062),HILL2=hillPts(9,HZ+6,30,0.0095);
function hillY(arr,x){const i=cl(Math.floor((x+20)/12),0,arr.length-2);const f=((x+20)-i*12)/12;return lerp(arr[i][1],arr[i+1][1],f);}
// trees on hills (round blobs) appearing late
const HTREES=[];for(let i=0;i<46;i++){const layer=i<26?1:2;const x=R()*1100-10;const y=(layer==1?hillY(HILL1,x):hillY(HILL2,x))+2+R()*6;HTREES.push({x,y,layer,s:(layer==1?9:14)*(0.7+R()*0.6),th:0.66+R()*0.22,c:R()});}
HTREES.sort((a,b)=>a.y-b.y);

// river: from the horizon, winding down the right side
const RIV=[];(function(){for(let i=0;i<=60;i++){const u=i/60;const y=HZ+4+Math.pow(u,1.6)*(H-HZ+80);const x=640+120*Math.sin(u*3.2+0.4)+u*u*380;RIV.push([x,y,u]);}})();

// cracks in the ground (random walks), screen space
const CRACKS=[];(function(){const r=rng(5);for(let i=0;i<46;i++){let y=HZ+20+Math.pow(r(),0.9)*(H-HZ-60);let x=r()*1160-40;let a=r()*Math.PI*2;const pts=[[x,y]];const n=6+(r()*10|0);for(let j=0;j<n;j++){a+=(r()-0.5)*1.3;const s=scl(y)*(22+r()*30);x+=Math.cos(a)*s;y+=Math.sin(a)*s*0.32;pts.push([x,y]);}
  const gd=gdist(pts[0][0],pts[0][1]);if(Math.abs(pts[0][0]-FX)<90&&Math.abs(pts[0][1]-FY)<60)continue;CRACKS.push({pts,w:0.6+r()*1.4,gd});}})();

// fires: each count puts one out, nearest to him first
const FIRES=[];(function(){const r=rng(21);let tries=0;while(FIRES.length<27&&tries<2000){tries++;let x,y,onHill=false;
    if(FIRES.length<7&&r()<0.8){x=r()*1080;y=hillY(HILL1,x)+2;onHill=true;} else {x=r()*1100-10;y=HZ+12+Math.pow(r(),1.25)*(1500-HZ);}
    if(Math.abs(x-FX)<150&&Math.abs(y-FY)<120)continue; if(Math.abs(x-250)<70&&Math.abs(y-1010)<40)continue;
    if(FIRES.some(f=>Math.abs(f.x-x)<110*scl(y)&&Math.abs(f.y-y)<45*scl(y)))continue;
    FIRES.push({x,y,s:scl(y)*(onHill?1.3:1.7)*(0.75+r()*0.5),ph:r()*100,gd:gdist(x,y)});}
  FIRES.sort((a,b)=>a.gd-b.gd);FIRES.forEach((f,i)=>{f.k=i+1;});})();
const FIRES_Y=FIRES.slice().sort((a,b)=>a.y-b.y);

function riverHalf(y){for(let i=1;i<RIV.length;i++){if(RIV[i][1]>=y){const a=RIV[i-1],b=RIV[i];const f=(y-a[1])/(b[1]-a[1]||1);return[lerp(a[0],b[0],f),80*scl(y)];}}return[-9999,0];}
function inRiver(x,y){const [rx,hw]=riverHalf(y);return Math.abs(x-rx)<hw*1.05;}
// grass blades
const GR=[];(function(){const r=rng(31);for(let i=0;i<5200;i++){const d=Math.pow(r(),1.35);const y=HZ+6+d*(H-HZ);const x=r()*1140-30;if(Math.abs(x-FX)<70*scl(y)&&Math.abs(y-FY)<14)continue;if(inRiver(x,y))continue;const gd=gdist(x,y);GR.push({x,y,h:scl(y)*(16+r()*24),lean:(r()-0.5)*0.7,th:0.34+cl(gd/2.6)*0.5+r()*0.05,c:r(),ph:r()*6.28,gd});}GR.sort((a,b)=>a.y-b.y);})();
// flowers
const FL=[];(function(){const r=rng(41);for(let i=0;i<300;i++){const d=Math.pow(r(),1.2);const y=HZ+20+d*(H-HZ-20);const x=r()*1120-20;if(Math.abs(x-FX)<90*scl(y)&&Math.abs(y-FY)<20)continue;if(inRiver(x,y))continue;const gd=gdist(x,y);FL.push({x,y,s:scl(y)*(3+r()*3),th:0.5+cl(gd/2.6)*0.42+r()*0.04,c:r()<0.55?0:(r()<0.6?1:2),ph:r()*6});}FL.sort((a,b)=>a.y-b.y);})();

// the dead tree beside him: recursive branches, leaf clusters at the tips
const TREE={x:206,y:1016,br:[],tips:[]};(function(){const r=rng(77);
  function grow(x,y,a,len,w,dep){const x2=x+Math.cos(a)*len,y2=y+Math.sin(a)*len;TREE.br.push({x,y,x2,y2,w,dep,cx:(x+x2)/2+(r()-0.5)*len*0.25,cy:(y+y2)/2+(r()-0.5)*len*0.15});
    if(dep>=5||len<16){TREE.tips.push({x:x2,y:y2,s:7+r()*7,th:0.5+r()*0.28,bl:0.74+r()*0.18,c:r()});return;}
    const n=dep<1?2:(r()<0.35?3:2);for(let i=0;i<n;i++){grow(x2,y2,a+(i-(n-1)/2)*(0.55+r()*0.35)+(r()-0.5)*0.3,len*(0.68+r()*0.12),w*0.66,dep+1);}}
  grow(TREE.x,TREE.y,-Math.PI/2-0.08,104,14,0);})();

// rain, embers, motes, birds are procedural per frame (hash based)

// ---------- state
function state(t){
  const P=prog(t);const k=countAt(t);
  const B=ss(TB,TB+4.5,t);
  return{t,P,k,B};
}

// ---------- palettes
const SKY_T=[[0,'#14060a'],[0.22,'#121113'],[0.42,'#1d2532'],[0.64,'#2a4868'],[0.86,'#2f5684'],[1,'#3a77a8']];
const SKY_M=[[0,'#3f0e0b'],[0.22,'#2a2425'],[0.42,'#37434f'],[0.64,'#6c8ca6'],[0.86,'#c99a90'],[1,'#a9d3df']];
const SKY_H=[[0,'#c0390f'],[0.22,'#5e3a2c'],[0.42,'#5c6a76'],[0.64,'#b8c8c8'],[0.86,'#f5c48c'],[1,'#ffe6b0']];
const GND_F=[[0,'#2a0f0a'],[0.25,'#2a2624'],[0.45,'#2b2a26'],[0.7,'#3d5a33'],[1,'#5e8e44']];
const GND_N=[[0,'#140806'],[0.25,'#1b1817'],[0.45,'#1e1d1a'],[0.7,'#2c4426'],[1,'#41702f']];
const H1C=[[0,'#2b0f0c'],[0.25,'#25201f'],[0.45,'#2e3640'],[0.72,'#4f6f6a'],[1,'#86b3a3']];
const H2C=[[0,'#1a0907'],[0.25,'#1b1817'],[0.45,'#232a2a'],[0.72,'#3d6640'],[1,'#5d9a52']];

// ---------- scene
function drawScene(S){
  const {t,P,k,B}=S;
  const fire=1-ss(0.02,0.29,P);
  const cloud=ss(0.13,0.3,P)*(1-ss(0.7,0.9,P));
  const rain=ss(0.22,0.33,P)*(1-ss(0.6,0.76,P));
  const wet=ss(0.28,0.5,P);
  const pc=P*0.97+B*0.03;
  ctx.save();
  // camera: a slow settle from close to wide as hope comes (anchored on him)
  const z=lerp(1.07,1.0,ss(0.0,1,P*0.85+B*0.15));
  ctx.translate(FX,FY-60);ctx.scale(z,z);ctx.translate(-FX,-(FY-60));
  // sky
  const st=keys(SKY_T,pc),sm_=keys(SKY_M,pc),sh=keys(SKY_H,pc);
  let g=ctx.createLinearGradient(0,-120,0,HZ+40);g.addColorStop(0,rgb(st));g.addColorStop(0.55,rgb(sm_));g.addColorStop(1,rgb(sh));
  ctx.fillStyle=g;ctx.fillRect(-100,-150,W+200,HZ+200);
  // sun (dawn) + rays
  const sunUp=ss(0.8,1,P)*0.7+B*0.3;
  if(sunUp>0){const sy=lerp(HZ+40,HZ-120,sunUp),sx=FX+30;
    ctx.save();ctx.globalCompositeOperation='lighter';
    let rg=ctx.createRadialGradient(sx,sy,0,sx,sy,620);rg.addColorStop(0,`rgba(255,226,170,${0.55*sunUp})`);rg.addColorStop(0.25,`rgba(255,200,140,${0.22*sunUp})`);rg.addColorStop(1,'rgba(255,190,130,0)');
    ctx.fillStyle=rg;ctx.fillRect(-100,-150,W+200,HZ+300);
    if(B>0){ctx.translate(sx,sy);for(let i=0;i<14;i++){const a=i/14*Math.PI*2+t*0.04+Math.sin(i*3.1)*0.1;const wdt=0.05+hash(i,3)*0.05;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,1500,a-wdt,a+wdt);ctx.closePath();
        const rr=ctx.createRadialGradient(0,0,40,0,0,1300);rr.addColorStop(0,`rgba(255,236,190,${0.08*B})`);rr.addColorStop(1,'rgba(255,236,190,0)');ctx.fillStyle=rr;ctx.fill();}}
    ctx.restore();
    ctx.save();ctx.beginPath();ctx.arc(sx,sy,46,0,7);ctx.fillStyle=`rgba(255,244,214,${0.95*sunUp})`;ctx.shadowColor='rgba(255,220,160,0.9)';ctx.shadowBlur=60;ctx.fill();ctx.restore();
  }
  // smoke haze (fire phase) and clouds
  const smoke=ss(0.0,0.12,P)*(1-ss(0.3,0.5,P))+fire*0.35;
  if(smoke>0.01){for(let i=0;i<7;i++){const x=((i*190+t*(8+i*2))%1400)-160,y=HZ-120-i*55;const r=260+i*30;const rg=ctx.createRadialGradient(x,y,0,x,y,r);rg.addColorStop(0,`rgba(40,30,30,${0.22*smoke})`);rg.addColorStop(1,'rgba(40,30,30,0)');ctx.fillStyle=rg;ctx.fillRect(x-r,y-r,2*r,2*r);}}
  if(cloud>0.01){for(let i=0;i<9;i++){const x=((i*157+t*(5+i))%1500)-200,y=60+((i*97)%5)*110+Math.sin(i)*30;const r=220+(i%3)*90;const c=mixc([58,64,76],[150,160,170],ss(0.5,0.8,P));const rg=ctx.createRadialGradient(x,y,0,x,y,r);rg.addColorStop(0,rgb(c,0.55*cloud));rg.addColorStop(0.6,rgb(c,0.25*cloud));rg.addColorStop(1,rgb(c,0));ctx.fillStyle=rg;ctx.fillRect(x-r,y-r,2*r,2*r);}}
  // fire glow on the horizon
  if(fire>0.01){const rg=ctx.createLinearGradient(0,HZ-260,0,HZ+60);rg.addColorStop(0,'rgba(255,90,20,0)');rg.addColorStop(1,`rgba(255,90,20,${0.35*fire})`);ctx.fillStyle=rg;ctx.fillRect(-100,HZ-260,W+200,330);}
  if(fire>0.01){const hz=ctx.createRadialGradient(FX,HZ,0,FX,HZ,900);hz.addColorStop(0,`rgba(255,120,40,${0.18*fire})`);hz.addColorStop(1,'rgba(255,120,40,0)');ctx.fillStyle=hz;ctx.fillRect(-100,HZ-900,W+200,1100);}
  // far hills
  const hz1=keys(H1C,P);ctx.beginPath();ctx.moveTo(-40,H);HILL1.forEach(p=>ctx.lineTo(p[0],p[1]));ctx.lineTo(W+40,H);ctx.closePath();
  g=ctx.createLinearGradient(0,HZ-90,0,HZ+20);g.addColorStop(0,rgb(mixc(hz1,sh,0.25)));g.addColorStop(1,rgb(hz1));ctx.fillStyle=g;ctx.fill();
  drawHillTrees(1,P);
  drawFires(S,f=>f.y<HZ-2);
  const hz2=keys(H2C,P);ctx.beginPath();ctx.moveTo(-40,H);HILL2.forEach(p=>ctx.lineTo(p[0],p[1]));ctx.lineTo(W+40,H);ctx.closePath();ctx.fillStyle=rgb(hz2);ctx.fill();
  drawHillTrees(2,P);
  // ground
  const gf=keys(GND_F,P),gn=keys(GND_N,P);
  g=ctx.createLinearGradient(0,HZ+10,0,H);g.addColorStop(0,rgb(mixc(gf,hz2,0.3)));g.addColorStop(0.35,rgb(gf));g.addColorStop(1,rgb(gn));
  ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(-60,H+60);for(let x=-60;x<=W+60;x+=20)ctx.lineTo(x,Math.max(HZ+8,hillY(HILL2,cl(x,-20,W+20))+14));ctx.lineTo(W+60,H+60);ctx.closePath();ctx.fill();
  // fire light on the ground near flames
  if(fire>0.01){ctx.save();ctx.globalCompositeOperation='lighter';FIRES.forEach(f=>{const a=flameLife(f,t);if(a<=0)return;const r=170*f.s;const rg=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,r);rg.addColorStop(0,`rgba(255,110,30,${0.22*a})`);rg.addColorStop(1,'rgba(255,110,30,0)');ctx.fillStyle=rg;ctx.save();ctx.translate(f.x,f.y);ctx.scale(1,0.45);ctx.translate(-f.x,-f.y);ctx.fillRect(f.x-r,f.y-r,2*r,2*r);ctx.restore();});ctx.restore();}
  // sky reflection on wet ground
  if(wet>0&&rain>0.05){ctx.save();ctx.globalAlpha=0.18*rain;g=ctx.createLinearGradient(0,HZ,0,H);g.addColorStop(0,rgb(sh));g.addColorStop(1,rgb(sm_,0));ctx.fillStyle=g;ctx.fillRect(-60,HZ,W+120,H-HZ+60);ctx.restore();}
  drawRiver(S,sh,sm_);
  drawCracks(S,sh);
  drawRipples(S);
  drawFlora(S,y=>y<TREE.y);
  drawFires(S,f=>f.y>=HZ-2&&f.y<TREE.y);
  drawTree(S);
  drawFlora(S,y=>y>=TREE.y&&y<FY);
  drawFires(S,f=>f.y>=TREE.y&&f.y<FY);
  drawMan(S);
  drawFlora(S,y=>y>=FY);
  drawFires(S,f=>f.y>=FY);
  drawSmokePuffs(S);
  drawRain(S,rain);
  drawEmbers(S,fire);
  drawMotes(S);
  drawBirds(S);
  ctx.restore();
  // grade: cold/ash vignette early, warm open light late
  g=ctx.createRadialGradient(FX,HZ+120,200,FX,HZ+120,1500);
  const vg=lerp(0.62,0.22,ss(0.3,1,P));g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(0,0,0,${vg})`);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  if(B>0){ctx.save();ctx.globalCompositeOperation='soft-light';ctx.fillStyle=`rgba(255,220,160,${0.25*B})`;ctx.fillRect(0,0,W,H);ctx.restore();}
}

function flameLife(f,t){ // 1 alive, falls to 0 over 0.5 s after its count
  const tk=CT[f.k];if(t<tk)return 1;return 1-sm(cl((t-tk)/0.5));
}
function drawFires(S,filter){const t=S.t;
  FIRES_Y.forEach(f=>{if(!filter(f))return;const a=flameLife(f,t);if(a<=0.001)return;
    const s=f.s*(0.35+0.65*a);const x=f.x,y=f.y;
    ctx.save();ctx.globalCompositeOperation='lighter';
    const rg=ctx.createRadialGradient(x,y-20*s,0,x,y-20*s,90*s);rg.addColorStop(0,`rgba(255,140,40,${0.45*a})`);rg.addColorStop(1,'rgba(255,90,20,0)');ctx.fillStyle=rg;ctx.fillRect(x-90*s,y-110*s,180*s,180*s);
    ctx.restore();
    // embers bed
    ctx.fillStyle=`rgba(60,18,10,${a})`;ctx.beginPath();ctx.ellipse(x,y,26*s,6*s,0,0,7);ctx.fill();
    const tongues=[[-9,0.75,0.0],[8,0.85,1.7],[0,1.1,3.3],[-3,0.6,5.1]];
    const layers=[['#d2331a',1.0],['#ff7a1c',0.72],['#ffd36a',0.42]];
    layers.forEach(([c,m],li)=>{ctx.fillStyle=c;ctx.globalAlpha=a*(li==2?0.95:0.92);
      tongues.forEach(([dx,hh,ph])=>{const fl=noise1(t*6+f.ph+ph)*0.25+noise1(t*2.3+f.ph*2+ph)*0.15;const h=60*s*hh*m*(1+fl);const w=15*s*m*(0.9+0.2*hh);const sway=noise1(t*3+ph+f.ph)*8*s*m;
        ctx.beginPath();ctx.moveTo(x+dx*s-w,y);ctx.bezierCurveTo(x+dx*s-w*1.1,y-h*0.45,x+dx*s+sway-w*0.2,y-h*0.7,x+dx*s+sway*1.6,y-h);ctx.bezierCurveTo(x+dx*s+sway+w*0.3,y-h*0.65,x+dx*s+w*1.1,y-h*0.4,x+dx*s+w,y);ctx.closePath();ctx.fill();});});
    ctx.globalAlpha=1;});
}
function drawSmokePuffs(S){const t=S.t;
  FIRES.forEach(f=>{const tk=CT[f.k];const age=t-tk;if(age<0||age>2.6)return;const a=Math.sin(Math.PI*cl(age/2.6))*0.5;

    if(t>=T100){const age=(t-T100)/1.4;if(age<1){ctx.save();ctx.globalCompositeOperation='lighter';const rg=ctx.createRadialGradient(cx,cy,r*0.5,cx,cy,r*3);rg.addColorStop(0,`rgba(255,236,190,${0.6*(1-age)})`);rg.addColorStop(1,'rgba(255,236,190,0)');ctx.fillStyle=rg;ctx.fillRect(cx-r*3,cy-r*3,r*6,r*6);ctx.restore();}}
  }
  // the ayah after 100 (held for the screenshot frame)
  const a2=ss(TXT,TXT+1.4,t)*(1-ss(TLOOP-0.1,TLOOP+0.8,t));
  if(a2>0){
    ctx.save();const sg=ctx.createLinearGradient(0,230,0,800);sg.addColorStop(0,'rgba(20,40,60,0)');sg.addColorStop(0.3,`rgba(20,40,60,${0.12*a2})`);sg.addColorStop(0.75,`rgba(20,40,60,${0.1*a2})`);sg.addColorStop(1,'rgba(20,40,60,0)');ctx.fillStyle=sg;ctx.fillRect(0,230,W,570);ctx.restore();
    txt(AR2,FX,428,'84px AmiriQ','#fff6e6',a2,14);
    txt(EN2a,FX,556,'italic 50px CormI','#fffaf2',a2,12);
    txt(EN2b,FX,614,'italic 50px CormI','#fffaf2',a2,12);
    txt(REF2,FX,684,'500 26px Cinzel','#fff3dc',0.9*a2,10,'6px');
    txt('AYAH STUDIO',FX,1300,'500 26px Cinzel','rgba(255,248,232,1)',0.55*a2,8,'9px');
  }
  // frame-0 state returns during the loop dissolve (counter back to 0)
}

function draw(t){
  const S=state(t);
  if(t>=TLOOP){ // native dissolve at the loop seam: same place, garden fades back to the first frame
    const m=sm(inv(TLOOP,END,t));
    ctx=ctx0;drawScene(S);
    ctx=offx;offx.clearRect(0,0,W,H);const S0=state(t-END);drawScene(S0);ctx=ctx0;
    ctx0.save();ctx0.globalAlpha=m;ctx0.drawImage(off,0,0);ctx0.restore();
    drawUI(S);ctx=offx;offx.clearRect(0,0,W,H);drawUI(S0);ctx=ctx0;
    ctx0.save();ctx0.globalAlpha=ss(0.45,1,m);ctx0.drawImage(off,0,0);ctx0.restore();
    return;
  }
  ctx=ctx0;drawScene(S);drawUI(S);
}
function events(){const ev=[];for(let k=1;k<=N;k++)ev.push({type:'count',k,t:CT[k]});ev.push({type:'end',t:END});ev.push({type:'meta',T100,TB,TXT,TLOOP,END});return ev;}
window.draw=draw;window.events=events;window.REAL_END=()=>END;window.CT=CT;
window.ready=(async()=>{await document.fonts.load('100px AmiriQ');await document.fonts.load('italic 50px CormI');await document.fonts.load('30px Corm');await document.fonts.load('600 62px Cinzel');await document.fonts.load('500 28px Cinzel');return true;})();
