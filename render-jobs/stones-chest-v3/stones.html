// ============ weight and momentum: every frame of the drawn motion is passed through springs ============

const DYN={dt:1/240, t0:-6, frames:[]};

// ============ secondary motion: scarf and hem in the wind ============
const slowRate=t=>1; const amb=t=>t;

    for(let it=0;it<4;it++) for(let k=1;k<N;k++){const a=pts[k-1],b=pts[k];const dx=b[0]-a[0],dy=b[1]-a[1];const d=Math.hypot(dx,dy)||1;const df=(d-segL)/d; if(k>1){a[0]+=dx*df*.5;a[1]+=dy*df*.5;b[0]-=dx*df*.5;b[1]-=dy*df*.5;}else{b[0]-=dx*df;b[1]-=dy*df;}}

    const hip=sk.hip, perp=[-sk.uy,sk.ux];
    if(!hem){ hem=[0,1].map(i=>{ const a=[hip[0]+perp[0]*(i?-5:5),hip[1]+perp[1]*(i?-5:5)]; const q=[];for(let k=0;k<HN;k++) q.push([a[0],a[1]+k*HL]); return {p:q,o:q.map(v=>[...v])}; }); }

      for(let k=1;k<HN;k++){ const p=h.p[k],o=h.o[k]; const vx=(p[0]-o[0])*.975, vy=(p[1]-o[1])*.975; h.o[k]=[p[0],p[1]];
        p[0]+=vx+(-wind*.42*(k/HN))*dt2*60; p[1]+=vy+560*dt2; }
