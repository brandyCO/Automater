</style></head><body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// Snoozed (2:152). One continuous take, deterministic draw(t), loops at END.
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const END=40.9, W_=1080, H_=1920;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,u)=>a+(b-a)*u;
const sm=u=>{u=clamp(u);return u*u*u*(u*(u*6-15)+10);};
const inv=(a,b,t)=>clamp((t-a)/(b-a));
const ss=(a,b,t)=>sm(inv(a,b,t));
const bell=(a,b,t)=>{const m=(a+b)/2;return ss(a,m,t)*(1-ss(m,b,t));};
const EZ={io:sm, lin:u=>u, o:u=>1-Math.pow(1-u,3), i:u=>u*u*u, o2:u=>Math.sin(u*Math.PI/2), q:u=>u<.5?2*u*u:1-2*(1-u)*(1-u)};
function K(keys,t){
  if(t<=keys[0][0]) return keys[0][1];
  for(let i=0;i<keys.length-1;i++){const a=keys[i],b=keys[i+1]; if(t<=b[0]){const u=(t-a[0])/(b[0]-a[0]); return lerp(a[1],b[1],(EZ[b[2]||'io'])(u));}}
  return keys[keys.length-1][1];
}
function KV(keys,t){
  if(t<=keys[0][0]) return keys[0][1].slice();
  for(let i=0;i<keys.length-1;i++){const a=keys[i],b=keys[i+1]; if(t<=b[0]){const u=(EZ[b[2]||'io'])((t-a[0])/(b[0]-a[0])); return a[1].map((v,k)=>lerp(v,b[1][k],u));}}
  return keys[keys.length-1][1].slice();
}
function KL(keys,t){return Math.exp(K(keys.map(k=>[k[0],Math.log(k[1]),k[2]]),t));}
const mixc=(a,b,u)=>[lerp(a[0],b[0],u),lerp(a[1],b[1],u),lerp(a[2],b[2],u)];
const rgb=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const hx=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
const D2R=Math.PI/180;
const nrm=v=>{const l=Math.hypot(...v)||1;return v.map(x=>x/l);};
function rr(x,y,w,h,r){ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();}

// ---------------- timeline ----------------
const T={tap1:.95, hit1:1.0, ring2:3.2, tap2:4.6, hit2:4.68, ring3:7.6, tap3:8.65, ring4:9.5, tap4:10.1, ring5:10.9,
  hov:[11.6,13.25], stop:13.6, eff1:[13.85,14.55], eff2:[14.7,16.55], stand:[16.65,17.35], kneel:[18.0,18.8], sujood:[18.85,19.7], hush:[19.7,20.4], dhikr:[20.4,22.2], ANS:22.5,
  rise:[26.0,28.3], smile:[27.8,29.8], held:[30.2,36.2], glide:[36.2,39.4], reset:39.5, night:[38.0,40.0], ring0:39.85};
const RINGS=[[T.ring0-END,T.tap1,'5:10'],[T.ring2,T.tap2,'5:19'],[T.ring3,T.tap3,'5:28'],[T.ring4,T.tap4,'5:37'],[T.ring5,T.stop,'5:46'],[T.ring0,T.tap1+END,'5:10']];
const TAPS=[[T.tap1,'s'],[T.tap2,'s'],[T.tap3,'s'],[T.tap4,'s'],[T.stop,'x'],[T.tap1+END,'s']];
const HITS=[[T.hit1,60],[T.hit2,95]];
function hitOff(t){let d=0;for(const[h,a]of HITS){const x=t-h;if(x<0)continue;d+=x<.1?a*sm(x/.1):a*Math.exp(-(x-.1)*3.2)*Math.cos((x-.1)*5.2);}return d;}
// the alarm: which ring is live, and a soft on/off buzz pattern
function ringState(t){for(const[a,b,lab]of RINGS){if(t>=a&&t<b) return {on:1,lab,a,b};} return null;}
function buzz(t){const r=ringState(t); if(!r) return 0; const u=(t-r.a)%0.95; return ss(0,.04,u)*(1-ss(.5,.56,u))*ss(r.a,r.a+.05,t)*(1-ss(r.b-.03,r.b,t));}
function lastLabel(t){let lab='5:10';for(const[a,b,l]of RINGS){if(t>=a-.3) lab=l;} return lab;}

// ---------------- world (3D-ish: screen y = y + 0.35 z) ----------------
const ZK=.35, proj=p=>[p[0],p[1]+ZK*p[2]];
const MAT=985, FLOOR=1110, PHONE=[272,816], SNOOZE=[272,846], STOP=[272,874];

// heaviness of the blanket: the staircase (two blows, then smaller settles)
function heavy(t){
  let h=K([[0,.32],[T.hit1,.32],[T.hit1+.16,.66,'o'],[T.hit2,.66],[T.hit2+.18,1.0,'o'],[T.tap3,1.0],[T.tap3+.6,1.07],[T.tap4,1.07],[T.tap4+.6,1.13]],t);
  for(const[hh,a]of [[T.hit1,.10],[T.hit2,.16],[T.tap3,.03],[T.tap4,.025]]){const x=t-hh-.14; if(x>0) h+=a*Math.exp(-x*4.2)*Math.sin(x*15);}
  return h;
}
// a ripple that runs down the blanket from his shoulder to his feet after each blow
function ripple(sAlong,t){let r=0;for(const[hh,a]of [[T.hit1,9],[T.hit2,14],[T.tap3,3],[T.tap4,2.5]]){const x=t-hh-.08; if(x<=0||x>1.6) continue; const c=-40+x*520; r+=a*Math.exp(-((sAlong-c)**2)/(2*60*60))*Math.exp(-x*1.6)*sm(x/.12);} return r;}
// how hard he reaches for the phone (curls his body toward it)
function reachAmt(t){return Math.max(bell(-.9,1.9,t)*1, bell(3.5,5.5,t)*.95, bell(8.1,9.6,t)*.75, bell(10.0,11.2,t)*.55, ss(11.7,12.25,t)*(1-ss(14.3,14.9,t))*.85);}

// ---------------- the man's pose ----------------
const L=148, HD=84, RH=60, SHW=90, UA=114, FA=106, TH=88, SH=80;
const TW=u=>u<.55?lerp(80,76,sm(u/.55)):lerp(76,92,sm((u-.55)/.4));
function pose(t){
  const s={t};
  const ra=reachAmt(t); s.ra=ra;
  const hv=heavy(t); s.hv=hv;
  // torso rotation in the screen plane: -90 lying on his side facing us (head to the left), 0 upright
  s.rot=K([[0,-90],[T.eff1[0],-90],[T.eff1[0]+.42,-79,'q'],[T.eff1[1],-90,'io'],[T.eff2[0],-90],[T.eff2[0]+.75,-52,'q'],[T.eff2[1]-.15,0],[END,0]],t)-7*ra;
  // bow toward us (radians): 0 upright, about 1.75 in sujood
  s.bow=K([[0,0],[T.eff2[1],0],[T.stand[0]+.3,.32],[T.stand[1],0],[T.kneel[0],0],[T.kneel[0]+.4,.12],[T.kneel[1],.05],[T.sujood[0]+.15,.35],[T.sujood[1],1.76,'io'],[T.rise[0],1.76],[T.rise[1],.06],[END,.06]],t);
  const H=KV([[0,[650,903,0]],[T.eff1[0],[650,903,0]],[T.eff1[0]+.42,[646,897,0],'q'],[T.eff1[1],[650,903,0]],[T.eff2[0],[650,903,0]],[T.eff2[0]+.75,[648,928,0]],[T.eff2[1]-.15,[650,968,96]],[T.eff2[1],[649,969,105]],
    [T.stand[0],[649,969,105]],[T.stand[0]+.3,[648,962,170],'i'],[T.stand[1],[646,944,300],'o'],[T.kneel[0],[646,944,300]],[T.kneel[0]+.35,[643,982,286],'i'],[T.kneel[1],[640,1020,262],'o'],[T.sujood[0],[640,1020,262]],[T.sujood[1],[640,1030,238]],[T.rise[0],[640,1030,238]],[T.rise[1],[640,1052,226]],[END,[640,1052,226]]],t);
  const lying=clamp(-s.rot/90);
  H[0]-=14*ra; H[1]+=(3+9*Math.max(hv,0))*lying;
  // breathing
  const rate=K([[0,.27],[T.hit2,.3],[T.stop,.32],[T.eff2[1],.42],[T.sujood[1],.3],[T.ANS,.22],[26,.17],[END,.2]],t);
  s.br=Math.sin(2*Math.PI*phaseInt(t))*K([[0,.6],[T.hit2,.9],[T.eff2[1],1.2],[T.ANS,.7],[24,1.1],[28,.6],[END,.6]],t);
  s.H=H; const r=s.rot*D2R, b=s.bow;
  const Rz=v=>[v[0]*Math.cos(r)-v[1]*Math.sin(r), v[0]*Math.sin(r)+v[1]*Math.cos(r), v[2]];
  s.A=Rz([0,-Math.cos(b),Math.sin(b)]); s.Wd=Rz([1,0,0]); s.D=Rz([0,Math.sin(b),Math.cos(b)]);
  const add=(p,v,k)=>[p[0]+v[0]*k,p[1]+v[1]*k,p[2]+v[2]*k];
  s.L2W3=(lx,ly,lz=0)=>add(add(add(H,s.Wd,lx),s.A,-ly),s.D,lz);
  s.neck=add(H,s.A,L*(1+.006*s.br));
  s.head=add(s.neck,s.A,HD); s.head[1]+=lying*(3*Math.max(hv,0)) ; // his head sinks into the pillow
  // legs: thigh and shin directions (3D), the same for both legs with a little spread
  s.thigh=nrm(KV([[0,[1,.12,0]],[T.eff2[0]+.95,[1,.1,0]],[T.eff2[1],[.1,.04,1]],[T.stand[0],[.1,.04,1]],[T.stand[1],[0,1,.02]],[T.kneel[0],[0,1,.02]],[T.kneel[0]+.35,[0,1,.35]],[T.kneel[1],[0,1,.22]],[T.sujood[0],[0,1,.22]],[T.sujood[1],[0,.86,.5]],[T.rise[0],[0,.86,.5]],[T.rise[1],[0,.34,1]],[END,[0,.34,1]]],t));
  s.shin=nrm(KV([[0,[1,.06,0]],[T.eff2[0]+.95,[1,.05,0]],[T.eff2[1],[.02,1,.1]],[T.stand[0],[.02,1,.1]],[T.stand[1],[0,1,0]],[T.kneel[0],[0,1,0]],[T.kneel[0]+.4,[0,.7,-.5]],[T.kneel[1],[0,.12,-1]],[END,[0,.12,-1]]],t));
  // face
  s.lid=clamp(K([[0,.84],[T.hit1-.05,.86],[T.hit1+.1,1],[T.ring2+.25,1],[T.ring2+.55,.88],[T.tap2,.9],[T.hit2+.1,1],[T.ring3+.4,1],[T.ring3+.7,.94],[T.tap3+.3,1],[T.ring4+.3,1],[T.ring4+.5,.96],[T.tap4+.3,1],[T.ring5+.25,1],[T.ring5+.65,.82],[T.hov[0]+.3,.56],[T.hov[1],.5],[T.stop,.52],
    [T.eff1[0]+.2,.8],[T.eff1[1],.66],[T.eff2[0]+.3,.86],[T.eff2[1],.4],[T.stand[1],.5],[T.kneel[1],.45],[T.sujood[0]+.3,.7],[T.sujood[1],1],[T.rise[1]-.6,1],[END,1]],t)+blink(t));
  s.lookX=K([[0,0],[T.eff2[1],0],[T.eff2[1]+.3,-.25],[T.kneel[0]+.3,0],[END,0]],t);
  s.lookY=K([[0,-.75],[T.eff2[0],-.75],[T.eff2[0]+.6,.2],[T.eff2[1],.55],[T.stand[1],.95],[END,.95]],t);
  s.brow=K([[0,.65],[T.hit2,.75],[T.hit2+.3,.95],[T.hov[0],.85],[T.hov[1],.95],[T.eff2[1],.75],[T.kneel[1],.6],[T.ANS,.6],[T.ANS+3,.15],[T.rise[1],0],[END,0]],t);
  s.smile=K([[0,0],[T.smile[0],0],[T.smile[1],.75],[END,.75]],t);
  s.tilt=K([[0,-5],[T.eff2[0],-5],[T.eff2[1],0],[T.stand[1],2],[T.kneel[1],-2],[T.rise[1]+1,2],[END,2]],t);
  s.pitch=clamp(b/1.62)+K([[0,0],[T.kneel[1],0],[T.kneel[1]+.2,.1],[T.sujood[0]+.1,.12],[T.rise[1]-.3,0],[T.rise[1]+.6,.14],[END,.14]],t)*(1-clamp(b/1.62));
  s.lying=lying;
  return s;
}
function phaseInt(t){let ph=0;const n=Math.ceil(Math.max(t,0)/.05),dt=Math.max(t,0)/Math.max(1,n);for(let i=0;i<n;i++){const x=i*dt;ph+=K([[0,.27],[T.hit2,.3],[T.stop,.32],[T.eff2[1],.42],[T.sujood[1],.3],[T.ANS,.22],[26,.17],[END,.2]],x)*dt;}return ph;}
function blink(t){let b=0;for(const bt of [T.hov[0]+.55,T.eff2[1]+.25,T.kneel[0]+.4]){b=Math.max(b,bell(bt,bt+.22,t));}return b;}

// ---------------- hands ----------------
// keys mix world points {w}, 3D points {p3}, body-local points [lx,ly,lz], and the blanket edge {f:'edge'}
let CURS=null;
function toW(v){ if(v.w) return v.w; if(v.p3) return proj(v.p3); if(v.f==='edge') return blanketEdge(CURS); return proj(CURS.L2W3(v[0],v[1],v[2]||0)); }
function KH(keys,t){
  let i=1; if(t<=keys[0][0]) return toW(keys[0][1]); while(i<keys.length && t>keys[i][0]) i++;
  if(i>=keys.length) return toW(keys[keys.length-1][1]);
  const [a,va]=keys[i-1],[b,vb,e]=keys[i]; const u=(EZ[e||'io'])((t-a)/(b-a)); const A=toW(va), B=toW(vb); return [lerp(A[0],B[0],u),lerp(A[1],B[1],u)];
}
function puff(t){return 6+16*Math.max(heavy(t),0);}
function handsAt(s,t){
  const P=puff(t);
  const rest=[0,0,0]; // replaced below by a point on top of the blanket
  const onBl=(ly)=>[SHW-12+P,ly+172,0]; const REST={w:[404,842]};
  const A=KH([[-1.25,REST],[-0.5,{w:[372,826]}],[T.tap1-.08,{w:[SNOOZE[0]+6,SNOOZE[1]+4]}],[T.tap1+.12,{w:[SNOOZE[0]+4,SNOOZE[1]+8]}],[T.tap1+.8,{w:[360,832]}],[2.4,REST],
    [T.ring2+.5,REST],[T.ring2+1.0,{w:[372,830]}],[T.tap2-.06,{w:[SNOOZE[0]+6,SNOOZE[1]+4]}],[T.tap2+.15,{w:[SNOOZE[0]+5,SNOOZE[1]+9]}],[T.tap2+.9,{w:[366,836]}],[6.6,REST],
    [T.ring3+.3,REST],[T.ring3+.75,{w:[380,850]}],[T.tap3-.08,{w:[SNOOZE[0]+7,SNOOZE[1]+6]},'q'],[T.tap3+.15,{w:[SNOOZE[0]+7,SNOOZE[1]+12]}],[T.tap3+.8,{w:[384,880]}],
    [T.ring4+.15,{w:[384,880]}],[T.tap4-.06,{w:[SNOOZE[0]+9,SNOOZE[1]+10]},'q'],[T.tap4+.15,{w:[SNOOZE[0]+10,SNOOZE[1]+16]}],[T.tap4+.6,{w:[392,884]}],
    [T.ring5+.35,{w:[392,884]}],[T.hov[0],{w:[SNOOZE[0]+8,SNOOZE[1]-14]}],[T.hov[0]+.5,{w:[SNOOZE[0]+7,SNOOZE[1]-11]}],[T.hov[1],{w:[SNOOZE[0]+7,SNOOZE[1]-10]}],
    [T.stop-.12,{w:[STOP[0]+7,STOP[1]-2]}],[T.stop+.08,{w:[STOP[0]+6,STOP[1]+3]}],[T.eff1[0]+.2,{w:[396,880]}],[T.eff2[0]+.05,{w:[400,882]}],[T.eff2[0]+.4,[92,-40,10],'q'],[T.eff2[0]+.8,[96,-6,20],'q'],[T.eff2[0]+1.35,{w:[850,905]},'io'],[T.eff2[1]-.1,{w:[742,1012]}],[T.stand[0]+.15,{w:[742,1012]}],[T.stand[1]-.1,[62,8,30]],[T.stand[1]+.3,[4,-66,64]],[T.kneel[0],[4,-66,64]],[T.kneel[0]+.45,[56,40,40]],[T.kneel[1],[50,58,46]],
    [T.sujood[0]+.1,[50,58,46]],[T.sujood[1]-.35,{p3:[742,1106,404]}],[T.rise[0],{p3:[742,1106,404]}],[T.rise[1],[46,10,86]],[END+5,[46,10,86]]],t);
  const B=KH([[-2,[14,-96,52]],[T.eff1[0],[14,-96,52]],[T.eff1[0]+.3,{w:[560,980]}],[T.eff1[1],{w:[560,982]}],[T.eff2[0],{w:[566,982]}],[T.eff2[0]+.7,{w:[578,990]}],[T.eff2[1]-.15,{w:[560,1012]}],[T.stand[0]+.15,{w:[560,1012]}],[T.stand[1]-.1,[-62,8,30]],[T.stand[1]+.3,[-4,-70,70]],[T.kneel[0],[-4,-70,70]],[T.kneel[0]+.45,[-56,40,40]],[T.kneel[1],[-50,58,46]],
    [T.sujood[0]+.1,[-50,58,46]],[T.sujood[1]-.35,{p3:[538,1106,404]}],[T.rise[0],{p3:[538,1106,404]}],[T.rise[1],[-46,10,86]],[END+5,[-46,10,86]]],t);
  return {A,B};
}

// ---------------- camera ----------------
const CU=[148,812,2.8];
function cam(t){
  const k=[[0,CU],[.35,CU],[2.7,[470,860,1.72]],[5.4,[482,866,1.68]],[7.3,[560,958,1.1]],[8.3,[560,958,1.1]],[10.9,[372,862,2.0]],[T.stop,[376,862,2.08]],[T.eff2[0]+.4,[470,880,1.62]],[T.eff2[1],[560,940,1.36]],
    [T.stand[1],[600,968,1.42]],[T.kneel[0],[602,976,1.44]],[T.kneel[1],[612,1020,1.55]],[T.sujood[1],[624,1062,1.8]],[T.hush[1],[624,1060,1.84]],[T.dhikr[1]+.1,[470,900,1.22]],[T.ANS+2.2,[500,930,1.18]],[29.4,[570,990,1.06]],[T.glide[0],[570,990,1.06]],[T.glide[1],CU],[END,CU]];
  const zk=k.map(e=>[e[0],e[1][2],e[2]]), Z=KL(zk,t);
  let CX=K(k.map(e=>[e[0],e[1][0]]),t), CY=K(k.map(e=>[e[0],e[1][1]]),t);
  // keep the camera centre moving in step with the zoom on the long glide (no swing)
  if(t>T.glide[0]){const u=(1/Z-1/1.06)/(1/CU[2]-1/1.06); CX=lerp(570,CU[0],u); CY=lerp(990,CU[1],u);}
  const drift=(1-ss(T.ANS,T.ANS+3,t))*ss(.5,2,t);
  CX+=(2.2*Math.sin(t*.61)+1.3*Math.sin(t*1.37+1))*drift/Z; CY+=(1.8*Math.sin(t*.53+2)+1.1*Math.sin(t*1.11))*drift/Z;
  CY-=hitOff(t)/Z*.6;
  return {Z,CX,CY};
}
function setCam(c){ctx.setTransform(c.Z,0,0,c.Z,540-c.CX*c.Z,960-c.CY*c.Z);}
const toScr=(c,x,y)=>[540+(x-c.CX)*c.Z,960+(y-c.CY)*c.Z];

// ---------------- light ----------------
function warm(t){return K([[0,0],[T.ANS+.6,0],[31,1,'o2'],[T.night[0],1],[T.night[1],0],[END,0]],t);}
function dawnWin(t){return K([[0,0],[T.ANS,0],[29,1,'o2'],[T.night[0],1],[T.night[1],0],[END,0]],t);}
function goldPhone(t){return ss(T.ANS,T.ANS+.7,t)*(1-ss(T.night[0]+.2,T.night[0]+1.4,t));}
function spread(t){return K([[0,0],[T.ANS+.3,0],[T.ANS+7.5,1,'o']],t)*(1-ss(T.night[0],T.night[1],t));}
function screenLit(t){ // the cold alarm screen
  let v=0; for(const[a,b]of RINGS){ if(t>=a-.25&&t<b+1.2){ v=Math.max(v, ss(a-.25,a+.05,t)*(1-ss(b+.15,b+.75,t))); } }
  return v;
}

// ---------------- palette ----------------
const P={skin:hx('#e3a87b'),skinD:hx('#c98b60'),hair:hx('#221710'),beard:hx('#2a1b13'),shirt:hx('#a3aab4'),shirtD:hx('#848b96'),pants:hx('#3b4253'),pantsD:hx('#2d3342')};
const fc=(c,a=1)=>rgb(c,a);
const STARS=(()=>{const R=rng(7),a=[];for(let i=0;i<30;i++)a.push([R(),R(),R()]);return a;})();

// ---------------- room ----------------
const WIN=[28,430,280,340];
function drawRoom(t,W,c){
  setCam(c);
  // wall
  const g=ctx.createLinearGradient(0,200,0,1100); g.addColorStop(0,rgb(mixc([78,90,128],[206,146,104],W))); g.addColorStop(1,rgb(mixc([96,108,142],[226,170,120],W)));
  ctx.fillStyle=g; ctx.fillRect(-1200,-600,3600,1700);
  // window: night sky to dawn
  const [wx,wy,ww,wh]=WIN, Dw=dawnWin(t);
  ctx.fillStyle=rgb(mixc([196,190,182],[250,236,214],W)); rr(wx-16,wy-16,ww+32,wh+32,10); ctx.fill();
  const sky=ctx.createLinearGradient(0,wy,0,wy+wh); sky.addColorStop(0,rgb(mixc([14,22,52],[150,170,214],Dw))); sky.addColorStop(.55,rgb(mixc([24,36,76],[250,196,160],Dw))); sky.addColorStop(1,rgb(mixc([38,54,98],[255,226,170],Dw)));

  drawLegs(s); drawTorso(s); drawArm(s,-1); drawHead(s,tb);
  drawBlanket(s,tb,W);
  drawArm(s,1);
  drawBeams(t,c); drawAnswerBeam(t,c,s);
  grade(t,c,s); drawDhikr(t,c,s);
  drawText(t);
}
function events(){
  const ev=[];
  for(const[a,b,lab]of RINGS){ev.push({type:'ring',a,b});}
  for(const[tt,k]of TAPS){ev.push({type:'tap',t:tt,k});}
  const cur={type:'curves',dt:.05,W:[],D:[],G:[],BZ:[],HV:[],LY:[]};
  for(let t=0;t<=END+1e-6;t+=.05){cur.W.push(+warm(t).toFixed(4)); cur.D.push(+dawnWin(t).toFixed(4)); cur.G.push(+goldPhone(t).toFixed(4));}
  for(let t=0;t<=END+1e-6;t+=.01){cur.BZ.push(+buzz(t).toFixed(3));}
  ev.push(cur); ev.push({type:'T',T}); return ev;
}
// joint trace for the glitch scan: every joint on screen at time t
function trace(t){
  const tb=bodyTime(t); const c=cam(t); const s=pose(tb); CURS=s; s.hands=handsAt(s,tb); CURS=s;
  const out={}; const sc=p=>toScr(c,p[0],p[1]);
  out.hip=sc(proj(s.H)); out.neck=sc(proj(s.neck)); out.head=sc(proj(s.head));
  for(const sd of [-1,1]){const g=legPts(s,sd); out['knee'+sd]=sc(proj(g.kn)); out['foot'+sd]=sc(proj(g.ft)); out['sh'+sd]=sc(shoulderPt(s,sd,sd>0?s.ra:0));}
  out.handA=sc(s.hands.A); out.handB=sc(s.hands.B);
  const b=blanketShape(s,tb); if(b.edgeTop) out.edge=sc(b.edgeTop);
  out.cam=[c.CX*c.Z,c.CY*c.Z]; out.Z=c.Z; out.rot=s.rot; return out;
}
