<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'AmiriQ';src:url(amiri.woff2) format('woff2');}
@font-face{font-family:'CormI';src:url(cormi.woff2) format('woff2');}
@font-face{font-family:'Cinzel';src:url(cinzel.woff2) format('woff2');font-weight:400 900;}
html,body{margin:0;background:#000;overflow:hidden}
canvas{display:block}
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// ISTIGHFAR x100, the oasis. A glass pipeline comes down from a cloud over a desert at dusk.
// Each istighfar, one drop swells at its mouth, lets go and lands in the same hollow of sand,
// and each drop makes one change there: a pool, a sprout, grass, palms, a stream, a garden,
// until the whole desert is a garden with rivers under a rising sun (Nuh 71:10-12).
const W=1080,H=1920,HZ=880,FX=505;
const cv=document.getElementById('c'),ctx0=cv.getContext('2d');
const off=document.createElement('canvas');off.width=W;off.height=H;const offx=off.getContext('2d');
let ctx=ctx0;
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const inv=(a,b,v)=>cl((v-a)/(b-a));
const sm=x=>x*x*(3-2*x);
const ss=(a,b,v)=>sm(inv(a,b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const eob=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const hash=(i,j=0)=>{let h=Math.imul(i*374761393+j*668265263,1274126177);h^=h>>>13;h=Math.imul(h,1103515245);return((h^h>>>16)>>>0)/4294967296;};
function hx(c){return[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];}
function mixc(a,b,t){return[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];}
function rgb(c,a=1){return`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;}
function noise1(x){const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return lerp(hash(i,7)*2-1,hash(i+1,7)*2-1,u);}

// ---------- timeline: calm. 100 drops, about one a second, never rushed.
const N=100,CT=[0];
(function(){let t=1.7;CT[1]=t;for(let k=1;k<N;k++){let g=lerp(1.45,1.2,ss(3,20,k));if(k>=95)g+=[0.06,0.12,0.2,0.3,0.42][k-95];t+=g;CT[k+1]=t;}})();
const T100=CT[N],TB=T100+0.1,TXT=T100+2.4,TLOOP=T100+10.2,END=TLOOP+1.6;
function countAt(t){let lo=0,hi=N;while(lo<hi){const m=(lo+hi+1)>>1;if(CT[m]<=t)lo=m;else hi=m-1;}return lo;}
function prog(t){const k=countAt(t);let p=Math.max(0,k-3)/N;for(let j=Math.max(1,k-3);j<=k;j++)p+=sm(cl((t-CT[j])/0.6))/N;return Math.min(1,p);}
let TT=0;const G=(k,d=0.6)=>k<1?1:sm(cl((TT-CT[k])/d));const GP=(k,d=0.6)=>{if(k<1)return 1;const x=cl((TT-CT[k])/d);return x<=0?0:eob(x);};
const SUM=(a,b,d=0.6)=>{let s=0;for(let k=a;k<=b;k++)s+=G(k,d);return s;};

// ---------- ground plane: 1 world unit = 1 px at the spot
const D0=1000,K=230*D0,SPX=FX,SPY=HZ+K/D0; // the hollow where every drop lands (y 1160)
function gy(wz){return HZ+K/wz;} function gs(wz){return D0/wz;}
function g2s(wx,wz){return[FX+wx*gs(wz),gy(wz)];}
function s2g(x,y){const wz=K/Math.max(1,y-HZ);return[(x-FX)/gs(wz),wz];}
function gd(x,y){const [wx,wz]=s2g(x,y);return Math.hypot(wx,(wz-D0));}

// ---------- the pipeline: from a cloud on the left, a slow arc of glass down to a golden spout above the hollow
const PIPE=[[-40,660],[170,640],[330,610],[505,640],[505,730]]; // bezier: P0 C1 C2 P3 then straight to mouth
const MOUTH=[505,812];
function bez(p0,p1,p2,p3,u){const a=1-u;return[a*a*a*p0[0]+3*a*a*u*p1[0]+3*a*u*u*p2[0]+u*u*u*p3[0],a*a*a*p0[1]+3*a*a*u*p1[1]+3*a*u*u*p2[1]+u*u*u*p3[1]];}
const PIPEPTS=[];for(let i=0;i<=60;i++)PIPEPTS.push(bez([-40,776],[230,752],[505,722],[505,770],i/60));PIPEPTS.push([505,MOUTH[1]-14]);

// ---------- desert: dune layers (far to near)
function dunePts(seed,base,amp,f,sharp){const r=rng(seed),ph=[r()*6,r()*6,r()*6];const a=[];for(let x=-30;x<=W+30;x+=10){let v=0.6*Math.sin(x*f+ph[0])+0.3*Math.sin(x*f*2.1+ph[1])+0.1*Math.sin(x*f*4.3+ph[2]);v=Math.sign(v)*Math.pow(Math.abs(v),sharp);a.push([x,base-amp*v]);}return a;}
const DUNES=[dunePts(4,HZ-22,34,0.0058,0.8),dunePts(8,HZ-6,26,0.0085,0.9),dunePts(15,HZ+14,22,0.011,1.0)];
function duneY(L,x){const a=DUNES[L];const i=cl(Math.floor((x+30)/10),0,a.length-2);const f=((x+30)-i*10)/10;return lerp(a[i][1],a[i+1][1],f);}
// each far dune turns green on its own drop (51-56): 6 patches across the far dunes
const DPATCH=[{L:0,x:120,k:51},{L:0,x:860,k:52},{L:1,x:330,k:53},{L:1,x:720,k:54},{L:2,x:80,k:55},{L:2,x:980,k:56},{L:0,x:500,k:57},{L:2,x:520,k:58}];

// ---------- things that grow, each on its own drop
const IT=[];
// sprouts at the pool's edge (6-9)
IT.push({k:6,ty:'sprout',wx:-92,wz:D0+10,s:1},{k:8,ty:'sprout',wx:98,wz:D0+4,s:0.9});
// tufts around the pool, one per drop (11-20)
for(let i=0;i<10;i++){const a=Math.PI*(1.1+i*0.23);const R=70+hash(i,3)*40;IT.push({k:11+i,ty:'tuft',wx:Math.cos(a)*R*1.4,wz:D0+Math.sin(a)*R*0.9+20,s:1});}
// flowers at 13,16,19
IT.push({k:13,ty:'flower',wx:-120,wz:D0+40,s:1,c:0},{k:16,ty:'flower',wx:130,wz:D0+50,s:1,c:1},{k:19,ty:'flower',wx:-60,wz:D0-60,s:1,c:2});
// palm 1 (21-25), palm 2 (26-30)
IT.push({k:21,ty:'palm',wx:-170,wz:D0+60,s:1.0,ph:1},{k:26,ty:'palm',wx:190,wz:D0+140,s:0.85,ph:2});
// reeds, lily pads, bushes (31-39)
IT.push({k:31,ty:'reeds',wx:-30,wz:D0+30,s:1},{k:33,ty:'lily',wx:10,wz:D0-8,s:1},{k:35,ty:'flowerbed',wx:-230,wz:D0-80,s:1},{k:37,ty:'bush',wx:260,wz:D0-40,s:1},{k:39,ty:'bush',wx:-320,wz:D0+180,s:1},{k:49,ty:'lotus',wx:-14,wz:D0-4,s:1});
// fruit trees on the mid ground (59-64), far palms (65-68)
[[-420,2600],[380,2300],[-120,3800],[600,4200],[-700,3300],[150,6000]].forEach(([wx,wz],i)=>IT.push({k:59+i,ty:'fruit',wx,wz,s:1.1,c:hash(i,9),ph:i}));
[[-560,1900],[520,1700],[-260,5200],[820,3000]].forEach(([wx,wz],i)=>IT.push({k:65+i,ty:'palm',wx,wz,s:0.9,ph:i+3}));
// flower beds, one per drop (76-80)
[[-380,1250],[330,1350],[-150,1500]].forEach(([wx,wz],i)=>IT.push({k:[76,78,80][i],ty:'flowerbed',wx,wz,s:1}));
// life: a farm, sheep, gazelles, butterflies, kids playing, a kid with a kite
IT.push({k:74,ty:'house',wx:-1150,wz:3000,s:1.25},{k:75,ty:'field',wx:-860,wz:3050,s:1.25});
IT.push({k:77,ty:'sheep',wx:-780,wz:2250,s:1.5,n:2,ph:0},{k:79,ty:'sheep',wx:-560,wz:2450,s:1.5,n:2,ph:2});
IT.push({k:85,ty:'gazelle',wx:300,wz:1450,s:1.15,ph:0});
IT.push({k:86,ty:'butterfly',wx:-60,wz:D0+30,s:1});
IT.push({k:87,ty:'kids',wx:330,wz:3400,s:2.6,ph:0});
IT.push({k:88,ty:'kitekid',wx:720,wz:2000,s:2.0,ph:0});
IT.forEach(it=>{const [x,y]=g2s(it.wx,it.wz);it.x=x;it.y=y;});
IT.sort((a,b)=>a.y-b.y);

// the green carpet spreads from the hollow: ring radius grows on drops 10-40
const RSTEP=[0];for(let k=1;k<=N;k++)RSTEP.push(k>=10&&k<=40?(k<20?16:k<30?60:180):0);
function greenR(){let r=0;for(let k=10;k<=40;k++)r+=RSTEP[k]*G(k,0.8);return r;}
const RFULL=(function(){let r=0;for(let k=10;k<=40;k++)r+=RSTEP[k];return r;})();
// grass blades scattered over the ground; each one sprouts on the drop whose ring reaches it
const GR=[];(function(){const r=rng(31);let acc=[0];for(let k=1;k<=N;k++)acc.push(acc[k-1]+RSTEP[k]);
  for(let i=0;i<5600;i++){const y=HZ+8+Math.pow(r(),1.5)*(H-HZ);const x=r()*1150-35;const d=gd(x,y);let kk=0;for(let k=10;k<=40;k++){if(acc[k]>=d+8){kk=k;break;}}if(!kk)kk=41+Math.floor(r()*10);
    const s=gs(s2g(x,y)[1]);if(Math.hypot((x-SPX)/1.8,(y-SPY))<26)continue;GR.push({x,y,h:Math.min(70,s*(14+r()*20)),lean:(r()-0.5)*0.7,k:kk,c:r(),ph:r()*6.28});}GR.sort((a,b)=>a.y-b.y);})();
const FL=[];(function(){const r=rng(41);for(let i=0;i<150;i++){const y=HZ+20+Math.pow(r(),1.3)*(H-HZ-20);const x=r()*1100-10;const s=gs(s2g(x,y)[1]);const d=gd(x,y);FL.push({x,y,s:Math.min(7,s*(2.6+r()*2.4)),k:Math.min(99,40+Math.round(cl(d/2400)*40)+(r()*4|0)),c:r()<0.5?0:(r()<0.6?1:2),ph:r()*6});}FL.sort((a,b)=>a.y-b.y);})();

// streams: from the pool toward us (41-48), and a river from the horizon (67-70)
const ST1=[],ST2=[];for(let i=0;i<=40;i++){const u=i/40;const wz=D0/(1+u*3.3);ST1.push([Math.sin(u*4)*90+u*u*260,wz]);const wz2=9000/(1+u*14);ST2.push([700+Math.sin(u*3.2)*200-u*u*200,wz2]);}
const STREAMS=[{pts:ST1,k0:41,n:8,w0:16,w1:34},{pts:ST2,k0:67,n:4,w0:30,w1:60}];

// ---------- palettes (dusk desert -> morning garden)
const SKY_T=[[0,'#04060e'],[0.3,'#0a1026'],[0.58,'#1f2c55'],[0.86,'#2d4f86'],[1,'#3b78ad']];
const SKY_M=[[0,'#0a1128'],[0.3,'#16214a'],[0.6,'#4a3a66'],[0.74,'#6a5a8a'],[0.86,'#cf9a8e'],[1,'#a9d4e0']];
const SKY_H=[[0,'#1a2242'],[0.3,'#2c3458'],[0.6,'#c47c66'],[0.74,'#d99a7a'],[0.86,'#f6c690'],[1,'#ffe6b2']];
const SAND_F=[[0,'#5a5c7e'],[0.3,'#66627c'],[0.62,'#b9734f'],[0.78,'#c08a62'],[1,'#c9a074']];
const SAND_N=[[0,'#25263a'],[0.3,'#302c40'],[0.62,'#7a4934'],[0.78,'#8a5c40'],[1,'#9b7250']];
const DUNEC=[['#9a5a46','#6d8f6a'],['#a8644a','#5f8f55'],['#b36d4e','#55894a']];

function state(t){return{t,P:prog(t),k:countAt(t),B:ss(TB,TB+4.5,t)};}
function camZ(S){return lerp(1.28,1.0,ss(0,1,S.P*0.9+S.B*0.1));}

function drawScene(S){const {t,P,k,B}=S;TT=t;
  const pc=cl(P*0.98+B*0.02);
  ctx.save();const z=camZ(S);ctx.translate(SPX,SPY-120);ctx.scale(z,z);ctx.translate(-SPX,-(SPY-120));
  // sky
  let st=keysC(SKY_T,pc),sm_=keysC(SKY_M,pc),sh=keysC(SKY_H,pc);
  // dawn steps on drops 86-90 brighten the sky a notch each
  let g=ctx.createLinearGradient(0,-150,0,HZ+30);g.addColorStop(0,rgb(st));g.addColorStop(0.6,rgb(sm_));g.addColorStop(1,rgb(sh));ctx.fillStyle=g;ctx.fillRect(-120,-160,W+240,HZ+260);
  // stars fade as the dawn comes
  const star=1-ss(0.42,0.8,pc);if(star>0.01){ctx.save();for(let i=0;i<170;i++){const x=hash(i,1)*1100,y=hash(i,2)*820;const tw=0.6+0.4*Math.sin(t*(1+hash(i,3)*2)+i);ctx.fillStyle=`rgba(255,250,235,${star*tw*0.7*(1-y/700)})`;ctx.beginPath();ctx.arc(x,y,0.8+hash(i,4)*1.3,0,7);ctx.fill();}ctx.restore();}
  // the moon: a thin crescent high on the right, setting and fading as the dawn comes
  {const mo=1-ss(0.45,0.8,pc);if(mo>0.01){const mx=905,my=330+ss(0.2,0.8,pc)*120;ctx.save();ctx.globalCompositeOperation='lighter';const rg=ctx.createRadialGradient(mx,my,10,mx,my,220);rg.addColorStop(0,`rgba(200,214,255,${0.22*mo})`);rg.addColorStop(1,'rgba(200,214,255,0)');ctx.fillStyle=rg;ctx.fillRect(mx-220,my-220,440,440);ctx.restore();
    const mc=MOONC.getContext('2d');mc.clearRect(0,0,140,140);mc.globalCompositeOperation='source-over';mc.shadowColor='rgba(220,230,255,0.9)';mc.shadowBlur=22;mc.fillStyle='rgb(250,246,226)';mc.beginPath();mc.arc(70,70,30,0,7);mc.fill();mc.shadowBlur=0;mc.globalCompositeOperation='destination-out';mc.beginPath();mc.arc(83,61,28,0,7);mc.fill();ctx.save();ctx.globalAlpha=mo;ctx.drawImage(MOONC,mx-70,my-70);ctx.restore();}}
  // sun: rises one step per drop (91-95), rays at 100
  const sun=SUM(91,95,0.9)/5*0.85+B*0.15;
  if(sun>0.001){const sx=FX+140,sy=lerp(HZ+30,HZ-70,sun);ctx.save();ctx.globalCompositeOperation='lighter';
    let rg=ctx.createRadialGradient(sx,sy,0,sx,sy,560);rg.addColorStop(0,`rgba(255,226,170,${0.6*sun})`);rg.addColorStop(0.3,`rgba(255,200,140,${0.22*sun})`);rg.addColorStop(1,'rgba(255,190,130,0)');ctx.fillStyle=rg;ctx.fillRect(-120,-160,W+240,HZ+300);
    if(B>0){ctx.translate(sx,sy);for(let i=0;i<16;i++){const a=i/16*Math.PI*2+t*0.03;const w=0.05+hash(i,3)*0.04;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,1600,a-w,a+w);ctx.closePath();const rr=ctx.createRadialGradient(0,0,40,0,0,1300);rr.addColorStop(0,`rgba(255,236,190,${0.07*B})`);rr.addColorStop(1,'rgba(255,236,190,0)');ctx.fillStyle=rr;ctx.fill();}}
    ctx.restore();ctx.save();ctx.beginPath();ctx.arc(sx,sy,40,0,7);ctx.fillStyle=`rgba(255,246,220,${sun})`;ctx.shadowColor='rgba(255,220,160,0.9)';ctx.shadowBlur=50;ctx.fill();ctx.restore();}
  // golden clouds (96-99)
  for(let i=0;i<4;i++){const a=GP(96+i,1.0);if(a<=0.01)continue;const x=[820,210,960,620][i]+Math.sin(t*0.12+i)*14,y=[150,110,330,250][i];const r=160+i*20;const rg=ctx.createRadialGradient(x,y,0,x,y,r);const c=[255,226,190];rg.addColorStop(0,rgb(c,0.42*Math.min(1,a)));rg.addColorStop(0.6,rgb(c,0.18*Math.min(1,a)));rg.addColorStop(1,rgb(c,0));ctx.fillStyle=rg;ctx.fillRect(x-r,y-r,2*r,2*r);}
  // far dunes, each patch greens on its own drop
  for(let L=0;L<3;L++){const pts=DUNES[L];const nt=1-ss(0.3,0.62,pc);const base=mixc(hx(DUNEC[L][0]),[34,36,60],nt*0.82);const dusk=mixc(base,sm_,0.25-L*0.07);
    ctx.save();ctx.beginPath();ctx.moveTo(-40,H);pts.forEach(p=>ctx.lineTo(p[0],p[1]));ctx.lineTo(W+40,H);ctx.closePath();
    g=ctx.createLinearGradient(0,HZ-60,0,HZ+60);g.addColorStop(0,rgb(mixc(dusk,sh,0.3)));g.addColorStop(1,rgb(mixc(dusk,[60,30,25],0.25)));ctx.fillStyle=g;ctx.fill();ctx.clip();
    DPATCH.forEach(d=>{if(d.L!==L)return;const a=G(d.k,1.0);if(a<=0.01)return;const y=duneY(L,d.x);const r=300*a;const rg=ctx.createRadialGradient(d.x,y+20,0,d.x,y+20,r);const gc=hx(DUNEC[L][1]);rg.addColorStop(0,rgb(gc,0.95));rg.addColorStop(0.7,rgb(gc,0.9));rg.addColorStop(1,rgb(gc,0));ctx.fillStyle=rg;ctx.fillRect(d.x-r,y-r,2*r,2*r);});
    // crest light
    ctx.restore();ctx.save();ctx.strokeStyle=rgb(mixc(sh,[255,255,255],0.2),0.35);ctx.lineWidth=1.5;ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();ctx.restore();}
  // near ground: sand with soft ripples
  const sf=keysC(SAND_F,pc),sn=keysC(SAND_N,pc);
  g=ctx.createLinearGradient(0,HZ+10,0,H);g.addColorStop(0,rgb(mixc(sf,sh,0.25)));g.addColorStop(0.3,rgb(sf));g.addColorStop(1,rgb(sn));ctx.fillStyle=g;
  ctx.beginPath();ctx.moveTo(-60,H+80);for(let x=-60;x<=W+60;x+=20)ctx.lineTo(x,duneY(2,cl(x,-30,W+30))+18);ctx.lineTo(W+60,H+80);ctx.closePath();ctx.fill();
  // wind ripples in the sand (fade under the green)
  ctx.save();ctx.strokeStyle='rgba(255,220,180,0.10)';ctx.lineWidth=2;for(let i=0;i<26;i++){const wz=D0*0.25+i*i*14;const y=gy(wz);if(y<HZ+20)continue;ctx.beginPath();for(let x=-40;x<=W+40;x+=24){const yy=y+Math.sin(x*0.012+i*1.7)*6*gs(wz);x<-30?ctx.moveTo(x,yy):ctx.lineTo(x,yy);}ctx.stroke();}ctx.restore();
  {const nt=1-ss(0.3,0.62,pc);if(nt>0.01){ctx.save();ctx.globalCompositeOperation='lighter';const rg=ctx.createRadialGradient(860,HZ+40,10,860,HZ+40,520);rg.addColorStop(0,`rgba(150,165,220,${0.16*nt})`);rg.addColorStop(1,'rgba(150,165,220,0)');ctx.fillStyle=rg;ctx.fillRect(300,HZ-10,800,560);ctx.restore();}}
  // the green carpet: a soft disc on the ground that widens with every drop from 10 to 40
  const R=greenR();if(R>1){const green=mixc([92,140,62],[118,170,80],ss(0.5,1,P));
    for(const [rr,a] of [[R*1.22,0.12],[R*1.12,0.2],[R*1.03,0.35],[R*0.95,0.6],[R*0.86,1]]){ctx.fillStyle=rgb(green,a);ctx.beginPath();for(let i=0;i<=72;i++){const an=i/72*Math.PI*2;const wz=Math.max(60,D0+Math.sin(an)*rr);const [x,y]=g2s(Math.cos(an)*rr*1.25,wz);i?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.closePath();ctx.fill();}}
  // a later wash of green to the edges (drops 41-58)
  const wash=SUM(41,58,1.0)/18;if(wash>0.01){ctx.save();ctx.globalAlpha=wash*0.92;g=ctx.createLinearGradient(0,HZ+10,0,H);g.addColorStop(0,'rgb(108,150,84)');g.addColorStop(1,'rgb(70,120,52)');ctx.fillStyle=g;ctx.fillRect(-60,HZ+16,W+120,H-HZ+80);ctx.restore();}
  drawStreams(S,sh);
  drawPool(S,sh,sm_);
  drawGrowth(S,y=>y<SPY-4);
  drawMotes(S);
  drawGrowth(S,y=>y>=SPY-4);
  drawBirds(S);drawKite(S);
  {const nt=1-ss(0.28,0.66,pc);if(nt>0.01){ctx.save();ctx.globalCompositeOperation='multiply';const tc=mixc([255,255,255],[120,134,190],nt);g=ctx.createLinearGradient(0,HZ-110,0,HZ-30);g.addColorStop(0,'rgb(255,255,255)');g.addColorStop(1,rgb(tc));ctx.fillStyle=g;ctx.fillRect(-120,HZ-110,W+240,H-HZ+300);ctx.restore();}}
  ctx.restore();
  // grade
  g=ctx.createRadialGradient(SPX,SPY-200,250,SPX,SPY-200,1500);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(10,8,20,${lerp(0.55,0.2,ss(0.3,1,P))})`);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

    ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(x,y,6.5,13,0,0,7);ctx.fill();ctx.restore();}

  const cx=TCX,cy=TCY-6;const ra=k>0?sm(cl((t-CT[k])/0.42)):1;ctx.save();ctx.beginPath();ctx.rect(cx-60,cy-34,120,64);ctx.clip();ctx.font='600 48px Cinzel';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fffaf0';ctx.shadowColor='rgba(0,0,0,0.6)';ctx.shadowBlur=12;

  ctx.restore();}

function beadX(i,k,t){ // bead i (0..99): counted beads gather on the left, the rest wait on the right; each drop slides one across
  const sp=7.6;const leftW=k*sp,gap=BX1-BX0-100*sp;let x;
  if(i<k)x=BX0+i*sp+sp/2; else x=BX0+leftW+gap+(i-k)*sp+sp/2;
  if(i===k-1){const a=sm(cl((t-CT[k])/0.45));const from=BX0+(k-1)*sp+gap+sp/2;x=lerp(from,x,a);}
  return x;}
function beadY(x){const u=(x-BX0)/(BX1-BX0);return BY+Math.sin(Math.PI*u)*16;}

  {const sa=ss(0.55,0.9,P)*0.35+0.3*B;if(sa>0.005){ctx.save();const sg=ctx.createLinearGradient(0,240,0,720);sg.addColorStop(0,'rgba(18,30,52,0)');sg.addColorStop(0.3,`rgba(18,30,52,${sa})`);sg.addColorStop(0.75,`rgba(18,30,52,${sa*0.8})`);sg.addColorStop(1,'rgba(18,30,52,0)');ctx.fillStyle=sg;ctx.fillRect(0,240,W,480);ctx.restore();}}

  if(a1>0){ctx.save();ctx.font='84px AmiriQ';ctx.textAlign='center';ctx.globalAlpha=a1;ctx.shadowColor=`rgba(255,236,200,${0.18+0.4*pulse})`;ctx.shadowBlur=16+22*pulse;ctx.fillStyle='#fff6e6';ctx.fillText(AR1,FX,410);ctx.shadowColor='rgba(0,0,0,0.6)';ctx.shadowBlur=10;ctx.fillText(AR1,FX,410);ctx.restore();}
  txt(EN1,FX,488,'italic 38px CormI','#f6ecdc',0.95*a1,12);
  if(a1>0){ctx.save();ctx.globalAlpha=a1;
    drawTasbih(S,pulse);
    ctx.restore();
    if(t>=T100){const age=(t-T100)/1.6;if(age<1){ctx.save();ctx.globalCompositeOperation='lighter';const rg=ctx.createRadialGradient(FX,580,10,FX,580,420);rg.addColorStop(0,`rgba(255,232,180,${0.35*(1-age)})`);rg.addColorStop(1,'rgba(255,232,180,0)');ctx.fillStyle=rg;ctx.fillRect(FX-420,160,840,840);ctx.restore();}}
  }
  const a2=ss(TXT,TXT+1.4,t)*(1-ss(TLOOP-0.1,TLOOP+0.8,t));
  if(a2>0){txt(AR2,FX,420,'70px AmiriQ','#fff6e6',a2,14);txt(EN2a,FX,530,'italic 46px CormI','#fffaf2',a2,12);txt(EN2b,FX,586,'italic 46px CormI','#fffaf2',a2,12);txt(REF2,FX,650,'500 24px Cinzel','#fff3dc',0.9*a2,10,'6px');txt('AYAH STUDIO',FX,1300,'500 24px Cinzel','rgba(255,248,232,1)',0.5*a2,8,'9px');}
}
function frame(S){drawScene(S);drawPipe(S);drawDrops(S);}
function draw(t){const S=state(t);
  if(t>=TLOOP){const m=sm(inv(TLOOP,END,t));ctx=ctx0;frame(S);ctx=offx;offx.clearRect(0,0,W,H);const S0=state(t-END);frame(S0);ctx=ctx0;ctx0.save();ctx0.globalAlpha=m;ctx0.drawImage(off,0,0);ctx0.restore();

function evType(k){return EVP[k][2];}
